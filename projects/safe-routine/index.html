<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeRoutine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#0c1830; --navy2:#13223f; --navy-line:#22345a;
  --brand-blue:#2f9bff; --brand-red:#e8402f; --brand-orange:#ff8a1f;
  --primary:#1f74db; --primary-ink:#ffffff; --accent:#e8402f;
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e5e9f1;
  --border:#dde2ec; --text:#0f1b2e; --text-dim:#5a6579; --text-faint:#8a94a7;
  --ok:#14804a; --warn:#b26a00; --bad:#c62f1e; --info:#1f74db; --violet:#6d4fd8; --slate:#5a6579;
  --shadow:0 1px 2px rgba(15,27,46,.06), 0 4px 16px rgba(15,27,46,.06);
  --shadow-lg:0 12px 40px rgba(8,16,34,.22);
  --radius:14px; --radius-sm:10px;
  --nav-w:236px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a111e; --surface:#111a2b; --surface2:#162236; --surface3:#1c2a42;
    --border:#243350; --text:#e9eef7; --text-dim:#9aa7bf; --text-faint:#6f7d97;
    --ok:#3ccf8a; --warn:#f0a83c; --bad:#ff6b57; --info:#5aa9ff; --violet:#a28bff; --slate:#9aa7bf;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a111e; --surface:#111a2b; --surface2:#162236; --surface3:#1c2a42;
  --border:#243350; --text:#e9eef7; --text-dim:#9aa7bf; --text-faint:#6f7d97;
  --ok:#3ccf8a; --warn:#f0a83c; --bad:#ff6b57; --info:#5aa9ff; --violet:#a28bff; --slate:#9aa7bf;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg); color:var(--text); font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14.5px; line-height:1.45; -webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
h1,h2,h3,h4{margin:0; text-wrap:balance; letter-spacing:-.015em}
h1{font-size:26px; font-weight:800}
h2{font-size:20px; font-weight:750}
h3{font-size:16px; font-weight:700}
h4{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim)}
p{margin:0}
a{color:var(--primary); text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-blue); outline-offset:2px; border-radius:6px}
svg.i{width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
svg.i.sm{width:15px; height:15px}
svg.i.lg{width:22px; height:22px}

/* ---------- shell ---------- */
#app{display:flex; min-height:100vh}
#side{width:var(--nav-w); flex:none; background:var(--navy); color:#d7e1f2; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:18px 12px; border-right:1px solid var(--navy-line)}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px}
.brand .name{font-weight:800; font-size:18px; letter-spacing:-.02em; color:#fff}
.brand .name b{color:var(--brand-orange); font-weight:800}
.brand .co{font-size:11.5px; color:#8da0c2; margin-top:1px}
.navlist{display:flex; flex-direction:column; gap:2px; overflow:auto; flex:1; margin:0 -4px; padding:0 4px}
.navlist button{display:flex; align-items:center; gap:11px; width:100%; text-align:left; border:0; background:transparent; color:#b7c4dc; padding:9px 11px; border-radius:10px; font-weight:600; font-size:14px; position:relative}
.navlist button:hover{background:var(--navy2); color:#fff}
.navlist button.active{background:linear-gradient(90deg, rgba(47,155,255,.20), rgba(47,155,255,.06)); color:#fff}
.navlist button.active::before{content:""; position:absolute; left:-4px; top:9px; bottom:9px; width:3px; border-radius:3px; background:linear-gradient(var(--brand-blue) 50%, var(--brand-red) 50%)}
.navlist .count{margin-left:auto; background:var(--brand-red); color:#fff; font-size:11px; font-weight:700; border-radius:20px; padding:1px 7px; min-width:20px; text-align:center}
.navsec{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:#6f84a9; padding:14px 11px 6px; font-weight:700}
.rolecard{margin-top:12px; background:var(--navy2); border:1px solid var(--navy-line); border-radius:12px; padding:10px}
.rolecard label{display:block; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#8da0c2; margin-bottom:6px; font-weight:700}
.rolecard select{width:100%; background:#0a1426; color:#fff; border:1px solid var(--navy-line); border-radius:8px; padding:8px; font-size:13px; text-overflow:ellipsis}
.rolecard .who{display:flex; align-items:center; gap:9px; margin-top:9px}
.rolecard .who .nm{font-weight:700; color:#fff; font-size:13.5px}
.rolecard .who .rl{font-size:11.5px; color:#8da0c2}

#mainwrap{flex:1; min-width:0; display:flex; flex-direction:column}
#top{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; padding:12px 24px; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--border)}
#top .crumb{font-weight:750; font-size:17px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#top .spacer{flex:1}
.searchbtn{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); border-radius:10px; padding:8px 12px; min-width:240px; box-shadow:var(--shadow)}
.searchbtn kbd{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:11px; border:1px solid var(--border); border-radius:5px; padding:1px 5px; background:var(--surface2)}
.iconbtn{position:relative; display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); box-shadow:var(--shadow)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn .dot{position:absolute; top:-5px; right:-5px; background:var(--brand-red); color:#fff; font-size:10.5px; font-weight:700; border-radius:20px; padding:1px 6px; border:2px solid var(--bg)}
#banner{position:sticky; top:var(--top-h,63px); z-index:29; margin:14px 24px 0; padding:9px 13px; border-radius:10px; background:color-mix(in srgb, var(--warn) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--warn) 35%, transparent); color:var(--text); font-size:13px; display:flex; flex-direction:column; gap:6px}
#banner .bl{display:flex; gap:8px; align-items:flex-start}
#banner .short{display:none}
/* Focused fields scroll clear of the sticky top bar + banner (heights kept in --top-h / --banner-h by syncTopH). */
html{scroll-padding-top:calc(var(--top-h,63px) + var(--banner-h,0px) + 8px)}
#main{padding:20px 24px 90px; max-width:1280px; width:100%}
#tabbar{display:none}

/* ---------- primitives ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.pad0{padding:0; overflow:hidden}
.card-h{display:flex; align-items:center; gap:10px; justify-content:space-between; margin-bottom:12px}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex; align-items:center; gap:8px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.row.top{align-items:flex-start}
.stack{display:flex; flex-direction:column; gap:10px}
.stack.tight{gap:6px}
.dim{color:var(--text-dim)} .faint{color:var(--text-faint)}
.small{font-size:12.5px} .tiny{font-size:11.5px}
.hint{font-size:12.5px; color:var(--text-dim)}
.sep{border:0; border-top:1px solid var(--border); margin:14px 0}
.pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.pagehead .sub{color:var(--text-dim); margin-top:4px}
.mt{margin-top:14px} .mt2{margin-top:22px}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 14px; font-weight:650; font-size:14px; white-space:nowrap; transition:transform .06s ease, background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary); border-color:var(--primary); color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.go{background:var(--ok); border-color:var(--ok); color:#fff}
.btn.danger{background:transparent; color:var(--bad); border-color:color-mix(in srgb, var(--bad) 45%, transparent)}
.btn.danger.solid{background:var(--bad); color:#fff}
.btn.ghost{background:transparent; border-color:transparent; box-shadow:none}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:6px 10px; font-size:12.5px; border-radius:8px}
.btn.lg{padding:13px 18px; font-size:15.5px; border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none}

.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:650; padding:3px 10px; border-radius:30px; white-space:nowrap; background:color-mix(in srgb, var(--c,var(--slate)) 13%, transparent); color:var(--c,var(--slate)); border:1px solid color-mix(in srgb, var(--c,var(--slate)) 28%, transparent)}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.nodot::before{display:none}
.pill.ok{--c:var(--ok)} .pill.warn{--c:var(--warn)} .pill.bad{--c:var(--bad)} .pill.info{--c:var(--info)} .pill.violet{--c:var(--violet)} .pill.slate{--c:var(--slate)}
.count{display:inline-flex; align-items:center; justify-content:center; background:var(--brand-red); color:#fff; font-size:11px; font-weight:700; border-radius:20px; padding:1px 7px; min-width:20px; margin-left:6px}
.avatar{width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:750; font-size:12px; color:#fff; flex:none; background:var(--av,#475569)}
.avatar.sm{width:24px; height:24px; font-size:10.5px}
.avatar.lg{width:40px; height:40px; font-size:14px}

.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field label{font-size:12.5px; font-weight:650; color:var(--text-dim)}
.field input,.field select,.field textarea, input.in, select.in, textarea.in{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 11px; color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus, .in:focus{outline:none; border-color:var(--brand-blue); box-shadow:0 0 0 3px color-mix(in srgb, var(--brand-blue) 22%, transparent)}
.field textarea, textarea.in{resize:vertical; min-height:84px}
.check{display:flex; gap:9px; align-items:flex-start; padding:9px 11px; border:1px solid var(--border); border-radius:10px; background:var(--surface)}
.check input{margin-top:3px; width:16px; height:16px; accent-color:var(--primary)}
.unitwrap{position:relative}
.unitwrap span{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--text-faint); pointer-events:none}
.unitwrap input{padding-right:52px}

table{width:100%; border-collapse:collapse}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--surface2)}
td{padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.tablewrap{overflow-x:auto}

.empty{padding:34px 16px; text-align:center; color:var(--text-dim)}
.empty svg{width:34px; height:34px; stroke:var(--text-faint); margin-bottom:8px}
.note{padding:10px 12px; border-radius:10px; background:var(--surface2); border:1px solid var(--border)}
.note .meta{font-size:11.5px; color:var(--text-faint); margin-bottom:3px}
.callout{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:12px; border:1px solid color-mix(in srgb, var(--c,var(--info)) 35%, transparent); background:color-mix(in srgb, var(--c,var(--info)) 9%, var(--surface)); font-size:13.5px}
.callout svg{color:var(--c,var(--info)); margin-top:1px}
.callout.warn{--c:var(--warn)} .callout.bad{--c:var(--bad)} .callout.ok{--c:var(--ok)}

/* ---------- KPI ---------- */
.kpi{position:relative; overflow:hidden}
.kpi .lbl{font-size:12.5px; color:var(--text-dim); font-weight:600; display:flex; align-items:center; gap:7px}
.kpi .num{font-family:"JetBrains Mono",monospace; font-size:30px; font-weight:600; letter-spacing:-.03em; margin-top:6px}
.kpi .foot{font-size:12px; color:var(--text-faint); margin-top:2px}
.kpi::after{content:""; position:absolute; right:-24px; top:-24px; width:84px; height:84px; border-radius:50%; background:color-mix(in srgb, var(--c,var(--brand-blue)) 10%, transparent)}
.kpi.alert{--c:var(--brand-red)}

/* ---------- job cards ---------- */
.jobcard{display:flex; flex-direction:column; gap:8px; padding:13px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow); cursor:pointer; position:relative; transition:border-color .15s, transform .1s}
.jobcard:hover{border-color:color-mix(in srgb, var(--brand-blue) 50%, var(--border))}
.jobcard::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:0 3px 3px 0; background:var(--pc,transparent)}
.jobcard .t1{display:flex; align-items:center; gap:8px; justify-content:space-between}
.jobcard .ref{font-family:"JetBrains Mono",monospace; font-weight:600; font-size:13px}
.jobcard .cust{font-weight:700; font-size:15px}
.jobcard .addr{font-size:12.5px; color:var(--text-dim); display:flex; gap:5px; align-items:center}
.jobcard .t3{display:flex; align-items:center; gap:8px; justify-content:space-between; margin-top:2px}
.prio-emergency{--pc:var(--bad)} .prio-high{--pc:var(--warn)} .prio-normal{--pc:var(--info)} .prio-low{--pc:var(--slate)}
.jobgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px}

.board{display:grid; grid-template-columns:repeat(6,minmax(220px,1fr)); gap:12px; overflow-x:auto; padding-bottom:6px}
.col{background:var(--surface2); border:1px solid var(--border); border-radius:14px; padding:10px; min-height:140px; display:flex; flex-direction:column; gap:9px}
.col .colh{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:13px; padding:2px 4px}
.col .jobcard{box-shadow:none}

/* ---------- hero ---------- */
.hero{background:linear-gradient(135deg, var(--navy) 0%, #142a52 100%); color:#fff; border-radius:18px; padding:20px 22px; position:relative; overflow:hidden; border:1px solid var(--navy-line)}
.hero::after{content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(47,155,255,.35), transparent 70%)}
.hero::before{content:""; position:absolute; left:-40px; bottom:-80px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(232,64,47,.28), transparent 70%)}
.hero > *{position:relative; z-index:1}
.hero .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#9fb5da; font-weight:700}
.hero h1,.hero h2{color:#fff}
.hero .dim{color:#b9c8e2}
.hero .btn{border-color:rgba(255,255,255,.18); background:rgba(255,255,255,.08); color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.16)}
.hero .btn.primary{background:var(--brand-blue); border-color:var(--brand-blue)}
.hero .btn.go{background:#18a35e; border-color:#18a35e}

/* ---------- stepper ---------- */
.steps{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; margin:16px 0 4px}
.steps .s{display:flex; flex-direction:column; gap:6px}
.steps .bar{height:6px; border-radius:6px; background:var(--surface3)}
.steps .s.done .bar{background:var(--ok)}
.steps .s.cur .bar{background:linear-gradient(90deg,var(--brand-blue),var(--brand-red))}
.steps .lb{font-size:11.5px; color:var(--text-faint); font-weight:600}
.steps .s.done .lb,.steps .s.cur .lb{color:var(--text)}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin:18px 0 16px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex; align-items:center; gap:7px; border:0; background:none; padding:10px 12px; font-weight:650; color:var(--text-dim); border-bottom:2px solid transparent; white-space:nowrap; margin-bottom:-1px}
.tabs button.active{color:var(--text); border-color:var(--primary)}
.seg{display:inline-flex; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; max-width:100%; overflow-x:auto}
.seg button{border:0; background:transparent; padding:6px 11px; border-radius:7px; font-weight:650; font-size:13px; color:var(--text-dim); display:inline-flex; gap:6px; align-items:center; white-space:nowrap; flex:none}
.seg button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}

/* ---------- timeline ---------- */
.tl{position:relative; padding-left:26px}
.tl::before{content:""; position:absolute; left:10px; top:6px; bottom:6px; width:2px; background:var(--border)}
.tl .ev{position:relative; padding:0 0 16px}
.tl .ev .dot{position:absolute; left:-26px; top:0; width:22px; height:22px; border-radius:50%; background:var(--surface); border:2px solid var(--c,var(--slate)); display:flex; align-items:center; justify-content:center; color:var(--c,var(--slate))}
.tl .ev .dot svg{width:12px; height:12px; stroke-width:2.4}
.tl .ev .meta{font-size:11.5px; color:var(--text-faint)}

/* ---------- misc ---------- */
.ring{--p:0; width:58px; height:58px; border-radius:50%; background:conic-gradient(var(--ok) calc(var(--p)*1%), var(--surface3) 0); display:flex; align-items:center; justify-content:center; flex:none}
.ring > span{width:44px; height:44px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-weight:600; font-size:12.5px}
.bars{display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:8px}
.bars .b{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end}
.bars .b .v{width:100%; max-width:44px; border-radius:7px 7px 3px 3px; background:linear-gradient(var(--brand-blue), color-mix(in srgb, var(--brand-blue) 55%, var(--surface))); min-height:3px}
.bars .b .n{font-family:"JetBrains Mono",monospace; font-size:11.5px; font-weight:600}
.bars .b .l{font-size:11px; color:var(--text-faint); white-space:nowrap}
.hbar{display:grid; grid-template-columns:130px 1fr 44px; gap:10px; align-items:center; margin:7px 0; font-size:13px}
.hbar .track{height:10px; border-radius:10px; background:var(--surface3); overflow:hidden}
.hbar .track > div{height:100%; border-radius:10px; background:linear-gradient(90deg,var(--brand-blue),var(--brand-red))}
.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px}
.thumb{position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:var(--surface2); aspect-ratio:4/3; cursor:zoom-in}
.thumb img,.thumb video{width:100%; height:100%; object-fit:cover; display:block}
.thumb .cap{position:absolute; left:6px; bottom:6px; font-size:11px; font-weight:700; background:rgba(8,16,34,.72); color:#fff; padding:2px 7px; border-radius:20px}
.kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px 18px}
.kv .k{font-size:11.5px; color:var(--text-faint); font-weight:650; text-transform:uppercase; letter-spacing:.06em}
.kv .v{font-weight:600; margin-top:2px; word-break:break-word}
.readgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px}
.lane{display:grid; grid-template-columns:170px minmax(0,1fr); gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border)}
.lane:last-child{border-bottom:0}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface2); border-radius:10px; padding:6px 10px; font-size:12.5px; cursor:pointer}
.chip:hover{border-color:var(--brand-blue)}
.alertrow{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border); cursor:pointer}
.alertrow:last-child{border-bottom:0}
.alertrow .ic{width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; background:color-mix(in srgb, var(--c,var(--info)) 14%, transparent); color:var(--c,var(--info))}
.lock{display:flex; gap:10px; align-items:center; padding:11px 14px; border-radius:12px; background:var(--surface2); border:1px dashed var(--border); color:var(--text-dim); font-size:13.5px; margin-top:12px}
.actionbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.sig{width:100%; height:160px; touch-action:none; background:#fff; border:1px solid var(--border); border-radius:12px; display:block}
#qrbox{background:#fff; padding:12px; border-radius:12px; display:inline-block}
.redtag{border:2px solid var(--bad); background:color-mix(in srgb, var(--bad) 8%, var(--surface)); border-radius:14px; padding:14px 16px}
.redtag .tagh{display:flex; align-items:center; gap:8px; color:var(--bad); font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:13px}

/* ---------- overlays ---------- */
.overlay{position:fixed; inset:0; background:rgba(6,12,26,.55); backdrop-filter:blur(3px); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; animation:fade .15s ease}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); width:min(620px,100%); max-height:90vh; overflow:auto; padding:22px; animation:pop .18s ease}
.modal.wide{width:min(860px,100%)}
.modal .mh{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px}
.modal .mf{display:flex; justify-content:flex-end; gap:8px; margin-top:18px; flex-wrap:wrap}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(420px,100%); background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-lg); z-index:101; display:flex; flex-direction:column; animation:slide .2s ease}
.drawer .dh{display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--border)}
.drawer .db{overflow:auto; padding:8px 10px; flex:1}
.notif{display:flex; gap:10px; padding:11px 10px; border-radius:10px; cursor:pointer}
.notif:hover{background:var(--surface2)}
.notif.unread{background:color-mix(in srgb, var(--brand-blue) 8%, transparent)}
.notif .nd{width:8px; height:8px; border-radius:50%; background:var(--brand-blue); margin-top:6px; flex:none}
.palette{width:min(620px,100%); align-self:flex-start; margin-top:10vh; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-lg); overflow:hidden; animation:pop .15s ease}
.palette .pin{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border)}
.palette .pin input{border:0; background:transparent; flex:1; font-size:16px; outline:none}
.palette .res{max-height:55vh; overflow:auto; padding:6px}
.palette .grp{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:10px 10px 4px; font-weight:700}
.palette .it{display:flex; gap:10px; align-items:center; padding:9px 10px; border-radius:9px; cursor:pointer}
.palette .it.sel,.palette .it:hover{background:var(--surface2)}
.lightbox{max-width:min(1000px,100%); max-height:90vh}
.lightbox img,.lightbox video{max-width:100%; max-height:84vh; border-radius:12px; display:block}
#toasts{position:fixed; z-index:200; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; align-items:flex-end}
.toast{background:var(--navy); color:#fff; padding:11px 15px; border-radius:12px; font-size:13.5px; box-shadow:var(--shadow-lg); max-width:340px; display:flex; gap:9px; align-items:flex-start; animation:pop .18s ease; border:1px solid var(--navy-line)}
.toast.bad{background:#7a1d12}
/* A modal is open (desktop): toasts go to the top right, so they don't cover the modal's buttons. */
body:has(#overlays .overlay) #toasts{top:18px; bottom:auto}
#setup{position:fixed; inset:0; z-index:150; background:var(--bg); overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:24px 16px}
#setup .setupcard{width:min(560px,100%); margin-top:6vh}
/* The safety banner stays visible above the first-start / setup screen. */
body:has(#setup) #banner{position:fixed; top:0; left:0; right:0; z-index:151}
body:has(#setup) #setup{padding-top:calc(var(--banner-h,0px) + 24px)}
.selfhint .short{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98)}to{opacity:1; transform:none}}
@keyframes slide{from{transform:translateX(30px); opacity:0}to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  #side{display:none}
  #top{padding:10px 16px}
  .searchbtn{min-width:0; width:38px; height:38px; padding:0; justify-content:center} .searchbtn span,.searchbtn kbd{display:none}
  #banner{margin:8px 12px 0; padding:6px 10px; font-size:12px; line-height:1.35; gap:4px}
  #banner .long{display:none} #banner .short{display:inline}
  #main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:repeat(6,minmax(240px,1fr))}
  .lane{grid-template-columns:minmax(0,1fr)}
  #tabbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--navy); border-top:1px solid var(--navy-line); padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  #tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:0; background:transparent; color:#9fb0cf; font-size:10.5px; font-weight:650; padding:6px 2px; border-radius:10px; position:relative}
  #tabbar button.active{color:#fff; background:var(--navy2)}
  #tabbar button .count{position:absolute; top:0; right:calc(50% - 22px); margin:0; font-size:10px; padding:0 5px; min-width:16px}
  #toasts{left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); align-items:stretch}
  .toast{max-width:none}
  .modal{padding:18px; border-radius:18px 18px 0 0; align-self:flex-end; max-height:92vh}
  .overlay.sheet{align-items:flex-end; padding:0}
  .hbar{grid-template-columns:100px 1fr 36px}
  .mobile-sticky{position:sticky; bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); padding:6px 0; margin:0 -2px; gap:6px; flex-wrap:nowrap}
  /* Phone: the job action bar stays compact (buttons side by side) so it covers little of the page. */
  .mobile-sticky .btn.lg{flex:1 1 0; min-width:0; padding:8px 6px; font-size:13px; gap:5px; border-radius:10px; white-space:normal; line-height:1.15; text-align:center}
  .mobile-sticky > .hint, .mobile-sticky > .pill{flex:1 1 0; min-width:0; white-space:normal; font-size:11.5px; line-height:1.25}
  /* Phone: the self-approval hint is one short line, so the bar stays low (full text in the title and on the Review page). */
  .selfhint .long{display:none} .selfhint .short{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #main:has(.mobile-sticky){padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  html{scroll-padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  /* A modal is open: toasts go to the top so they don't cover the form fields or its buttons. */
  body:has(#overlays .overlay) #toasts{top:calc(10px + env(safe-area-inset-top,0px)); bottom:auto}
  /* ...and only the newest one shows there, with room kept above the form so it doesn't cover the first field. */
  body:has(#overlays .overlay) #toasts .toast:not(:last-child){display:none}
  .overlay .modal{max-height:calc(100vh - 110px - env(safe-area-inset-top,0px))}
}
@media (max-width:520px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi .num{font-size:24px} h1{font-size:22px} .steps .lb{font-size:10px} }
@media print{ #side,#top,#tabbar,.btn,.tabs{display:none!important} #main{padding:0} .card{box-shadow:none} }
</style>
</head>

/* At most 2 toasts show at once, so they never cover much of the page. Success toasts go away sooner.
   Error toasts come first: they are kept after (in front of) success toasts, and an older success toast goes first when there are too many. */
const MAX_TOASTS = 2;
function toast(msg, kind){
  const t = el(`<div class="toast ${kind||""}">${icon(kind==="bad"?"alert":"check","sm")}<span>${esc(msg)}</span></div>`);
  const box = $("#toasts"); t._at = Date.now();
  /* A success (e.g. after a form was saved and closed) clears error toasts older than 1 s — they belonged to earlier tries. */
  if (kind!=="bad") $$(".toast.bad", box).forEach(x=>{ if (Date.now()-(x._at||0) > 1000) x.remove(); });
  if (kind==="bad") box.appendChild(t); else box.insertBefore(t, $(".toast.bad", box));
  setTimeout(()=>t.remove(), kind==="bad" ? 4200 : 2600);
  /* Never remove the toast just added: drop an older success toast first, else the oldest error. */
  while (box.children.length > MAX_TOASTS) ([...box.children].find(x=>x!==t && !x.classList.contains("bad")) || [...box.children].find(x=>x!==t)).remove();
}

/* URL allow-list for anything that comes from the database.
   kind "img"   : <img src>   — https:, local blob:, data:image/*
   kind "media" : <video src> — https:, local blob:, data:image/*, data:video/*
   kind "href"  : links       — https:, local blob:, data:image/(png|jpeg|gif|webp)
   Anything else (javascript:, http:, other data: types) returns "". */
const LOCAL_BLOBS = new Set();
function localBlobUrl(file){ const u = URL.createObjectURL(file); LOCAL_BLOBS.add(u); return u; }
function revokeLocalBlob(u){ if (u && LOCAL_BLOBS.has(u)){ URL.revokeObjectURL(u); LOCAL_BLOBS.delete(u); } }
function safeUrl(u, kind){
  const s = String(u??"").trim(); if (!s) return "";
  if (/^https:\/\//i.test(s)){ try{ new URL(s); return s; }catch(e){ return ""; } }
  /* http: only for this page's own origin (e.g. a file service on the same host). */
  if (/^http:\/\//i.test(s)){ try{ const x = new URL(s); return x.origin===location.origin ? x.href : ""; }catch(e){ return ""; } }
  if (/^blob:/i.test(s)) return LOCAL_BLOBS.has(s) ? s : "";
  if (kind==="href") return /^data:image\/(png|jpeg|gif|webp)[;,]/i.test(s) ? s : "";
  if (/^data:image\//i.test(s)) return s;
  if (kind==="media" && /^data:video\//i.test(s)) return s;
  return "";
}
/* Busy guards: ignore repeat clicks/submits while an async save is running. */
function withBusy(btns, fn){
  const list = (Array.isArray(btns) ? btns : [btns]).filter(Boolean);
  return async (...a)=>{
    if (!list.length || list[0].dataset.busy) return;
    list.forEach(b=>{ b.dataset.busy = "1"; b.disabled = true; });
    try{ return await fn(...a); }
    catch(e){ console.error(e); toast("Something went wrong. Check the result before trying again.", "bad"); }
    finally{ list.forEach(b=>{ delete b.dataset.busy; b.disabled = false; }); }
  };
}
/* App forms skip the browser's own validation bubbles: every submit handler checks its fields itself and shows the app message. */
function onSubmit(form, fn){
  form.noValidate = true;
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    if (form.dataset.busy) return;
    const btns = $$("button:not([type=button])", form);
    /* A date/time the browser can't read (half typed) would otherwise be saved as empty. Number fields check this themselves. */
    const bad = $$("input:not([type=number])", form).find(x=>!x.disabled && !x.closest("[hidden]") && x.validity && x.validity.badInput);
    if (bad){ const l = bad.closest(".field")?.querySelector("label")?.textContent.replace(/\s*\*\s*$/,"") || "A date"; fieldErr(bad, `${l}: this entry is not complete. Finish it or clear it.`); return; }
    form.dataset.busy = "1"; btns.forEach(b=>b.disabled = true);
    try{ await fn(e); }
    catch(err){ console.error(err); toast("Something went wrong. Check the result before trying again.", "bad"); }
    finally{ delete form.dataset.busy; btns.forEach(b=>b.disabled = false); }
  });
}

/* In-memory store with the same API as the shared db. Used only when shared
   storage can't be reached (local preview), so every screen stays usable.
   Nothing written here survives a reload. */
class MemDB {
  constructor(){ this.cols = {}; }
  _col(p){ return (this.cols[p] = this.cols[p] || {}); }
  doc(path){
    const i = path.lastIndexOf("/"), col = path.slice(0,i), id = path.slice(i+1), self = this;
    return {
      id,
      async get(){ const d = self._col(col)[id]; return {id, exists:!!d, data:()=>d?JSON.parse(JSON.stringify(d)):undefined}; },
      async set(data){ self._col(col)[id] = JSON.parse(JSON.stringify(data)); },
      async update(data){ const c=self._col(col); c[id] = Object.assign(c[id]||{}, JSON.parse(JSON.stringify(data))); },
      collection(name){ return self.collection(path+"/"+name); },
    };
  }
  collection(path){
    const self = this; let order = null, lim = null;
    const q = {
      orderBy(f, dir){ order=[f, dir||"asc"]; return q; },
      limit(n){ lim=n; return q; },
      async get(){
        let docs = Object.entries(self._col(path)).map(([id,d])=>({id, data:()=>JSON.parse(JSON.stringify(d)), _d:d}));
        if (order) docs.sort((a,b)=>{ const x=a._d[order[0]], y=b._d[order[0]]; return (x>y?1:x<y?-1:0)*(order[1]==="desc"?-1:1); });
        if (lim) docs = docs.slice(0,lim);
        return {docs};
      },
      async add(data){ const id = uid("d"); self._col(path)[id] = JSON.parse(JSON.stringify(data)); return {id}; },
      doc(id){ return self.doc(path+"/"+id); },
    };
    return q;
  }
}

async function loadAll(){
  const errors = [];
  const tryGet = (label, p)=> p.then(r=>r, e=>{ console.error("read failed", label, e); errors.push(label); return null; });
  const keepSafe = docs=> docs.filter(d=>SAFE_ID.test(String(d.id)));
  try{
    const cfg = await db.doc("app/config").get();
    S.configExists = !!cfg.exists;
    if (cfg.exists){ const c = cfg.data(); S.config = Object.assign({}, S.config, c, {modules:Object.assign({}, S.config.modules, c.modules||{}), gpsPolicy:Object.assign({}, S.config.gpsPolicy, c.gpsPolicy||{})}); }
    const names = ["users","customers","equipment","jobs","feedback","consent","hazards"];
    const snaps = await Promise.all(names.map(n=>tryGet(n, db.collection(n).get())));
    /* A failed read keeps what was already loaded instead of replacing it with an empty list. */
    names.forEach((n,i)=>{ if (snaps[i]) S[n] = keepSafe(snaps[i].docs).map(d=>Object.assign({id:d.id}, d.data())); });
    const ns = await tryGet("notifications", db.collection("notifications").orderBy("at","desc").limit(100).get());
    if (ns) S.notifications = keepSafe(ns.docs).map(d=>Object.assign({id:d.id}, d.data()));
    S.users.forEach(normalizeUser);
    const subOk = await Promise.all(S.jobs.map(j=>loadJobSub(j.id)));
    if (subOk.some(x=>!x)) errors.push("job details");
    S.loadErrors = errors;
    return true;
  }catch(e){ console.error("loadAll failed", e); return false; }
}

const MAX_INLINE = 700*1024;
function fileProblem(file){
  const t = String(file.type||"").toLowerCase();
  const isVid = t.startsWith("video/");
  if (!(t.startsWith("image/") || isVid || t==="application/pdf")) return `“${file.name}” isn't a photo, video or PDF.`;
  const lim = isVid ? 50*1048576 : 10*1048576;
  if (file.size > lim) return `“${file.name}” is too big (limit ${lim/1048576} MB).`;
  return null;
}
/* A URL from the file service: https:, or http(s) on this page's own origin. Relative URLs are resolved against this page. */
function assetUrl(u){

    if (x.protocol==="https:" || (x.protocol==="http:" && x.origin===location.origin)) return x.href;
  }catch(e){}
  return "";
}
/* Photos are scaled down (longest side 1600 px) and saved as JPEG (quality 0.8) before inlining. null if the browser can't decode it. */
async function shrinkImage(file){
  if (!/^image\/(jpeg|png|webp|bmp)$/i.test(file.type||"")) return null;
  const src = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>rej(new Error("decode failed")); i.src = src; });
    const k = Math.min(1, 1600/Math.max(img.naturalWidth||1, img.naturalHeight||1));
    const w = Math.max(1, Math.round(img.naturalWidth*k)), h = Math.max(1, Math.round(img.naturalHeight*k));
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img, 0, 0, w, h);
    return cv.toDataURL("image/jpeg", 0.8);
  }catch(e){ console.error(e); return null; }
  finally{ URL.revokeObjectURL(src); }
}
/* Returns {url, assetId} or null (and shows the error). Never stores blob: URLs.
   Without the file service, the file is stored inline; in live mode only up to ~700 KB (after photo compression). */
async function uploadFile(file){
  const bad = fileProblem(file); if (bad){ toast(bad, "bad"); return null; }
  let assetErr = null;
  if (assets){
    try{ const up = await assets.upload(file); const u = up && !/^blob:/i.test(String(up.url||"")) ? assetUrl(up.url) : ""; if (u) return {url:u, assetId:up.id||null}; throw new Error("upload returned no usable URL"); }
    catch(e){ console.error(e); assetErr = e; }
  }
  const tooBig = n=> mode==="live" && n > MAX_INLINE;
  const small = await shrinkImage(file);
  if (small){
    if (tooBig(Math.ceil(small.length*3/4))){ toast(`Couldn't upload “${file.name}”.${assetErr?" The file service failed, and":""} Even after shrinking, the photo is over 700 KB, which can't be stored without the file service.`, "bad"); return null; }
    return {url:small, assetId:null};
  }
  if (tooBig(file.size)){ toast(`Couldn't upload “${file.name}”.${assetErr?" The file service failed, and":""} Files over 700 KB can't be stored without the file service.`, "bad"); return null; }

    const url = await new Promise((res, rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error||new Error("read failed")); r.readAsDataURL(file); });

  }catch(e){ console.error(e); toast(`Couldn't read “${file.name}”.`, "bad"); return null; }
}

/* ------------------------------ OVERLAYS ------------------------------ */
function showModal(node, opts){
  opts = opts||{};
  const ov = el(`<div class="overlay ${opts.sheet?"sheet":""}" role="dialog" aria-modal="true"></div>`);
  const box = el(`<div class="modal ${opts.wide?"wide":""}"></div>`);
  box.appendChild(node); ov.appendChild(box);
  /* Track real user edits so Esc / backdrop click can ask before throwing them away. */
  let dirty = false; const mark = e=>{ if (e.isTrusted) dirty = true; };
  node.addEventListener("input", mark); node.addEventListener("change", mark);
  node.addEventListener("pointerdown", e=>{ if (e.isTrusted && e.target.tagName==="CANVAS") dirty = true; });
  ov._isDirty = ()=> dirty;
  ov.addEventListener("click", e=>{ if (e.target===ov) requestClose(); });
  $$("[data-close]", node).forEach(b=>b.addEventListener("click", closeOverlay));
  clearOverlays(); $("#overlays").appendChild(ov);
  setTimeout(()=>{ const f = node.querySelector("input:not([type=checkbox]):not([type=file]),select,textarea"); if (f && !opts.noFocus) f.focus(); }, 30);
  return ov;
}
/* Before removing layers, cancel any open confirm/prompt box so its promise resolves (otherwise busy locks never clear). */
function clearOverlays(){
  const box = $("#overlays");
  Array.from(box.children).forEach(c=>{ if (c._cancel){ try{ c._cancel(); }catch(e){ console.error(e); } } });
  box.innerHTML = "";
}
function closeOverlay(){ clearOverlays(); }
/* Top layer for focus: the last overlay, or the first-start setup screen. */
function topLayer(){ const l = $("#overlays").children; return l[l.length-1] || $("#setup") || null; }
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function trapFocus(e){
  const top = topLayer(); if (!top) return;
  const f = $$(FOCUSABLE, top).filter(x=>x.getClientRects().length);
  if (!f.length){ e.preventDefault(); return; }
  const first = f[0], last = f[f.length-1], a = document.activeElement;
  if (!top.contains(a)){ e.preventDefault(); (e.shiftKey?last:first).focus(); }
  else if (e.shiftKey && a===first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && a===last){ e.preventDefault(); first.focus(); }
}
/* Esc / backdrop: close the top layer; ask first if a form in it was changed. */
async function requestClose(){
  const layers = $("#overlays").children; const top = layers[layers.length-1];
  if (!top) return;
  if (top._cancel){ top._cancel(); return; }
  if (top._isDirty && top._isDirty() && !(await confirmBox("Discard changes?", "You changed this form and haven't saved it. Close it and lose the changes?", "Discard", true))) return;
  closeOverlay();
}
document.addEventListener("keydown", e=>{
  if (e.key==="Escape") requestClose();
  if (e.key==="Tab") trapFocus(e);
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); if (!topLayer()) openPalette(); }
});
function modalHead(title, sub){ return `<div class="mh"><div><h3>${esc(title)}</h3>${sub?`<div class="hint">${esc(sub)}</div>`:""}</div><button class="btn ghost sm" type="button" data-close aria-label="Close">${icon("x")}</button></div>`; }
/* Stacks on top of any open modal, and removes only itself — the form underneath stays filled in. */
function confirmBox(title, msg, okLabel, danger){
  return new Promise(res=>{
    const b = el(`<div>${modalHead(title)}<p>${esc(msg)}</p><div class="mf"><button class="btn" data-no>Cancel</button><button class="btn ${danger?"danger solid":"primary"}" data-yes>${esc(okLabel||"Confirm")}</button></div></div>`);
    const ov = el(`<div class="overlay" role="dialog" aria-modal="true"></div>`); const box = el(`<div class="modal"></div>`);
    box.appendChild(b); ov.appendChild(box);
    let done = false; const finish = v=>{ if (done) return; done = true; ov.remove(); res(v); };
    ov._cancel = ()=>finish(false);
    ov.addEventListener("click", e=>{ if (e.target===ov) finish(false); });
    $$("[data-close]", b).forEach(x=>x.addEventListener("click", ()=>finish(false)));
    $("[data-no]", b).addEventListener("click", ()=>finish(false));
    $("[data-yes]", b).addEventListener("click", ()=>finish(true));
    $("#overlays").appendChild(ov);
    setTimeout(()=>$("[data-no]", b)?.focus(), 20);
  });
}
/* Like confirmBox, but asks for a reason. Resolves to the trimmed text, or null if cancelled. */
function promptBox(title, msg, okLabel){
  return new Promise(res=>{
    const b = el(`<form>${modalHead(title)}<p>${esc(msg)}</p><div class="field mt"><label>Reason *</label><textarea name="r"></textarea></div><div class="mf"><button type="button" class="btn" data-no>Cancel</button><button class="btn primary">${esc(okLabel||"OK")}</button></div></form>`);
    const ov = el(`<div class="overlay" role="dialog" aria-modal="true"></div>`); const box = el(`<div class="modal"></div>`);
    box.appendChild(b); ov.appendChild(box);
    let done = false; const finish = v=>{ if (done) return; done = true; ov.remove(); res(v); };
    ov._cancel = ()=>finish(null);
    ov.addEventListener("click", e=>{ if (e.target===ov) finish(null); });
    $$("[data-close]", b).forEach(x=>x.addEventListener("click", ()=>finish(null)));
    $("[data-no]", b).addEventListener("click", ()=>finish(null));
    b.noValidate = true; b.addEventListener("submit", e=>{ e.preventDefault(); const v = b.r.value.trim(); if (!v){ fieldErr(b.r, "Give a reason."); return; } finish(v); });
    $("#overlays").appendChild(ov);
    setTimeout(()=>b.r.focus(), 20);
  });
}

/* One combined error message, not one per failed notification. */
async function markRead(items){
  let failed = 0;
  await Promise.all(items.filter(n=>!isRead(n)).map(async n=>{
    const readBy = (n.readBy||[]).concat(S.userId||"anon");
    if (await writeDoc("notifications/"+n.id, {readBy}, true, true)) n.readBy = readBy; else failed++;
  }));
  if (failed) toast(failed===1 ? "Couldn't mark a notification as read. Check your connection." : `Couldn't mark ${failed} notifications as read. Check your connection.`, "bad");
  renderTop();
}

/* Command palette */
function openPalette(){
  const ov = el(`<div class="overlay"><div class="palette" role="dialog" aria-label="Search">
    <div class="pin">${icon("search")}<input id="palIn" placeholder="Search jobs, customers, equipment, screens…" autocomplete="off"><kbd class="tiny faint">Esc</kbd></div>
    <div class="res" id="palRes"></div></div></div>`);
  ov.addEventListener("click", e=>{ if (e.target===ov) closeOverlay(); });
  clearOverlays(); $("#overlays").appendChild(ov);
  const input = $("#palIn"), res = $("#palRes"); let items = [], sel = 0;
  function draw(){
    const q = input.value.trim().toLowerCase(); items = [];
    const match = (...vals)=> !q || vals.filter(Boolean).some(v=>String(v).toLowerCase().includes(q));
    navFor(S.role).forEach(([k,label,ic])=>{ if (match(label)) items.push({g:"Screens", ic, t:label, s:"", go:()=>go(k)}); });
    visibleJobs().filter(j=>match(j.refNumber, customerById(j.customerId)?.name, j.siteAddress, userById(j.technicianId)?.name, j.jobType)).slice(0,8)
      .forEach(j=> items.push({g:"Jobs", ic:isClosed(j)?"archive":"wrench", t:`${j.refNumber} · ${customerById(j.customerId)?.name||""}`, s:`${STATUS[j.status]?.label||j.status} · ${fmtDay(j.scheduledAt)}`, go:()=>openJob(j.id)}));
    if (!isField() && S.role!=="accountant") S.customers.filter(c=>match(c.name, c.address, c.phone)).slice(0,6)
      .forEach(c=> items.push({g:"Customers", ic:"contact", t:c.name, s:c.address||"", go:()=>openCustomer(c.id)}));
    if (S.role!=="accountant") S.equipment.filter(e=>match(e.manufacturer, e.model, e.serial, e.type)).slice(0,6)
      .forEach(e=> items.push({g:"Equipment", ic:"box", t:`${e.manufacturer||""} ${e.model||""}`, s:`${e.type||""} · S/N ${e.serial||"—"}`, go:()=>openEquipment(e.id)}));
    if (!q) items = items.filter(i=>i.g!=="Customers" && i.g!=="Equipment").slice(0,12);
    sel = Math.min(sel, Math.max(items.length-1,0));
    res.innerHTML = ""; let lastG = "";
    if (!items.length) res.innerHTML = `<div class="empty">No matches for “${esc(input.value)}”.</div>`;
    items.forEach((it,i)=>{
      if (it.g!==lastG){ res.appendChild(el(`<div class="grp">${esc(it.g)}</div>`)); lastG = it.g; }
      const r = el(`<div class="it ${i===sel?"sel":""}">${icon(it.ic)}<div style="flex:1;min-width:0"><div style="font-weight:600">${esc(it.t)}</div>${it.s?`<div class="tiny faint">${esc(it.s)}</div>`:""}</div></div>`);
      r.addEventListener("click", it.go); res.appendChild(r);
    });
  }
  input.addEventListener("input", ()=>{ sel=0; draw(); });
  input.addEventListener("keydown", e=>{
    if (e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(sel+1, items.length-1); draw(); }
    if (e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(sel-1, 0); draw(); }
    if (e.key==="Enter" && items[sel]) items[sel].go();
  });
  draw(); setTimeout(()=>input.focus(), 20);
}

<script>

function ownerAlerts(){
  const out = [];
  /* Open red tags, plus removed ones whose written notice is still overdue. */
  S.hazards.filter(h=>h.status!=="resolved" || noticeOverdue(h)).forEach(h=>{
    const due = noticeDue(h); const d = due ? Math.ceil((ts(due)-Date.now())/DAY) : null;
    const missing = h.status!=="resolved" && isImmediate(h) ? HZ_STEPS.slice(0,3).filter(st=>!h[st.k]).length : 0;
    const parts = [];
    if (isImmediate(h)) parts.push("Immediate hazard.");
    if (missing) parts.push(`${missing} of steps 1–3 not recorded.`);
    if (noticeOverdue(h)) parts.push(`Overdue — written notice to the gas utility was due ${dueText(due)}.`);
    else if (!h.writtenNoticeSentAt && d!==null) parts.push(`Written notice to the gas utility due in ${d} day(s).`);
    else if (!h.writtenNoticeSentAt) parts.push("Record when the gas utility was told.");
    out.push({c:"bad", ic:"tag", t:`${h.status==="resolved"?"Removed red tag":"Red tag"}: ${equipmentLabel(equipmentById(h.equipmentId))} at ${customerById(h.customerId)?.name||"site"}`,
      s:parts.join(" "), go:()=> h.jobId && jobById(h.jobId) ? openJob(h.jobId,"safety") : h.equipmentId ? openEquipment(h.equipmentId) : null});
  });
  activeUsers().forEach(u=> (u.credentials||[]).forEach(c=>{
    if (!c.expires) return; const d = Math.ceil((ts(c.expires)-Date.now())/DAY);
    if (d<=60) out.push({c:d<0?"bad":"warn", ic:"shield", t:`${u.name}: ${c.name} ${d<0?"expired":"expires in "+d+" day(s)"}`, s:"Renew before assigning work that needs this licence.", go:()=>go("users")});
  }));
  S.jobs.filter(j=>!isClosed(j) && isLate(j)).forEach(j=> out.push({c:"warn", ic:"clock", t:`${j.refNumber} is running late`, s:`Scheduled ${fmtDate(j.scheduledAt)} · ${userById(j.technicianId)?.name||"unassigned"}`, go:()=>openJob(j.id)}));
  S.jobs.filter(j=>!isClosed(j) && !j.technicianId).forEach(j=> out.push({c:"warn", ic:"user", t:`${j.refNumber} has no technician`, s:`${customerById(j.customerId)?.name||""} · ${fmtDate(j.scheduledAt)}`, go:()=>openJob(j.id)}));
  const due = S.equipment.filter(maintDueOrUnreadable);
  if (due.length) out.push({c:"info", ic:"box", t:`${due.length} unit(s) are due for yearly maintenance`, s:"Last service was over 12 months ago, or its date can't be read.", go:()=>{ S.ui.eqQ=""; S.ui.eqDue=true; go("equipment"); }});
  return out;
}
function activityFeed(){
  const f = [];
  S.jobs.forEach(j=>{
    const s = sub(j.id);
    s.events.forEach(e=> f.push(Object.assign({kind:"event", job:j}, e)));
    s.notes.forEach(n=> f.push({kind:"note", job:j, at:n.at, by:n.by, text:n.text}));
    s.media.forEach(m=> f.push({kind:"media", job:j, at:m.at, by:m.by, text:m.category||"Photo"}));
  });
  return f.sort((a,b)=>ts(b.at)-ts(a.at));
}

function helpCard(h){

function answerHelp(job, h){
  const b = el(`<form>${modalHead("Answer help request", job.refNumber)}<div class="note"><div class="meta">${esc(h.by)} asked</div>${esc(h.message)}</div>
    <div class="field mt"><label>Your answer *</label><textarea name="r" required></textarea></div>
    <div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${icon("send","sm")} Send answer</button></div></form>`);
  showModal(b);
  onSubmit(b, async ()=>{
    const response = b.r.value.trim(); if (!response){ fieldErr(b.r, "Type an answer first."); return; }
    const patch = {status:"resolved", response, resolvedBy:me()?.name||"Supervisor", resolvedAt:now()};
    if (!(await writeDoc("jobs/"+job.id+"/help/"+h.id, patch, true))) return;
    Object.assign(sub(job.id).help.find(x=>x.id===h.id)||{}, patch);
    const asker = S.users.find(u=>u.id===h.byId || u.name===h.by);
    await notify(`${patch.resolvedBy} answered your help request on ${job.refNumber}.`, asker?{toUser:asker.id, jobId:job.id}:{toRole:"technician", jobId:job.id});
    closeOverlay(); toast("Answer sent."); render();
  });
}

<script>

function renderJob(id){

  }
  const c = customerById(j.customerId), t = userById(j.technicianId), e = equipmentById(j.equipmentId), s = sub(id);

      </div>
      <div class="row wrap" id="headActions"></div>
    </div>
    <div class="kv mt">
      <div><div class="k">Scheduled</div><div class="v">${esc(fmtDate(j.scheduledAt))}</div></div>
      <div><div class="k">Technician</div><div class="v row">${t?avatar(t,"sm")+esc(t.name):`<span class="pill warn">Unassigned</span>`}</div></div>
      <div><div class="k">Trade</div><div class="v">${esc(THEMES[j.requiredTrade]?.label||j.requiredTrade||"—")}</div></div>
      <div><div class="k">Equipment</div><div class="v">${e?`<a href="#" id="eqLink">${esc(equipmentLabel(e))}</a>`:`<span class="faint">Not linked</span>`}</div></div>
    </div>
    <div class="steps">${STATUSES.map((st,i)=>{ const idx = STATUSES.indexOf(j.status); return `<div class="s ${i<idx||closed?"done":i===idx?"cur":""}"><div class="bar"></div><div class="lb">${esc(STATUS[st].label)}</div></div>`; }).join("")}</div>
  </div>`);
  $("#eqLink", head)?.addEventListener("click", ev=>{ ev.preventDefault(); openEquipment(e.id); });
  const ha = $("#headActions", head);
  if (can.editJob() && !closed){ const b = el(`<button class="btn sm">${icon("pencil","sm")} Edit</button>`); b.addEventListener("click", ()=>openJobForm(j)); ha.appendChild(b); }
  wrap.appendChild(head);

  if (closed) wrap.appendChild(el(`<div class="lock">${icon("lock")}<span><b>Closed and read-only.</b> Approved by ${esc(j.review?.by||"supervisor")}${j.closedAt?" on "+esc(fmtDateOnly(j.closedAt)):""}. Nothing can be added or changed. Everything in this job stays private to the trade team.</span></div>`));
  if (!closed && j.review?.decision==="sent_back" && j.status==="working") wrap.appendChild(el(`<div class="callout bad mt">${icon("undo")}<div><b>Sent back by ${esc(j.review.by)} · ${esc(ago(j.review.at))}</b><div>${esc(j.review.reason||"")}</div></div></div>`));
  const hz = openHazards(h=>h.jobId===j.id || (j.equipmentId && h.equipmentId===j.equipmentId));
  if (hz.length) wrap.appendChild(el(`<div class="callout bad mt">${icon("tag")}<div><b>Red-tagged equipment on this job.</b> ${esc(hz[0].description||"")} — see the Safety tab.</div></div>`));

/* ---- status flow ---- */
/* Re-read the job before changing it. Refreshes local state; returns null (with an error toast) if it can't be read
   or its status is no longer one of `allowed` (someone else changed it). */
async function freshJob(j, allowed){
  let snap;
  try{ snap = await db.doc("jobs/"+j.id).get(); }
  catch(e){ console.error(e); toast("Couldn't check the latest version of this job. Try again.", "bad"); return null; }
  if (!snap || !snap.exists){ toast("This job no longer exists.", "bad"); return null; }
  const data = snap.data() || {};
  Object.keys(j).forEach(k=>{ if (k!=="id") delete j[k]; });
  Object.assign(j, data);
  if (allowed && !allowed.includes(j.status)){
    toast(`${j.refNumber} was changed on another device (now ${STATUS[j.status]?.label||j.status}). The screen has been refreshed — nothing was saved.`, "bad");
    render(); return null;
  }
  return j;
}
const OPEN_STATUSES = STATUSES.filter(s=>s!=="completed");
const EDITABLE_READING_STATUSES = STATUSES.filter(s=>s!=="completed" && s!=="completion_review");
async function advanceJob(j){
  return once("status:"+j.id, async ()=>{
    const shown = j.status;
    if (!(await freshJob(j, [shown]))) return;
    const idx = STATUSES.indexOf(j.status); const next = STATUSES[idx+1];
    if (!next || next==="completed") return;
    if (next==="completion_review"){
      if (!(await freshHazards({noRender:true}))) return;
      const missing = completionItems(j).filter(i=>!i.ok);
      if (missing.length){ toast("Before submitting, add: "+missing.map(m=>m.label).join(", ")+".", "bad"); S.view.jobTab="completion"; render(); return; }
    }
    const patch = {status:next}; if (next==="completion_review"){ patch.submittedAt = now(); patch.submittedById = me()?.id||null; patch.submittedBy = me()?.name||""; }
    if (next==="arrived") patch.arrivedAt = now();
    if (!(await writeDoc("jobs/"+j.id, patch, true))) return;
    Object.assign(j, patch);
    await logEvent(j.id, "status", {status:next});
    if (next==="completion_review") await notify(`${me()?.name||"Technician"} submitted ${j.refNumber} for review.`, {toRole:"managers", jobId:j.id});
    if (next==="en_route") await notify(`${me()?.name||"Technician"} is on the way to ${j.refNumber}.`, {toRole:"dispatcher", jobId:j.id});
    toast(next==="completion_review" ? "Submitted for supervisor review." : `Status: ${STATUS[next].label}.`);
    render();
  });
}
/* Did this person work on the job? Assigned technician, the person who submitted it, or anyone who recorded
   field work on it (notes, photos, expenses, readings, leak test, red tag, or a submit). Uses the loaded sub-collections. */
const FIELD_EVENTS = new Set(["readings","leak","hazard"]);
function workedOnJob(j, userId){
  if (!userId) return false;
  if (j.technicianId===userId || j.submittedById===userId) return true;
  const s = sub(j.id);
  if (["notes","media","materials"].some(k=>(s[k]||[]).some(x=>x.byId===userId))) return true;
  return (s.events||[]).some(e=>e.byId===userId && (FIELD_EVENTS.has(e.type) || (e.type==="status" && e.status==="completion_review")));
}
const SELF_APPROVE_MSG = "Only a G2 or G1 can approve a job they worked on. Another supervisor (G2 or higher) must approve.";
const SELF_APPROVE_SHORT = "Another G2+ must approve";
/* The person viewing worked on this job and isn't G2/G1: the Approve button is not shown (approveJob still checks). */
const cantSelfApprove = j=>{ const u = me(); return !!u && workedOnJob(j, u.id) && !hasLic(u, "G2"); };
async function approveJob(j){
  return once("status:"+j.id, async ()=>{
    /* The approver is fixed when the button is pressed, even if "Viewing as" changes while a box is open. */
    const approver = me();
    if (!approver){ toast("Choose who you are first.", "bad"); return; }
    /* Re-read the job, its details and the red tags, then check who may approve and what is missing. null = stop. */
    const check = async ()=>{
      if (!(await freshJob(j, ["completion_review"]))) return null;
      if (!(await loadJobSub(j.id))){ toast("Couldn't check the latest job details. Try again.", "bad"); return null; }
      if (!(await freshHazards({noRender:true}))) return null;
      const self = workedOnJob(j, approver.id);
      if (self && !hasLic(approver, "G2")){ toast(SELF_APPROVE_MSG, "bad"); render(); return null; }
      const items = completionItems(j);
      const hard = items.filter(i=>!i.ok && i.safety);
      if (hard.length){ toast("Can't close — safety items can't be skipped: "+hard.map(m=>m.label).join(", ")+".", "bad"); S.view.jobTab="completion"; render(); return null; }
      return {self, missing:items.filter(i=>!i.ok)};
    };
    const c1 = await check(); if (!c1) return;
    let reason = null;
    if (c1.missing.length){
      reason = await promptBox("Close with items missing?", "Still missing: "+c1.missing.map(m=>m.label).join(", ")+". Say why you are closing anyway. The reason is saved in the timeline.", "Close anyway");
      if (!reason) return;
    }
    /* Check again just before writing: something may have changed while the reason was being typed. */
    const c2 = await check(); if (!c2) return;
    if (c2.missing.some(m=>!c1.missing.some(x=>x.label===m.label))){ toast("The checklist changed while you were deciding. Check it and try again.", "bad"); S.view.jobTab="completion"; render(); return; }
    const missing = c2.missing, selfApproved = c2.self;
    if (!missing.length) reason = null;
    const review = {decision:"approved", by:approver.name||"Supervisor", byId:approver.id, at:now()};
    if (selfApproved) review.selfApproved = true;
    if (reason){ review.overrideReason = reason; review.overrideItems = missing.map(m=>m.label); }
    const patch = {status:"completed", closedAt:now(), review};
    if (!(await writeDoc("jobs/"+j.id, patch, true))) return;
    Object.assign(j, patch);
    await logEvent(j.id, "status", {status:"completed", note:"Approved and closed"+(selfApproved?" · self-approved":"")+(reason?` · closed with items missing (${review.overrideItems.join(", ")}). Reason: ${reason}`:""), by:approver.name||"Supervisor", byId:approver.id});
    if (j.technicianId) await notify(`${patch.review.by} approved ${j.refNumber}. It's closed and in the archive.`, {toUser:j.technicianId, jobId:j.id, fromId:approver.id});
    toast(`${j.refNumber} closed and moved to the Archive.`); render();
  });
}

const refNum = r=> parseInt(String(r||"").replace(/\D/g,""),10);
function nextRef(){
  const nums = S.jobs.map(j=>refNum(j.refNumber)).filter(n=>!isNaN(n));
  return "JOB-"+(Math.max(1000, ...nums)+1);
}
/* Re-read all job refs from the db and return `wanted` if free, otherwise the next free JOB-number. null if the read fails. */
async function uniqueRef(wanted){
  let refs;
  try{ const snap = await db.collection("jobs").get(); refs = new Set(snap.docs.map(d=>String(d.data()?.refNumber||""))); }
  catch(e){ console.error(e); toast("Couldn't check existing job numbers. Try again.", "bad"); return null; }
  S.jobs.forEach(x=>refs.add(String(x.refNumber||"")));
  if (wanted && !refs.has(wanted)) return wanted;
  let n = Math.max(1000, ...[...refs].map(refNum).filter(x=>!isNaN(x)))+1;
  while (refs.has("JOB-"+n)) n++;
  return "JOB-"+n;
}
function techWarnings(techId, whenIso, trade, excludeId){
  const out = []; const u = userById(techId); if (!u) return out;
  const t = ts(whenIso);
  const clash = S.jobs.find(x=>x.id!==excludeId && x.technicianId===techId && !isClosed(x) && Math.abs(ts(x.scheduledAt)-t) < 90*60000);
  if (clash) out.push(`${u.name} already has ${clash.refNumber} within 90 minutes of this time.`);
  if (trade && u.trade && u.trade!==trade) out.push(`${u.name}'s trade is ${THEMES[u.trade]?.label||u.trade}, not ${THEMES[trade]?.label||trade}. Confirm they hold the right licence.`);
  if (THEMES[trade]?.gas && licOf(u)==="none" && !(u.credentials||[]).some(c=>/G1|G2|G3|gas/i.test(c.name))) out.push(`${u.name} has no gas licence on file (G3/G2/G1).`);
  (u.credentials||[]).forEach(c=>{ if (c.expires && ts(c.expires) < t) out.push(`${u.name}'s ${c.name} expires before this job (${fmtDateOnly(c.expires)}).`); });
  if (u.role==="apprentice") out.push(`${u.name} is an apprentice — make sure a supervisor is available.`);
  return out;
}

      }
      /* Same value as stored (trailing spaces, or the same minute) is not a change. */
      const same = k=> k==="siteAddress" ? dbAddr===siteAddress : k==="scheduledAt" ? !!j.scheduledAt && toLocalInput(j.scheduledAt)===f.scheduledAt.value : String(j[k]??"")===String(all[k]??"");
      const data = {}; touched.filter(k=>!same(k)).forEach(k=> data[k] = all[k]);
      const changes = Object.keys(data);
      if (!changes.length){ closeOverlay(); render(); return; }
      const changed = k=> changes.includes(k);
      if (j.status==="completion_review" && changed("technicianId")){ toast("The technician can't be changed while the job is waiting for review. Send it back first.","bad"); return; }
      if (changed("equipmentId") || changed("customerId")){
        const what = changed("equipmentId") ? "equipment" : "customer";
        if (j.status==="completion_review"){ toast(`The ${what} can't be changed while the job is waiting for review. Send it back first.`,"bad"); return; }
        if (!(await freshHazards({noRender:true}))) return;
        if (tagLock(j)){ toast(`This job or its equipment has an open red tag. The ${what} can't be changed until the red tag is removed.`,"bad"); return; }
      }
      const prevTech = j.technicianId;
      const addrChanged = changed("siteAddress"), oldAddr = String(j.siteAddress??"").trim();
      /* Re-read red tags for the manager notice below (a failed read still lets the address be corrected). */
      if (addrChanged) await freshHazards({quiet:true, noRender:true});
      if (!(await writeDoc("jobs/"+j.id, data, true))) return;
      Object.assign(j, data);
      if (addrChanged){
        const who = me()?.name||ROLE_LABELS[S.role];
        await logEvent(j.id, "edited", {note:`Site address changed: ${oldAddr||"(empty)"} → ${siteAddress} by ${who}`});
        if (tagLock(j)) await notify(`Site address of red-tagged job ${j.refNumber} changed: ${oldAddr||"(empty)"} → ${siteAddress} by ${who}.`, {toRole:"managers", jobId:j.id});
      }
      const otherChanges = changes.filter(k=>k!=="siteAddress");
      if (otherChanges.length) await logEvent(j.id, "edited", {note:"Changed: "+otherChanges.map(k=>({customerId:"customer",siteAddress:"address",scheduledAt:"time",technicianId:"technician",requiredTrade:"trade",jobType:"type",priority:"priority",equipmentId:"equipment"}[k])).join(", ")});
      if (changed("technicianId") && j.technicianId && j.technicianId!==prevTech) await notify(`You've been assigned ${j.refNumber} (${fmtDate(j.scheduledAt)}).`, {toUser:j.technicianId, jobId:j.id});
      else if (j.technicianId && changed("scheduledAt")) await notify(`${j.refNumber} was moved to ${fmtDate(j.scheduledAt)}.`, {toUser:j.technicianId, jobId:j.id});
      closeOverlay(); toast("Job updated."); render(); return;
    }
    const id = uid("job");
    const ref = await uniqueRef(f.refNumber.value.trim()); if (!ref) return;
    const job = Object.assign({refNumber:ref, status:"assigned", leakTest:{status:"not_set"}, createdAt:now(), createdBy:me()?.name||ROLE_LABELS[S.role]}, all);
    if (!(await writeDoc("jobs/"+id, job))) return;
    S.jobs.push(Object.assign({id}, job)); S.jobSub[id] = emptySub();
    await logEvent(id, "created", {note:job.technicianId?`Assigned to ${userById(job.technicianId)?.name}`:"Waiting for a technician"});
    if (f.notes.value.trim()){ const n = {text:f.notes.value.trim(), by:me()?.name||"Dispatcher", byId:S.userId, at:now()}; const nid = await addDoc("jobs/"+id+"/notes", n, `${job.refNumber} was created, but the note couldn't be saved. Add it again on the job.`); if (nid) sub(id).notes.unshift(Object.assign({id:nid}, n)); }
    if (job.technicianId) await notify(`New job ${job.refNumber} for you · ${fmtDate(job.scheduledAt)}.`, {toUser:job.technicianId, jobId:id});
    closeOverlay(); toast(`${job.refNumber} created.`); openJob(id);
  });
}

/* ---- readings ---- */
function readingDef(j){
  const base = READINGS[j.requiredTrade] || READINGS.handyman;
  const e = equipmentById(j.equipmentId);
  if (j.requiredTrade==="hvac" && /heat pump|air cond|a\/c|mini.?split/i.test(e?.type||"")){
    const rf = READINGS.refrigeration;
    return {fields:rf.fields.concat([["supplyTemp","Supply air","°F"],["returnTemp","Return air","°F"]]), checks:rf.checks.filter(c=>c[0]!=="leftSafe").concat([["leftSafe","Equipment left in safe operating condition", true]]), refrigerant:true};
  }
  return Object.assign({refrigerant:j.requiredTrade==="refrigeration"}, base);
}
/* Removed red tags on this job or its equipment, as known to this device.
   value: the newest clearedAt/resolvedAt (the stored string; null if no removed tags, or none with a readable date).
   ids: the removed tags' ids, sorted and joined ("" if none) — a newly removed tag changes it, whatever its clock says.
   bad: a removed tag has no readable removal date. times: the readable removal times. */
function removalState(j){
  const list = S.hazards.filter(h=>h.status==="resolved" && (h.jobId===j.id || (j.equipmentId && h.equipmentId===j.equipmentId)));
  let value = null, best = -Infinity, bad = false; const times = [];
  list.forEach(h=>{
    const v = h.clearedAt || h.resolvedAt;
    if (!stepOk(v)){ bad = true; return; }
    const t = ts(v); times.push(t);
    if (t>best || (t===best && v>value)){ best = t; value = v; }
  });
  return {value, ids:list.map(h=>String(h.id)).sort().join(","), bad, times};
}
/* "Left in safe operating condition" counts only if it was ticked after every red-tag removal on this job or its equipment.
   New records: the removal state saved with the tick must equal the current one (no device clocks compared).
   Old records (no leftSafeAfterClear field): saved after every removal; a missing or unreadable removal date does not count. */
function leftSafeOk(j){
  const r = j.readings||{}; if (!r.leftSafe) return false;
  const rm = removalState(j);
  if (Object.hasOwn(r, "leftSafeAfterClear")) return (r.leftSafeAfterClear??null)===rm.value && String(r.leftSafeRemovedIds??"")===rm.ids;
  if (!rm.ids) return true;
  if (rm.bad) return false;
  const saved = r.savedAt && stepOk(r.savedAt) ? ts(r.savedAt) : NaN;
  return Number.isFinite(saved) && rm.times.every(c=>saved > c);
}
/* Fields saved with the readings that are not readings themselves. */
const READING_META = new Set(["savedBy","savedAt","leftSafeAfterClear","leftSafeRemovedIds"]);
/* Readings that can legitimately be below zero (suction can be in vacuum; outdoor air can be below 0 °F). */
const NEG_OK_READINGS = new Set(["suction","outdoor"]);
function jobReadings(j, s){
  const wrap = el(`<div class="stack"></div>`);
  const def = readingDef(j); const r = j.readings||{};
  const inReview = !EDITABLE_READING_STATUSES.includes(j.status);
  const editable = can.fieldWork(j) && !inReview;
  /* While an open immediate-hazard red tag is on this job/equipment, "left in safe operating condition" can't be ticked. */
  const imm = jobHazards(j).filter(isImmediate);
  const tagged = k=> k==="leftSafe" && imm.length>0;
  /* The removed-tag state this form was drawn with. A "left safe" tick only saves if it is still the same at save time. */
  let drawnRm = removalState(j);
  const sameRm = (a, b)=> (a.value??null)===(b.value??null) && a.ids===b.ids;
  const checkRow = ([k,label,req])=> tagged(k)
    ? `<div class="check" style="align-items:center"><span class="pill bad">${icon("tag","sm")} Appliance is red-tagged — gas shut off</span>${imm.every(h=>stepOk(h.gasShutOffAt))?"":`<span class="hint">Record the gas shut-off time on the red tag (Safety tab).</span>`}</div>`
    : k==="leftSafe" && r.leftSafe && !leftSafeOk(j)
    ? `<label class="check"><input type="checkbox" name="${k}" ${editable?"":"disabled"}><span>${esc(label)}${req?` <span class="pill nodot warn">Required to close</span>`:""}<div class="hint">Something about this appliance's red tags changed since “left safe” was last saved. Tick it again to confirm.</div></span></label>`
    : `<label class="check"><input type="checkbox" name="${k}" ${r[k]?"checked":""} ${editable?"":"disabled"}><span>${esc(label)}${req?` <span class="pill nodot warn">Required to close</span>`:""}</span></label>`;
  const form = el(`<form class="card"><div class="card-h"><div><h3>${esc(THEMES[j.requiredTrade]?.label||"")} readings</h3><div class="hint">Type what your instruments show. Leave blank what you didn't measure — nothing is filled in for you.</div></div></div>
    ${inReview && !isClosed(j)?`<div class="callout mt" style="margin-bottom:12px">${icon("lock","sm")}<div>Readings are locked while the job is in review. A supervisor can send it back if something needs changing.</div></div>`:""}
    <div class="readgrid">${def.fields.map(([k,label,unit])=>`<div class="field"><label>${esc(label)}</label><div class="unitwrap"><input class="mono" name="${k}" inputmode="decimal" value="${esc(r[k]??"")}" ${editable?"":"disabled"}><span>${esc(unit)}</span></div></div>`).join("")}</div>
    ${def.refrigerant?`<div class="field mt"><label>Refrigerant type</label><input name="refrigerant" value="${esc(r.refrigerant||equipmentById(j.equipmentId)?.refrigerant||"")}" placeholder="e.g. R-410A, R-454B" ${editable?"":"disabled"}></div>`:""}
    <h4 class="mt2" style="margin-bottom:8px">Safety checks</h4>
    <div class="stack tight">${def.checks.map(checkRow).join("")}</div>
    ${editable?`<div class="mf"><button class="btn primary">${icon("check","sm")} Save readings</button></div>`:""}
    ${r.savedBy?`<div class="hint mt">Last saved by ${esc(r.savedBy)} · ${esc(ago(r.savedAt))}</div>`:""}</form>`);
  onSubmit(form, async ()=>{
    const out = {};
    const prev = j.readings||{};
    /* Saving with nothing left is allowed when it removes values that were stored before (e.g. unticking a check). */
    const hadAny = def.fields.some(([k])=>prev[k]!==undefined && prev[k]!=="") || def.checks.some(([k])=>prev[k]);
    def.fields.forEach(([k])=>{ const v = form[k].value.trim(); if (v!=="") out[k]=v; });
    def.checks.forEach(([k])=>{ if (form[k] && form[k].checked) out[k]=true; });
    if (form.refrigerant && form.refrigerant.value.trim()) out.refrigerant = form.refrigerant.value.trim();
    /* The refrigerant type can be pre-filled from the equipment, so it alone doesn't count as a reading. */
    const isEmpty = !def.fields.some(([k])=>out[k]!==undefined) && !def.checks.some(([k])=>out[k]);
    if (isEmpty && !hadAny){ toast("Enter at least one reading.","bad"); return; }
    const bad = def.fields.filter(([k])=> out[k]!==undefined && parseNum(out[k], NEG_OK_READINGS.has(k))===null);
    if (bad.length){ toast(`“${bad[0][1]}” must be a plain number${NEG_OK_READINGS.has(bad[0][0])?"":" (0 or more)"}, e.g. 3.5.`,"bad"); return; }
    if (!(await freshJob(j, EDITABLE_READING_STATUSES))) return;
    if (!(await freshHazards({noRender:true}))) return;
    /* A red tag was removed (here or on another device) since the form was drawn: the tick must be given again.
       Untick only that box — the typed readings stay in the form. */
    const nowRm = removalState(j);
    if (out.leftSafe && !sameRm(drawnRm, nowRm)){
      drawnRm = nowRm; if (form.leftSafe) form.leftSafe.checked = false;
      toast("Something changed — tick “left safe” again.","bad"); return;
    }
    const droppedSafe = !!out.leftSafe && jobHazards(j).some(isImmediate);
    if (droppedSafe) delete out.leftSafe;
    if (out.leftSafe){ const rm = removalState(j); out.leftSafeAfterClear = rm.value; out.leftSafeRemovedIds = rm.ids; }
    if (j.requiredTrade==="hvac" && Number(out.coAirFree)>=400) toast("Flue CO is very high. Check the appliance and consider a red tag before leaving.","bad");
    out.savedBy = me()?.name||""; out.savedAt = now();
    if (!(await writeDoc("jobs/"+j.id, {readings:out}, true))) return;
    j.readings = out;
    await logEvent(j.id, "readings", {note:isEmpty ? "Readings cleared" : `${Object.keys(out).filter(k=>!READING_META.has(k)).length} reading(s)/check(s) saved`});
    if (droppedSafe) toast("Readings saved. “Left safe” was not saved: the appliance is now red-tagged.","bad");
    else toast("Readings saved."); renderMain();
  });
  wrap.appendChild(form);
  return wrap;
}

function setupDictation(btn, ta){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ btn.disabled = true; btn.title = "Dictation isn't supported in this browser."; return; }
  let rec = null, on = false;
  btn.addEventListener("click", ()=>{
    if (on){ rec && rec.stop(); return; }
    try{
      rec = new SR(); rec.lang = navigator.language || "en-CA"; rec.interimResults = true; rec.continuous = true;
      const base = ta.value ? ta.value.trim()+" " : "";
      rec.onresult = ev=>{ let t = ""; for (const r of ev.results) t += r[0].transcript; ta.value = base + t; };
      rec.onerror = ev=>{ toast(ev.error==="not-allowed"?"Microphone access was blocked.":"Dictation stopped.","bad"); };
      rec.onend = ()=>{ on=false; btn.innerHTML = icon("mic","sm")+" Dictate"; btn.classList.remove("danger"); };
      rec.start(); on = true; btn.innerHTML = icon("mic","sm")+" Listening… tap to stop"; btn.classList.add("danger");
    }catch(e){ toast("Dictation couldn't start.","bad"); }
  });
}

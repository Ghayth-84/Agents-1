<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeRoutine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#0c1830; --navy2:#13223f; --navy-line:#22345a;
  --brand-blue:#2f9bff; --brand-red:#e8402f; --brand-orange:#ff8a1f;
  --primary:#1f74db; --primary-ink:#ffffff; --accent:#e8402f;
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e5e9f1;
  --border:#dde2ec; --text:#0f1b2e; --text-dim:#5a6579; --text-faint:#8a94a7;
  --ok:#14804a; --warn:#b26a00; --bad:#c62f1e; --info:#1f74db; --violet:#6d4fd8; --slate:#5a6579;
  --shadow:0 1px 2px rgba(15,27,46,.06), 0 4px 16px rgba(15,27,46,.06);
  --shadow-lg:0 12px 40px rgba(8,16,34,.22);
  --radius:14px; --radius-sm:10px;
  --nav-w:236px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a111e; --surface:#111a2b; --surface2:#162236; --surface3:#1c2a42;
    --border:#243350; --text:#e9eef7; --text-dim:#9aa7bf; --text-faint:#6f7d97;
    --ok:#3ccf8a; --warn:#f0a83c; --bad:#ff6b57; --info:#5aa9ff; --violet:#a28bff; --slate:#9aa7bf;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a111e; --surface:#111a2b; --surface2:#162236; --surface3:#1c2a42;
  --border:#243350; --text:#e9eef7; --text-dim:#9aa7bf; --text-faint:#6f7d97;
  --ok:#3ccf8a; --warn:#f0a83c; --bad:#ff6b57; --info:#5aa9ff; --violet:#a28bff; --slate:#9aa7bf;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--text); font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14.5px; line-height:1.45; -webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
h1,h2,h3,h4{margin:0; text-wrap:balance; letter-spacing:-.015em}
h1{font-size:26px; font-weight:800}
h2{font-size:20px; font-weight:750}
h3{font-size:16px; font-weight:700}
h4{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim)}
p{margin:0}
a{color:var(--primary); text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-blue); outline-offset:2px; border-radius:6px}
svg.i{width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
svg.i.sm{width:15px; height:15px}
svg.i.lg{width:22px; height:22px}

/* ---------- shell ---------- */
#app{display:flex; min-height:100vh}
#side{width:var(--nav-w); flex:none; background:var(--navy); color:#d7e1f2; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:18px 12px; border-right:1px solid var(--navy-line)}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px}
.brand .name{font-weight:800; font-size:18px; letter-spacing:-.02em; color:#fff}
.brand .name b{color:var(--brand-orange); font-weight:800}
.brand .co{font-size:11.5px; color:#8da0c2; margin-top:1px}
.navlist{display:flex; flex-direction:column; gap:2px; overflow:auto; flex:1; margin:0 -4px; padding:0 4px}
.navlist button{display:flex; align-items:center; gap:11px; width:100%; text-align:left; border:0; background:transparent; color:#b7c4dc; padding:9px 11px; border-radius:10px; font-weight:600; font-size:14px; position:relative}
.navlist button:hover{background:var(--navy2); color:#fff}
.navlist button.active{background:linear-gradient(90deg, rgba(47,155,255,.20), rgba(47,155,255,.06)); color:#fff}
.navlist button.active::before{content:""; position:absolute; left:-4px; top:9px; bottom:9px; width:3px; border-radius:3px; background:linear-gradient(var(--brand-blue) 50%, var(--brand-red) 50%)}
.navlist .count{margin-left:auto; background:var(--brand-red); color:#fff; font-size:11px; font-weight:700; border-radius:20px; padding:1px 7px; min-width:20px; text-align:center}
.navsec{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:#6f84a9; padding:14px 11px 6px; font-weight:700}
.rolecard{margin-top:12px; background:var(--navy2); border:1px solid var(--navy-line); border-radius:12px; padding:10px}
.rolecard label{display:block; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#8da0c2; margin-bottom:6px; font-weight:700}
.rolecard select{width:100%; background:#0a1426; color:#fff; border:1px solid var(--navy-line); border-radius:8px; padding:8px}
.rolecard .who{display:flex; align-items:center; gap:9px; margin-top:9px}
.rolecard .who .nm{font-weight:700; color:#fff; font-size:13.5px}
.rolecard .who .rl{font-size:11.5px; color:#8da0c2}

#mainwrap{flex:1; min-width:0; display:flex; flex-direction:column}
#top{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; padding:12px 24px; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--border)}
#top .crumb{font-weight:750; font-size:17px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#top .spacer{flex:1}
.searchbtn{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); border-radius:10px; padding:8px 12px; min-width:240px; box-shadow:var(--shadow)}
.searchbtn kbd{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:11px; border:1px solid var(--border); border-radius:5px; padding:1px 5px; background:var(--surface2)}
.iconbtn{position:relative; display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); box-shadow:var(--shadow)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn .dot{position:absolute; top:-5px; right:-5px; background:var(--brand-red); color:#fff; font-size:10.5px; font-weight:700; border-radius:20px; padding:1px 6px; border:2px solid var(--bg)}
#banner{margin:14px 24px 0; padding:9px 13px; border-radius:10px; background:color-mix(in srgb, var(--warn) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--warn) 35%, transparent); color:var(--text); font-size:13px; display:flex; gap:8px; align-items:center}
#main{padding:20px 24px 90px; max-width:1280px; width:100%}
#tabbar{display:none}

/* ---------- primitives ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.pad0{padding:0; overflow:hidden}
.card-h{display:flex; align-items:center; gap:10px; justify-content:space-between; margin-bottom:12px}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex; align-items:center; gap:8px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.row.top{align-items:flex-start}
.stack{display:flex; flex-direction:column; gap:10px}
.stack.tight{gap:6px}
.dim{color:var(--text-dim)} .faint{color:var(--text-faint)}
.small{font-size:12.5px} .tiny{font-size:11.5px}
.hint{font-size:12.5px; color:var(--text-dim)}
.sep{border:0; border-top:1px solid var(--border); margin:14px 0}
.pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.pagehead .sub{color:var(--text-dim); margin-top:4px}
.mt{margin-top:14px} .mt2{margin-top:22px}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 14px; font-weight:650; font-size:14px; white-space:nowrap; transition:transform .06s ease, background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary); border-color:var(--primary); color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.go{background:var(--ok); border-color:var(--ok); color:#fff}
.btn.danger{background:transparent; color:var(--bad); border-color:color-mix(in srgb, var(--bad) 45%, transparent)}
.btn.danger.solid{background:var(--bad); color:#fff}
.btn.ghost{background:transparent; border-color:transparent; box-shadow:none}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:6px 10px; font-size:12.5px; border-radius:8px}
.btn.lg{padding:13px 18px; font-size:15.5px; border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none}

.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:650; padding:3px 10px; border-radius:30px; white-space:nowrap; background:color-mix(in srgb, var(--c,var(--slate)) 13%, transparent); color:var(--c,var(--slate)); border:1px solid color-mix(in srgb, var(--c,var(--slate)) 28%, transparent)}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.nodot::before{display:none}
.pill.ok{--c:var(--ok)} .pill.warn{--c:var(--warn)} .pill.bad{--c:var(--bad)} .pill.info{--c:var(--info)} .pill.violet{--c:var(--violet)} .pill.slate{--c:var(--slate)}
.count{display:inline-flex; align-items:center; justify-content:center; background:var(--brand-red); color:#fff; font-size:11px; font-weight:700; border-radius:20px; padding:1px 7px; min-width:20px; margin-left:6px}
.avatar{width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:750; font-size:12px; color:#fff; flex:none; background:var(--av,#475569)}
.avatar.sm{width:24px; height:24px; font-size:10.5px}
.avatar.lg{width:40px; height:40px; font-size:14px}

.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field label{font-size:12.5px; font-weight:650; color:var(--text-dim)}
.field input,.field select,.field textarea, input.in, select.in, textarea.in{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 11px; color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus, .in:focus{outline:none; border-color:var(--brand-blue); box-shadow:0 0 0 3px color-mix(in srgb, var(--brand-blue) 22%, transparent)}
.field textarea, textarea.in{resize:vertical; min-height:84px}
.check{display:flex; gap:9px; align-items:flex-start; padding:9px 11px; border:1px solid var(--border); border-radius:10px; background:var(--surface)}
.check input{margin-top:3px; width:16px; height:16px; accent-color:var(--primary)}
.unitwrap{position:relative}
.unitwrap span{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--text-faint); pointer-events:none}
.unitwrap input{padding-right:52px}

table{width:100%; border-collapse:collapse}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--surface2)}
td{padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.tablewrap{overflow-x:auto}

.empty{padding:34px 16px; text-align:center; color:var(--text-dim)}
.empty svg{width:34px; height:34px; stroke:var(--text-faint); margin-bottom:8px}
.note{padding:10px 12px; border-radius:10px; background:var(--surface2); border:1px solid var(--border)}
.note .meta{font-size:11.5px; color:var(--text-faint); margin-bottom:3px}
.callout{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:12px; border:1px solid color-mix(in srgb, var(--c,var(--info)) 35%, transparent); background:color-mix(in srgb, var(--c,var(--info)) 9%, var(--surface)); font-size:13.5px}
.callout svg{color:var(--c,var(--info)); margin-top:1px}
.callout.warn{--c:var(--warn)} .callout.bad{--c:var(--bad)} .callout.ok{--c:var(--ok)}

/* ---------- KPI ---------- */
.kpi{position:relative; overflow:hidden}
.kpi .lbl{font-size:12.5px; color:var(--text-dim); font-weight:600; display:flex; align-items:center; gap:7px}
.kpi .num{font-family:"JetBrains Mono",monospace; font-size:30px; font-weight:600; letter-spacing:-.03em; margin-top:6px}
.kpi .foot{font-size:12px; color:var(--text-faint); margin-top:2px}
.kpi::after{content:""; position:absolute; right:-24px; top:-24px; width:84px; height:84px; border-radius:50%; background:color-mix(in srgb, var(--c,var(--brand-blue)) 10%, transparent)}
.kpi.alert{--c:var(--brand-red)}

/* ---------- job cards ---------- */
.jobcard{display:flex; flex-direction:column; gap:8px; padding:13px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow); cursor:pointer; position:relative; transition:border-color .15s, transform .1s}
.jobcard:hover{border-color:color-mix(in srgb, var(--brand-blue) 50%, var(--border))}
.jobcard::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:0 3px 3px 0; background:var(--pc,transparent)}
.jobcard .t1{display:flex; align-items:center; gap:8px; justify-content:space-between}
.jobcard .ref{font-family:"JetBrains Mono",monospace; font-weight:600; font-size:13px}
.jobcard .cust{font-weight:700; font-size:15px}
.jobcard .addr{font-size:12.5px; color:var(--text-dim); display:flex; gap:5px; align-items:center}
.jobcard .t3{display:flex; align-items:center; gap:8px; justify-content:space-between; margin-top:2px}
.prio-emergency{--pc:var(--bad)} .prio-high{--pc:var(--warn)} .prio-normal{--pc:var(--info)} .prio-low{--pc:var(--slate)}
.jobgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px}

.board{display:grid; grid-template-columns:repeat(6,minmax(220px,1fr)); gap:12px; overflow-x:auto; padding-bottom:6px}
.col{background:var(--surface2); border:1px solid var(--border); border-radius:14px; padding:10px; min-height:140px; display:flex; flex-direction:column; gap:9px}
.col .colh{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:13px; padding:2px 4px}
.col .jobcard{box-shadow:none}

/* ---------- hero ---------- */
.hero{background:linear-gradient(135deg, var(--navy) 0%, #142a52 100%); color:#fff; border-radius:18px; padding:20px 22px; position:relative; overflow:hidden; border:1px solid var(--navy-line)}
.hero::after{content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(47,155,255,.35), transparent 70%)}
.hero::before{content:""; position:absolute; left:-40px; bottom:-80px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(232,64,47,.28), transparent 70%)}
.hero > *{position:relative; z-index:1}
.hero .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#9fb5da; font-weight:700}
.hero h1,.hero h2{color:#fff}
.hero .dim{color:#b9c8e2}
.hero .btn{border-color:rgba(255,255,255,.18); background:rgba(255,255,255,.08); color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.16)}
.hero .btn.primary{background:var(--brand-blue); border-color:var(--brand-blue)}
.hero .btn.go{background:#18a35e; border-color:#18a35e}

/* ---------- stepper ---------- */
.steps{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:16px 0 4px}
.steps .s{display:flex; flex-direction:column; gap:6px}
.steps .bar{height:6px; border-radius:6px; background:var(--surface3)}
.steps .s.done .bar{background:var(--ok)}
.steps .s.cur .bar{background:linear-gradient(90deg,var(--brand-blue),var(--brand-red))}
.steps .lb{font-size:11.5px; color:var(--text-faint); font-weight:600}
.steps .s.done .lb,.steps .s.cur .lb{color:var(--text)}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin:18px 0 16px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex; align-items:center; gap:7px; border:0; background:none; padding:10px 12px; font-weight:650; color:var(--text-dim); border-bottom:2px solid transparent; white-space:nowrap; margin-bottom:-1px}
.tabs button.active{color:var(--text); border-color:var(--primary)}
.seg{display:inline-flex; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; padding:6px 11px; border-radius:7px; font-weight:650; font-size:13px; color:var(--text-dim); display:inline-flex; gap:6px; align-items:center}
.seg button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}

/* ---------- timeline ---------- */
.tl{position:relative; padding-left:26px}
.tl::before{content:""; position:absolute; left:10px; top:6px; bottom:6px; width:2px; background:var(--border)}
.tl .ev{position:relative; padding:0 0 16px}
.tl .ev .dot{position:absolute; left:-26px; top:0; width:22px; height:22px; border-radius:50%; background:var(--surface); border:2px solid var(--c,var(--slate)); display:flex; align-items:center; justify-content:center; color:var(--c,var(--slate))}
.tl .ev .dot svg{width:12px; height:12px; stroke-width:2.4}
.tl .ev .meta{font-size:11.5px; color:var(--text-faint)}

/* ---------- misc ---------- */
.ring{--p:0; width:58px; height:58px; border-radius:50%; background:conic-gradient(var(--ok) calc(var(--p)*1%), var(--surface3) 0); display:flex; align-items:center; justify-content:center; flex:none}
.ring > span{width:44px; height:44px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-weight:600; font-size:12.5px}
.bars{display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:8px}
.bars .b{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end}
.bars .b .v{width:100%; max-width:44px; border-radius:7px 7px 3px 3px; background:linear-gradient(var(--brand-blue), color-mix(in srgb, var(--brand-blue) 55%, var(--surface))); min-height:3px}
.bars .b .n{font-family:"JetBrains Mono",monospace; font-size:11.5px; font-weight:600}
.bars .b .l{font-size:11px; color:var(--text-faint); white-space:nowrap}
.hbar{display:grid; grid-template-columns:130px 1fr 44px; gap:10px; align-items:center; margin:7px 0; font-size:13px}
.hbar .track{height:10px; border-radius:10px; background:var(--surface3); overflow:hidden}
.hbar .track > div{height:100%; border-radius:10px; background:linear-gradient(90deg,var(--brand-blue),var(--brand-red))}
.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px}
.thumb{position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:var(--surface2); aspect-ratio:4/3; cursor:zoom-in}
.thumb img,.thumb video{width:100%; height:100%; object-fit:cover; display:block}
.thumb .cap{position:absolute; left:6px; bottom:6px; font-size:11px; font-weight:700; background:rgba(8,16,34,.72); color:#fff; padding:2px 7px; border-radius:20px}
.confbar{height:7px; border-radius:7px; background:var(--surface3); overflow:hidden}
.confbar > div{height:100%; background:linear-gradient(90deg,var(--brand-blue),var(--ok))}
.kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px 18px}
.kv .k{font-size:11.5px; color:var(--text-faint); font-weight:650; text-transform:uppercase; letter-spacing:.06em}
.kv .v{font-weight:600; margin-top:2px; word-break:break-word}
.readgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px}
.lane{display:grid; grid-template-columns:170px 1fr; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border)}
.lane:last-child{border-bottom:0}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface2); border-radius:10px; padding:6px 10px; font-size:12.5px; cursor:pointer}
.chip:hover{border-color:var(--brand-blue)}
.alertrow{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border); cursor:pointer}
.alertrow:last-child{border-bottom:0}
.alertrow .ic{width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; background:color-mix(in srgb, var(--c,var(--info)) 14%, transparent); color:var(--c,var(--info))}
.lock{display:flex; gap:10px; align-items:center; padding:11px 14px; border-radius:12px; background:var(--surface2); border:1px dashed var(--border); color:var(--text-dim); font-size:13.5px; margin-top:12px}
.actionbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.sig{width:100%; height:160px; touch-action:none; background:#fff; border:1px solid var(--border); border-radius:12px; display:block}
#qrbox{background:#fff; padding:12px; border-radius:12px; display:inline-block}
.redtag{border:2px solid var(--bad); background:color-mix(in srgb, var(--bad) 8%, var(--surface)); border-radius:14px; padding:14px 16px}
.redtag .tagh{display:flex; align-items:center; gap:8px; color:var(--bad); font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:13px}

/* ---------- overlays ---------- */
.overlay{position:fixed; inset:0; background:rgba(6,12,26,.55); backdrop-filter:blur(3px); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; animation:fade .15s ease}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); width:min(620px,100%); max-height:90vh; overflow:auto; padding:22px; animation:pop .18s ease}
.modal.wide{width:min(860px,100%)}
.modal .mh{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px}
.modal .mf{display:flex; justify-content:flex-end; gap:8px; margin-top:18px; flex-wrap:wrap}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(420px,100%); background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-lg); z-index:101; display:flex; flex-direction:column; animation:slide .2s ease}
.drawer .dh{display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--border)}
.drawer .db{overflow:auto; padding:8px 10px; flex:1}
.notif{display:flex; gap:10px; padding:11px 10px; border-radius:10px; cursor:pointer}
.notif:hover{background:var(--surface2)}
.notif.unread{background:color-mix(in srgb, var(--brand-blue) 8%, transparent)}
.notif .nd{width:8px; height:8px; border-radius:50%; background:var(--brand-blue); margin-top:6px; flex:none}
.palette{width:min(620px,100%); align-self:flex-start; margin-top:10vh; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-lg); overflow:hidden; animation:pop .15s ease}
.palette .pin{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border)}
.palette .pin input{border:0; background:transparent; flex:1; font-size:16px; outline:none}
.palette .res{max-height:55vh; overflow:auto; padding:6px}
.palette .grp{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:10px 10px 4px; font-weight:700}
.palette .it{display:flex; gap:10px; align-items:center; padding:9px 10px; border-radius:9px; cursor:pointer}
.palette .it.sel,.palette .it:hover{background:var(--surface2)}
.lightbox{max-width:min(1000px,100%); max-height:90vh}
.lightbox img,.lightbox video{max-width:100%; max-height:84vh; border-radius:12px; display:block}
#toasts{position:fixed; z-index:200; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; align-items:flex-end}
.toast{background:var(--navy); color:#fff; padding:11px 15px; border-radius:12px; font-size:13.5px; box-shadow:var(--shadow-lg); max-width:340px; display:flex; gap:9px; align-items:flex-start; animation:pop .18s ease; border:1px solid var(--navy-line)}
.toast.bad{background:#7a1d12}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98)}to{opacity:1; transform:none}}
@keyframes slide{from{transform:translateX(30px); opacity:0}to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main{grid-template-columns:1fr} }
@media (max-width:860px){
  #side{display:none}
  #top{padding:10px 16px}
  .searchbtn{min-width:0; width:38px; height:38px; padding:0; justify-content:center} .searchbtn span,.searchbtn kbd{display:none}
  #banner{margin:12px 16px 0}
  #main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .g2,.g3{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(6,minmax(240px,1fr))}
  .lane{grid-template-columns:1fr}
  #tabbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--navy); border-top:1px solid var(--navy-line); padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  #tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:0; background:transparent; color:#9fb0cf; font-size:10.5px; font-weight:650; padding:6px 2px; border-radius:10px; position:relative}
  #tabbar button.active{color:#fff; background:var(--navy2)}
  #tabbar button .count{position:absolute; top:0; right:calc(50% - 22px); margin:0; font-size:10px; padding:0 5px; min-width:16px}
  #toasts{left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); align-items:stretch}
  .toast{max-width:none}
  .modal{padding:18px; border-radius:18px 18px 0 0; align-self:flex-end; max-height:92vh}
  .overlay.sheet{align-items:flex-end; padding:0}
  .hbar{grid-template-columns:100px 1fr 36px}
  .mobile-sticky{position:sticky; bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); padding:10px 0; margin:0 -2px}
}
@media (max-width:520px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi .num{font-size:24px} h1{font-size:22px} .steps .lb{font-size:10px} }
@media print{ #side,#top,#tabbar,#banner,.btn,.tabs{display:none!important} #main{padding:0} .card{box-shadow:none} }
</style>
</head>

const ts = iso=> iso ? new Date(iso).getTime() : 0;
const fmtTime = iso=> iso ? new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) : "—";
const fmtDay = iso=>{
  if (!iso) return "—";
  const d = new Date(iso), t = new Date(); const diff = Math.round((new Date(d.toDateString()) - new Date(t.toDateString()))/DAY);
  if (diff===0) return "Today"; if (diff===1) return "Tomorrow"; if (diff===-1) return "Yesterday";
  return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
};
const fmtDate = iso=> iso ? fmtDay(iso)+" · "+fmtTime(iso) : "—";
const fmtDateOnly = iso=> iso ? new Date(iso).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : "—";
const ago = iso=>{
  if (!iso) return ""; const s = (Date.now()-ts(iso))/1000;
  if (s<60) return "just now"; if (s<3600) return Math.floor(s/60)+"m ago"; if (s<86400) return Math.floor(s/3600)+"h ago";
  if (s<86400*7) return Math.floor(s/86400)+"d ago"; return fmtDateOnly(iso);
};

/* In-memory store with the same API as the shared db. Used only when shared
   storage can't be reached (local preview), so every screen stays usable.
   Nothing written here survives a reload. */
class MemDB {
  constructor(){ this.cols = {}; }
  _col(p){ return (this.cols[p] = this.cols[p] || {}); }
  doc(path){
    const i = path.lastIndexOf("/"), col = path.slice(0,i), id = path.slice(i+1), self = this;
    return {
      id,
      async get(){ const d = self._col(col)[id]; return {id, exists:!!d, data:()=>d?JSON.parse(JSON.stringify(d)):undefined}; },
      async set(data){ self._col(col)[id] = JSON.parse(JSON.stringify(data)); },
      async update(data){ const c=self._col(col); c[id] = Object.assign(c[id]||{}, JSON.parse(JSON.stringify(data))); },
      collection(name){ return self.collection(path+"/"+name); },
    };
  }
  collection(path){
    const self = this; let order = null, lim = null;
    const q = {
      orderBy(f, dir){ order=[f, dir||"asc"]; return q; },
      limit(n){ lim=n; return q; },
      async get(){
        let docs = Object.entries(self._col(path)).map(([id,d])=>({id, data:()=>JSON.parse(JSON.stringify(d)), _d:d}));
        if (order) docs.sort((a,b)=>{ const x=a._d[order[0]], y=b._d[order[0]]; return (x>y?1:x<y?-1:0)*(order[1]==="desc"?-1:1); });
        if (lim) docs = docs.slice(0,lim);
        return {docs};
      },
      async add(data){ const id = uid("d"); self._col(path)[id] = JSON.parse(JSON.stringify(data)); return {id}; },
      doc(id){ return self.doc(path+"/"+id); },
    };
    return q;
  }
}

async function boot(){
  try{
    if (window.claude && window.claude.use){
      db = await window.claude.use("db");
      try{ assets = await window.claude.use("assets"); }catch(e){ assets = null; }
    }
  }catch(e){ db = null; }
  if (db){
    mode = "live";
    const ok = await loadAll();
    if (!ok){ db = new MemDB(); mode = "preview"; await seedPreview(); await loadAll(); }
    else if (!S.config.seedVersion && !S.hazards.length && S.jobs.every(j=>/^JOB-100[1-5]$/.test(j.refNumber||""))){
      /* The shared store still holds only the original example records: refresh them once to the fuller example set. */
      $("#main").innerHTML = `<div class="card">${emptyState("sparkle","Setting up the example data…")}</div>`;
      try{ await seedPreview(); await loadAll(); }catch(e){ console.error("example refresh failed", e); }
    }
  } else {
    db = new MemDB(); mode = "preview"; await seedPreview(); await loadAll();
  }
  const savedRole = lsGet("sr_role");
  setRole(ROLE_LABELS[savedRole] ? savedRole : "technician", true);
}

async function loadAll(){
  try{
    const cfg = await db.doc("app/config").get();
    if (cfg.exists){ const c = cfg.data(); S.config = Object.assign({}, S.config, c, {modules:Object.assign({}, S.config.modules, c.modules||{}), gpsPolicy:Object.assign({}, S.config.gpsPolicy, c.gpsPolicy||{})}); }
    const names = ["users","customers","equipment","jobs","feedback","consent","hazards"];
    const snaps = await Promise.all(names.map(n=>db.collection(n).get().catch(()=>({docs:[]}))));
    names.forEach((n,i)=> S[n] = snaps[i].docs.map(d=>Object.assign({id:d.id}, d.data())));
    const ns = await db.collection("notifications").orderBy("at","desc").limit(100).get().catch(()=>({docs:[]}));
    S.notifications = ns.docs.map(d=>Object.assign({id:d.id}, d.data()));
    S.users.forEach(normalizeUser);
    await Promise.all(S.jobs.map(j=>loadJobSub(j.id)));
    return true;
  }catch(e){ console.error("loadAll failed", e); return false; }
}
function normalizeUser(u){
  u.credentials = (u.credentials||[]).map(c=> typeof c==="string" ? {name:c, number:"", expires:""} : c);
  if (u.active===undefined) u.active = true;
}
async function loadJobSub(jobId){
  if (!S.jobSub[jobId]) S.jobSub[jobId] = emptySub();
  try{
    const jd = db.doc("jobs/"+jobId);
    const snaps = await Promise.all(SUB.map(n=> jd.collection(n).orderBy("at", n==="events"?"asc":"desc").get().catch(()=>({docs:[]}))));
    const sub = emptySub();
    SUB.forEach((n,i)=> sub[n] = snaps[i].docs.map(d=>Object.assign({id:d.id}, d.data())));
    S.jobSub[jobId] = sub;
  }catch(e){ console.error("loadJobSub", e); }
}
async function writeDoc(path, data, merge){
  try{
    if (merge) await db.doc(path).update(data); else await db.doc(path).set(data);
    return true;
  }catch(e){
    if (merge){ try{ await db.doc(path).set(data); return true; }catch(e2){ console.error(e2); } }
    console.error("write failed", path, e); toast("Couldn't save — check your connection and try again.", "bad"); return false;
  }
}
async function addDoc(colPath, data){
  try{ const ref = await db.collection(colPath).add(data); return ref.id; }
  catch(e){ console.error("add failed", colPath, e); toast("Couldn't save — check your connection and try again.", "bad"); return null; }
}
async function uploadFile(file){
  if (assets){ try{ const up = await assets.upload(file); return {url:up.url, assetId:up.id}; }catch(e){ console.error(e); } }
  const url = await new Promise(res=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(URL.createObjectURL(file)); r.readAsDataURL(file); });
  return {url, assetId:null};
}

const TRACKED = ["notes","media","materials","extractions"];
const seenKey = (jobId, sec)=> "sr_seen_"+(S.userId||"x")+"_"+jobId+"_"+sec;
function sectionUnseen(jobId, sec){
  const since = ts(lsGet(seenKey(jobId,sec)) || "1970-01-01T00:00:00Z");
  return (sub(jobId)[sec]||[]).filter(it=> ts(it.at) > since && it.byId !== S.userId && it.by !== me()?.name);
}
const markSeen = (jobId, sec)=> lsSet(seenKey(jobId,sec), now());
const jobUnseen = jobId=> TRACKED.reduce((n,s)=> n+sectionUnseen(jobId,s).length, 0);

}

function showModal(node, opts){
  opts = opts||{};
  const ov = el(`<div class="overlay ${opts.sheet?"sheet":""}" role="dialog" aria-modal="true"></div>`);
  const box = el(`<div class="modal ${opts.wide?"wide":""}"></div>`);
  box.appendChild(node); ov.appendChild(box);
  ov.addEventListener("click", e=>{ if (e.target===ov) closeOverlay(); });
  $$("[data-close]", node).forEach(b=>b.addEventListener("click", closeOverlay));
  $("#overlays").innerHTML = ""; $("#overlays").appendChild(ov);
  setTimeout(()=>{ const f = node.querySelector("input:not([type=checkbox]):not([type=file]),select,textarea"); if (f && !opts.noFocus) f.focus(); }, 30);
  return ov;
}
function closeOverlay(){ $("#overlays").innerHTML = ""; }
document.addEventListener("keydown", e=>{
  if (e.key==="Escape") closeOverlay();
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openPalette(); }
});
function modalHead(title, sub){ return `<div class="mh"><div><h3>${esc(title)}</h3>${sub?`<div class="hint">${esc(sub)}</div>`:""}</div><button class="btn ghost sm" type="button" data-close aria-label="Close">${icon("x")}</button></div>`; }
function confirmBox(title, msg, okLabel, danger){
  return new Promise(res=>{
    const b = el(`<div>${modalHead(title)}<p>${esc(msg)}</p><div class="mf"><button class="btn" data-no>Cancel</button><button class="btn ${danger?"danger solid":"primary"}" data-yes>${esc(okLabel||"Confirm")}</button></div></div>`);
    showModal(b, {noFocus:true});
    $("[data-no]", b).addEventListener("click", ()=>{ closeOverlay(); res(false); });
    $("[data-yes]", b).addEventListener("click", ()=>{ closeOverlay(); res(true); });
  });
}
function openLightbox(m){
  const isVid = (m.contentType||"").startsWith("video");
  const ov = el(`<div class="overlay"><div class="lightbox stack">${isVid?`<video src="${esc(m.url)}" controls autoplay></video>`:`<img src="${esc(m.url)}" alt="${esc(m.category||"photo")}">`}
    <div class="row between" style="color:#fff"><span>${esc(m.category||"Photo")}${m.caption?" — "+esc(m.caption):""}</span><span class="small">${esc(m.by||"")} · ${esc(fmtDate(m.at))}</span></div></div></div>`);
  ov.addEventListener("click", closeOverlay);
  $("#overlays").innerHTML=""; $("#overlays").appendChild(ov);
}

/* Notifications drawer */
function openNotifications(){
  const list = myNotifs();
  const ov = el(`<div class="overlay" style="justify-content:flex-end;padding:0"></div>`);
  const d = el(`<aside class="drawer"><div class="dh"><h3>Notifications</h3><div class="row"><button class="btn sm" id="markAll">Mark all read</button><button class="btn ghost sm" data-close>${icon("x")}</button></div></div><div class="db"></div></aside>`);
  const body = $(".db", d);
  if (!list.length) body.innerHTML = emptyState("bell","You're all caught up.");
  list.forEach(n=>{
    const r = el(`<div class="notif ${isRead(n)?"":"unread"}">${isRead(n)?'<span style="width:8px"></span>':'<span class="nd"></span>'}<div style="flex:1"><div>${esc(n.message)}</div><div class="tiny faint">${esc(ago(n.at))}</div></div>${n.jobId?icon("chev","sm"):""}</div>`);
    r.addEventListener("click", ()=>{ markRead([n]); if (n.jobId && jobById(n.jobId)) openJob(n.jobId); else { closeOverlay(); render(); } });
    body.appendChild(r);
  });
  ov.appendChild(d); ov.addEventListener("click", e=>{ if (e.target===ov) closeOverlay(); });
  $$("[data-close]", d).forEach(b=>b.addEventListener("click", closeOverlay));
  $("#markAll", d).addEventListener("click", ()=>{ markRead(list.filter(n=>!isRead(n))); closeOverlay(); render(); });
  $("#overlays").innerHTML=""; $("#overlays").appendChild(ov);
}
function markRead(items){
  items.forEach(n=>{
    if (isRead(n)) return;
    n.readBy = (n.readBy||[]).concat(S.userId||"anon");
    writeDoc("notifications/"+n.id, {readBy:n.readBy}, true);
  });
  renderTop();
}

/* Command palette */
function openPalette(){
  const ov = el(`<div class="overlay"><div class="palette" role="dialog" aria-label="Search">
    <div class="pin">${icon("search")}<input id="palIn" placeholder="Search jobs, customers, equipment, screens…" autocomplete="off"><kbd class="tiny faint">Esc</kbd></div>
    <div class="res" id="palRes"></div></div></div>`);
  ov.addEventListener("click", e=>{ if (e.target===ov) closeOverlay(); });
  $("#overlays").innerHTML=""; $("#overlays").appendChild(ov);
  const input = $("#palIn"), res = $("#palRes"); let items = [], sel = 0;
  function draw(){
    const q = input.value.trim().toLowerCase(); items = [];
    const match = (...vals)=> !q || vals.filter(Boolean).some(v=>String(v).toLowerCase().includes(q));
    navFor(S.role).forEach(([k,label,ic])=>{ if (match(label)) items.push({g:"Screens", ic, t:label, s:"", go:()=>go(k)}); });
    visibleJobs().filter(j=>match(j.refNumber, customerById(j.customerId)?.name, j.siteAddress, userById(j.technicianId)?.name, j.jobType)).slice(0,8)
      .forEach(j=> items.push({g:"Jobs", ic:isClosed(j)?"archive":"wrench", t:`${j.refNumber} · ${customerById(j.customerId)?.name||""}`, s:`${STATUS[j.status]?.label||j.status} · ${fmtDay(j.scheduledAt)}`, go:()=>openJob(j.id)}));
    if (!isField() && S.role!=="accountant") S.customers.filter(c=>match(c.name, c.address, c.phone)).slice(0,6)
      .forEach(c=> items.push({g:"Customers", ic:"contact", t:c.name, s:c.address||"", go:()=>openCustomer(c.id)}));
    if (S.role!=="accountant") S.equipment.filter(e=>match(e.manufacturer, e.model, e.serial, e.type)).slice(0,6)
      .forEach(e=> items.push({g:"Equipment", ic:"box", t:`${e.manufacturer||""} ${e.model||""}`, s:`${e.type||""} · S/N ${e.serial||"—"}`, go:()=>openEquipment(e.id)}));
    if (!q) items = items.filter(i=>i.g!=="Customers" && i.g!=="Equipment").slice(0,12);
    sel = Math.min(sel, Math.max(items.length-1,0));
    res.innerHTML = ""; let lastG = "";
    if (!items.length) res.innerHTML = `<div class="empty">No matches for “${esc(input.value)}”.</div>`;
    items.forEach((it,i)=>{
      if (it.g!==lastG){ res.appendChild(el(`<div class="grp">${esc(it.g)}</div>`)); lastG = it.g; }
      const r = el(`<div class="it ${i===sel?"sel":""}">${icon(it.ic)}<div style="flex:1;min-width:0"><div style="font-weight:600">${esc(it.t)}</div>${it.s?`<div class="tiny faint">${esc(it.s)}</div>`:""}</div></div>`);
      r.addEventListener("click", it.go); res.appendChild(r);
    });
  }
  input.addEventListener("input", ()=>{ sel=0; draw(); });
  input.addEventListener("keydown", e=>{
    if (e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(sel+1, items.length-1); draw(); }
    if (e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(sel-1, 0); draw(); }
    if (e.key==="Enter" && items[sel]) items[sel].go();
  });
  draw(); setTimeout(()=>input.focus(), 20);
}

/* ------------------------------ SHARED WIDGETS ------------------------------ */
function statusPill(s){ const st = STATUS[s]||{label:s, c:"slate"}; return `<span class="pill ${st.c}">${esc(st.label)}</span>`; }
function prioPill(p){ return `<span class="pill nodot ${PRIO_C[p]||"slate"}">${esc(cap(p))}</span>`; }
function kpi(label, num, ic, foot, alert){ return `<div class="card kpi ${alert?"alert":""}"><div class="lbl">${icon(ic,"sm")} ${esc(label)}</div><div class="num">${esc(num)}</div>${foot?`<div class="foot">${esc(foot)}</div>`:""}</div>`; }
function jobCard(j){
  const c = customerById(j.customerId), t = userById(j.technicianId), n = jobUnseen(j.id);
  const hz = openHazards(h=>h.jobId===j.id || (j.equipmentId && h.equipmentId===j.equipmentId)).length;
  const card = el(`<div class="jobcard prio-${esc(j.priority)}" tabindex="0" role="button">
    <div class="t1"><span class="ref">${esc(j.refNumber)}</span><span class="row">${n?`<span class="count" title="New activity">${n} new</span>`:""}${statusPill(j.status)}</span></div>
    <div><div class="cust">${esc(c?.name||"No customer")}</div><div class="addr">${icon("pin","sm")}<span>${esc(j.siteAddress||"")}</span></div></div>
    <div class="row wrap">${prioPill(j.priority)}<span class="pill nodot slate">${esc(cap(j.jobType))}</span>${isLate(j)?`<span class="pill bad">Late</span>`:""}${hz?`<span class="pill bad">${icon("tag","sm")} Red tag</span>`:""}</div>
    <div class="t3"><span class="row small dim">${icon("clock","sm")} ${esc(fmtDate(j.scheduledAt))}</span><span class="row small">${t?avatar(t,"sm")+`<span class="dim">${esc(t.name.split(" ")[0])}</span>`:`<span class="pill warn">Unassigned</span>`}</span></div>
  </div>`);
  card.addEventListener("click", ()=>openJob(j.id));
  card.addEventListener("keydown", e=>{ if (e.key==="Enter") openJob(j.id); });
  return card;
}
function jobGrid(list, emptyMsg){
  if (!list.length) return el(`<div class="card">${emptyState("wrench", emptyMsg||"No jobs.")}</div>`);
  const g = el(`<div class="jobgrid"></div>`); list.forEach(j=>g.appendChild(jobCard(j))); return g;
}
function jobTable(list, emptyMsg){
  if (!list.length) return el(`<div class="card">${emptyState("wrench", emptyMsg||"No jobs.")}</div>`);
  const t = el(`<div class="card pad0"><div class="tablewrap"><table><thead><tr><th>Ref</th><th>When</th><th>Customer</th><th>Technician</th><th>Type</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>`);
  list.forEach(j=>{
    const tr = el(`<tr class="click"><td class="mono">${esc(j.refNumber)}</td><td>${esc(fmtDate(j.scheduledAt))}</td><td>${esc(customerById(j.customerId)?.name||"—")}</td><td>${esc(userById(j.technicianId)?.name||"Unassigned")}</td><td>${esc(cap(j.jobType))}</td><td>${statusPill(j.status)}</td></tr>`);
    tr.addEventListener("click", ()=>openJob(j.id)); $("tbody", t).appendChild(tr);
  });
  return t;
}
const byTime = (a,b)=> ts(a.scheduledAt)-ts(b.scheduledAt);
const byTimeDesc = (a,b)=> ts(b.scheduledAt)-ts(a.scheduledAt);

<script>

      go:()=>h.jobId?openJob(h.jobId,"safety"):openEquipment(h.equipmentId)});
  });
  activeUsers().forEach(u=> (u.credentials||[]).forEach(c=>{
    if (!c.expires) return; const d = Math.ceil((ts(c.expires)-Date.now())/DAY);
    if (d<=60) out.push({c:d<0?"bad":"warn", ic:"shield", t:`${u.name}: ${c.name} ${d<0?"expired":"expires in "+d+" day(s)"}`, s:"Renew before assigning work that needs this licence.", go:()=>go("users")});
  }));
  S.jobs.filter(j=>!isClosed(j) && isLate(j)).forEach(j=> out.push({c:"warn", ic:"clock", t:`${j.refNumber} is running late`, s:`Scheduled ${fmtDate(j.scheduledAt)} · ${userById(j.technicianId)?.name||"unassigned"}`, go:()=>openJob(j.id)}));
  S.jobs.filter(j=>!isClosed(j) && !j.technicianId).forEach(j=> out.push({c:"warn", ic:"user", t:`${j.refNumber} has no technician`, s:`${customerById(j.customerId)?.name||""} · ${fmtDate(j.scheduledAt)}`, go:()=>openJob(j.id)}));
  const due = S.equipment.filter(e=>maintenanceDue(e)?.overdue);
  if (due.length) out.push({c:"info", ic:"box", t:`${due.length} unit(s) are due for yearly maintenance`, s:"Last service was over 12 months ago.", go:()=>{ S.ui.eqQ=""; S.ui.eqDue=true; go("equipment"); }});
  return out;
}
function activityFeed(){
  const f = [];
  S.jobs.forEach(j=>{
    const s = sub(j.id);
    s.events.forEach(e=> f.push(Object.assign({kind:"event", job:j}, e)));
    s.notes.forEach(n=> f.push({kind:"note", job:j, at:n.at, by:n.by, text:n.text}));
    s.media.forEach(m=> f.push({kind:"media", job:j, at:m.at, by:m.by, text:m.category||"Photo"}));
  });
  return f.sort((a,b)=>ts(b.at)-ts(a.at));
}

/* ------------------------------ DISPATCH ------------------------------ */
function renderDispatch(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="pagehead"><div><h1>Dispatch</h1><div class="sub">Every open job, by stage. Closed jobs move to the Archive.</div></div>
    <div class="row wrap"><div class="seg"><button data-m="board" class="${S.ui.boardMode==="board"?"active":""}">${icon("board","sm")} Board</button><button data-m="days" class="${S.ui.boardMode==="days"?"active":""}">${icon("calendar","sm")} By day</button><button data-m="list" class="${S.ui.boardMode==="list"?"active":""}">${icon("list","sm")} List</button></div>
    ${can.createJob()?`<button class="btn primary" id="nj">${icon("plus","sm")} New job</button>`:""}</div></div>`));
  $$("[data-m]", wrap).forEach(b=>b.addEventListener("click", ()=>{ S.ui.boardMode=b.dataset.m; render(); }));
  $("#nj", wrap)?.addEventListener("click", ()=>openJobForm());
  const open = S.jobs.filter(j=>!isClosed(j)).sort(byTime);
  if (S.ui.boardMode==="board"){
    const board = el(`<div class="board"></div>`);
    STATUSES.slice(0,5).forEach(s=>{
      const list = open.filter(j=>j.status===s);
      const col = el(`<div class="col"><div class="colh"><span>${esc(STATUS[s].label)}</span><span class="pill nodot slate">${list.length}</span></div></div>`);
      if (!list.length) col.appendChild(el(`<div class="hint" style="padding:6px">Nothing here.</div>`));
      list.forEach(j=>col.appendChild(jobCard(j)));
      board.appendChild(col);
    });
    board.style.gridTemplateColumns = "repeat(5,minmax(230px,1fr))";
    wrap.appendChild(board);
  } else if (S.ui.boardMode==="days"){
    const days = {}; open.forEach(j=>{ const k = new Date(j.scheduledAt).toDateString(); (days[k]=days[k]||[]).push(j); });
    if (!open.length) wrap.appendChild(el(`<div class="card">${emptyState("calendar","Nothing scheduled.")}</div>`));
    Object.entries(days).forEach(([k,list])=>{ wrap.appendChild(el(`<h3 class="mt" style="margin-bottom:10px">${esc(fmtDay(new Date(k).toISOString()))} <span class="faint small">${list.length} job(s)</span></h3>`)); wrap.appendChild(jobGrid(list)); });
  } else wrap.appendChild(jobTable(open, "No open jobs."));
  return wrap;
}

/* ------------------------------ REVIEW & HELP ------------------------------ */
function renderReview(){
  const wrap = el(`<div><div class="pagehead"><div><h1>Review queue</h1><div class="sub">Jobs the crew submitted as finished. Approve to close and archive, or send back with a reason.</div></div></div></div>`);
  const list = S.jobs.filter(j=>j.status==="completion_review").sort(byTime);
  if (!list.length){ wrap.appendChild(el(`<div class="card">${emptyState("checkcircle","Nothing waiting for review.")}</div>`)); return wrap; }
  const g = el(`<div class="stack"></div>`);
  list.forEach(j=>{
    const items = completionItems(j); const done = items.filter(i=>i.ok).length; const s = sub(j.id);
    const c = el(`<div class="card"><div class="row between wrap top"><div><div class="row"><span class="mono" style="font-weight:600">${esc(j.refNumber)}</span>${prioPill(j.priority)}</div>
      <div style="font-weight:750;font-size:16px;margin-top:3px">${esc(customerById(j.customerId)?.name||"")}</div><div class="hint">${esc(j.siteAddress)} · ${esc(cap(j.jobType))} · ${esc(userById(j.technicianId)?.name||"")}</div></div>
      <div class="ring" style="--p:${Math.round(done/items.length*100)}"><span>${done}/${items.length}</span></div></div>
      <div class="row wrap small dim mt">${icon("pencil","sm")} ${s.notes.length} note(s) · ${icon("image","sm")} ${s.media.length} photo(s) · ${icon("gauge","sm")} ${Object.keys(j.readings||{}).length + s.extractions.length} reading(s) · ${icon("receipt","sm")} ${s.materials.length} expense(s)</div>
      <div class="actionbar mt"><button class="btn" data-open>${icon("eye","sm")} Open job</button><button class="btn go" data-ok>${icon("check","sm")} Approve &amp; close</button><button class="btn danger" data-back>${icon("undo","sm")} Send back</button></div></div>`);
    $("[data-open]", c).addEventListener("click", ()=>openJob(j.id, "completion"));
    $("[data-ok]", c).addEventListener("click", ()=>approveJob(j));
    $("[data-back]", c).addEventListener("click", ()=>sendBackJob(j));
    g.appendChild(c);
  });
  wrap.appendChild(g); return wrap;
}
function helpCard(h){
  const c = el(`<div class="card" style="margin-bottom:10px"><div class="row between"><span class="mono" style="font-weight:600">${esc(h.job.refNumber)}</span><span class="pill ${h.status==="resolved"?"ok":"warn"}">${h.status==="resolved"?"Answered":"Open"}</span></div>
    <div class="hint">${esc(h.by)} · ${esc(ago(h.at))}</div><p style="margin-top:6px">${esc(h.message)}</p>
    ${h.response?`<div class="note mt"><div class="meta">${esc(h.resolvedBy||"Supervisor")} answered</div>${esc(h.response)}</div>`:""}
    <div class="actionbar mt"></div></div>`);
  const ab = $(".actionbar", c);
  const o = el(`<button class="btn sm">${icon("eye","sm")} Open job</button>`); o.addEventListener("click", ()=>openJob(h.job.id)); ab.appendChild(o);
  if (h.status!=="resolved" && ["owner","supervisor"].includes(S.role)){ const b = el(`<button class="btn primary sm">${icon("send","sm")} Answer</button>`); b.addEventListener("click", ()=>answerHelp(h.job, h)); ab.appendChild(b); }
  return c;
}
function renderHelp(){
  const wrap = el(`<div><div class="pagehead"><div><h1>Help requests</h1><div class="sub">Questions from the crew while on a job.</div></div></div></div>`);
  const all = S.jobs.flatMap(j=>sub(j.id).help.map(h=>Object.assign({job:j},h))).sort((a,b)=>ts(b.at)-ts(a.at));
  const open = all.filter(h=>h.status!=="resolved"), done = all.filter(h=>h.status==="resolved");
  if (!all.length){ wrap.appendChild(el(`<div class="card">${emptyState("lifebuoy","No help requests yet.")}</div>`)); return wrap; }
  wrap.appendChild(el(`<h3 style="margin-bottom:10px">Open (${open.length})</h3>`));
  if (!open.length) wrap.appendChild(el(`<div class="card">${emptyState("checkcircle","All answered.")}</div>`));
  open.forEach(h=>wrap.appendChild(helpCard(h)));
  if (done.length){ wrap.appendChild(el(`<h3 class="mt2" style="margin-bottom:10px">Answered</h3>`)); done.slice(0,10).forEach(h=>wrap.appendChild(helpCard(h))); }
  return wrap;
}
function answerHelp(job, h){
  const b = el(`<form>${modalHead("Answer help request", job.refNumber)}<div class="note"><div class="meta">${esc(h.by)} asked</div>${esc(h.message)}</div>
    <div class="field mt"><label>Your answer *</label><textarea name="r" required></textarea></div>
    <div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${icon("send","sm")} Send answer</button></div></form>`);
  showModal(b);
  b.addEventListener("submit", async e=>{
    e.preventDefault();
    const patch = {status:"resolved", response:b.r.value.trim(), resolvedBy:me()?.name||"Supervisor", resolvedAt:now()};
    await writeDoc("jobs/"+job.id+"/help/"+h.id, patch, true);
    Object.assign(sub(job.id).help.find(x=>x.id===h.id)||{}, patch);
    const asker = S.users.find(u=>u.id===h.byId || u.name===h.by);
    await notify(`${patch.resolvedBy} answered your help request on ${job.refNumber}.`, asker?{toUser:asker.id, jobId:job.id}:{toRole:"technician", jobId:job.id});
    closeOverlay(); toast("Answer sent."); render();
  });
}

<script>
/* ------------------------------ JOB DETAIL ------------------------------ */
function renderJob(id){
  const j = jobById(id);
  if (!j){ S.view.jobId = null; return renderDashboard(); }
  if (isField() && j.technicianId!==S.userId){
    return el(`<div class="card">${emptyState("lock","This job is assigned to another technician.")}</div>`);
  }
  const c = customerById(j.customerId), t = userById(j.technicianId), e = equipmentById(j.equipmentId), s = sub(id);
  const closed = isClosed(j);
  const wrap = el(`<div></div>`);
  const head = el(`<div class="card">
    <div class="row between wrap top">
      <div style="min-width:0">
        <div class="row wrap"><span class="mono" style="font-weight:600;font-size:15px">${esc(j.refNumber)}</span>${statusPill(j.status)}${prioPill(j.priority)}<span class="pill nodot slate">${esc(cap(j.jobType))}</span>${isLate(j)?`<span class="pill bad">Late</span>`:""}</div>
        <h1 style="margin-top:8px">${esc(c?.name||"No customer")}</h1>
        <div class="row wrap dim" style="margin-top:4px">${icon("pin","sm")}<a href="${esc(mapsUrl(j.siteAddress))}" target="_blank" rel="noopener">${esc(j.siteAddress)}</a>${c?.phone && S.role!=="accountant"?`<span class="faint">·</span>${icon("phone","sm")}<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:""}</div>
      </div>
      <div class="row wrap" id="headActions"></div>
    </div>
    <div class="kv mt">
      <div><div class="k">Scheduled</div><div class="v">${esc(fmtDate(j.scheduledAt))}</div></div>
      <div><div class="k">Technician</div><div class="v row">${t?avatar(t,"sm")+esc(t.name):`<span class="pill warn">Unassigned</span>`}</div></div>
      <div><div class="k">Trade</div><div class="v">${esc(THEMES[j.requiredTrade]?.label||j.requiredTrade||"—")}</div></div>
      <div><div class="k">Equipment</div><div class="v">${e?`<a href="#" id="eqLink">${esc(equipmentLabel(e))}</a>`:`<span class="faint">Not linked</span>`}</div></div>
    </div>
    <div class="steps">${STATUSES.map((st,i)=>{ const idx = STATUSES.indexOf(j.status); return `<div class="s ${i<idx||closed?"done":i===idx?"cur":""}"><div class="bar"></div><div class="lb">${esc(STATUS[st].label)}</div></div>`; }).join("")}</div>
  </div>`);
  $("#eqLink", head)?.addEventListener("click", ev=>{ ev.preventDefault(); openEquipment(e.id); });
  const ha = $("#headActions", head);
  if (can.editJob() && !closed){ const b = el(`<button class="btn sm">${icon("pencil","sm")} Edit</button>`); b.addEventListener("click", ()=>openJobForm(j)); ha.appendChild(b); }
  wrap.appendChild(head);

  if (closed) wrap.appendChild(el(`<div class="lock">${icon("lock")}<span><b>Closed and read-only.</b> Approved by ${esc(j.review?.by||"supervisor")}${j.closedAt?" on "+esc(fmtDateOnly(j.closedAt)):""}. Nothing can be added or changed. Everything in this job stays private to the trade team.</span></div>`));
  if (!closed && j.review?.decision==="sent_back" && j.status==="working") wrap.appendChild(el(`<div class="callout bad mt">${icon("undo")}<div><b>Sent back by ${esc(j.review.by)} · ${esc(ago(j.review.at))}</b><div>${esc(j.review.reason||"")}</div></div></div>`));
  const hz = openHazards(h=>h.jobId===j.id || (j.equipmentId && h.equipmentId===j.equipmentId));
  if (hz.length) wrap.appendChild(el(`<div class="callout bad mt">${icon("tag")}<div><b>Red-tagged equipment on this job.</b> ${esc(hz[0].description||"")} — see the Safety tab.</div></div>`));

  // primary action bar
  const bar = el(`<div class="actionbar mt mobile-sticky"></div>`);
  if (can.advance(j)){
    const label = STATUS[j.status].next;
    const b = el(`<button class="btn ${j.status==="working"?"primary":"go"} lg">${icon(j.status==="working"?"send":"chev")} ${esc(label)}</button>`);
    b.addEventListener("click", ()=>advanceJob(j)); bar.appendChild(b);
  }
  if (can.approve(j)){
    const a = el(`<button class="btn go lg">${icon("check")} Approve &amp; close</button>`); a.addEventListener("click", ()=>approveJob(j));
    const r = el(`<button class="btn danger lg">${icon("undo")} Send back</button>`); r.addEventListener("click", ()=>sendBackJob(j));
    bar.append(a, r);
  }
  if (!closed && j.status==="completion_review" && !can.approve(j)) bar.appendChild(el(`<span class="pill info">Waiting for a supervisor to review</span>`));
  if (!closed && isField() && j.technicianId===S.userId){ const h = el(`<button class="btn lg">${icon("lifebuoy")} Ask supervisor</button>`); h.addEventListener("click", ()=>openHelpForm(j)); bar.appendChild(h); }
  if (bar.children.length) wrap.appendChild(bar);

  const leakOn = !!S.config.modules.leakTest;
  const tabs = [["overview","Overview","home"],["readings","Readings","gauge","extractions"],["notes","Notes","pencil","notes"],["media","Photos","image","media"]]
    .concat(leakOn?[["leak","Leak test","droplet"]]:[])
    .concat([["materials","Materials","receipt","materials"],["safety","Safety","tag"],["completion","Checklist","clipboard"],["timeline","Timeline","history"]]);
  if (!tabs.some(t=>t[0]===S.view.jobTab)) S.view.jobTab = "overview";
  const tb = el(`<div class="tabs" role="tablist"></div>`);
  tabs.forEach(([k,label,ic,sec])=>{
    const n = sec ? sectionUnseen(id, sec).length : 0;
    const extra = k==="safety" && hz.length ? `<span class="count">!</span>` : "";
    const b = el(`<button role="tab" class="${S.view.jobTab===k?"active":""}">${icon(ic,"sm")} ${esc(label)}${n?`<span class="count">${n}</span>`:""}${extra}</button>`);
    b.addEventListener("click", ()=>{ S.view.jobTab = k; if (sec) markSeen(id, sec); renderMain(); renderSide(); renderTabbar(); });
    tb.appendChild(b);
  });
  wrap.appendChild(tb);
  const sec = (tabs.find(t=>t[0]===S.view.jobTab)||[])[3];
  if (sec) markSeen(id, sec);
  const R = {overview:jobOverview, readings:jobReadings, notes:jobNotes, media:jobMedia, leak:jobLeak, materials:jobMaterials, safety:jobSafety, completion:jobChecklist, timeline:jobTimeline};
  wrap.appendChild((R[S.view.jobTab]||jobOverview)(j, s));
  return wrap;
}
function equipmentLabel(e){ return e ? `${e.manufacturer||""} ${e.model||""}`.trim() + (e.type?` (${e.type})`:"") : "—"; }

function jobOverview(j, s){
  const g = el(`<div class="grid g-main"><div class="stack" id="l"></div><div class="stack" id="r"></div></div>`);
  const items = completionItems(j); const done = items.filter(i=>i.ok).length;
  const prog = el(`<div class="card"><div class="row" style="gap:14px"><div class="ring" style="--p:${Math.round(done/items.length*100)}"><span>${done}/${items.length}</span></div><div style="flex:1"><h3>Closing checklist</h3><div class="hint">${done===items.length?"Everything needed to close is in.":"Still needed: "+items.filter(i=>!i.ok).map(i=>i.label).join(", ")+"."}</div></div><button class="btn sm" id="ck">View</button></div></div>`);
  $("#ck", prog).addEventListener("click", ()=>{ S.view.jobTab="completion"; renderMain(); });
  $("#l", g).appendChild(prog);
  const notes = el(`<div class="card"><div class="card-h"><h3>Latest notes</h3><button class="btn sm ghost" id="an">All notes ${icon("chev","sm")}</button></div><div class="stack tight" id="nl"></div></div>`);
  $("#an", notes).addEventListener("click", ()=>{ S.view.jobTab="notes"; renderMain(); });
  if (!s.notes.length) $("#nl", notes).innerHTML = `<div class="hint">No notes yet.</div>`;
  s.notes.slice(0,3).forEach(n=> $("#nl", notes).appendChild(el(`<div class="note"><div class="meta">${esc(n.by)} · ${esc(ago(n.at))}</div>${esc(n.text)}</div>`)));
  $("#l", g).appendChild(notes);
  if (s.media.length){
    const ph = el(`<div class="card"><div class="card-h"><h3>Photos</h3><span class="hint">${s.media.length}</span></div><div class="thumbs"></div></div>`);
    s.media.slice(0,4).forEach(m=> $(".thumbs", ph).appendChild(thumb(m)));
    $("#l", g).appendChild(ph);
  }
  const help = el(`<div class="card"><div class="card-h"><h3>Supervisor help</h3></div><div class="stack tight" id="hl"></div></div>`);

  s.help.forEach(h=>{
    const n = el(`<div class="note"><div class="meta">${esc(h.by)} asked · ${esc(ago(h.at))}</div>${esc(h.message)}${h.response?`<div class="callout ok" style="margin-top:8px">${icon("lifebuoy","sm")}<div><b>${esc(h.resolvedBy||"Supervisor")}:</b> ${esc(h.response)}</div></div>`:`<div class="mt"><span class="pill warn">Waiting for an answer</span></div>`}</div>`);
    if (h.status!=="resolved" && ["owner","supervisor"].includes(S.role) && !isClosed(j)){ const b = el(`<button class="btn sm primary" style="margin-top:8px">Answer</button>`); b.addEventListener("click", ()=>answerHelp(j,h)); n.appendChild(b); }
    $("#hl", help).appendChild(n);
  });
  $("#r", g).appendChild(help);
  if (S.config.modules.leakTest) $("#r", g).appendChild(el(`<div class="card"><div class="card-h"><h3>Leak test</h3></div>${leakChip(j)}</div>`));
  const e = equipmentById(j.equipmentId);
  if (e){ const ec = el(`<div class="card"><div class="card-h"><h3>Equipment</h3><button class="btn sm ghost">Passport ${icon("chev","sm")}</button></div><div style="font-weight:700">${esc(equipmentLabel(e))}</div><div class="hint mono">S/N ${esc(e.serial||"—")}</div><div class="hint">${esc(equipmentAge(e))}</div></div>`); $("button", ec).addEventListener("click", ()=>openEquipment(e.id)); $("#r", g).appendChild(ec); }
  else if (can.editJob() && !isClosed(j)){ const ec = el(`<div class="card"><div class="card-h"><h3>Equipment</h3></div><div class="hint">No equipment linked. Linking builds the unit's service history.</div><button class="btn sm mt">${icon("plus","sm")} Link equipment</button></div>`); $("button", ec).addEventListener("click", ()=>openJobForm(j)); $("#r", g).appendChild(ec); }
  return g;

/* ---- status flow ---- */
async function advanceJob(j){
  const idx = STATUSES.indexOf(j.status); const next = STATUSES[idx+1];
  if (!next || next==="completed") return;
  if (next==="completion_review"){
    const missing = completionItems(j).filter(i=>!i.ok);
    if (missing.length){ toast("Before submitting, add: "+missing.map(m=>m.label).join(", ")+".", "bad"); S.view.jobTab="completion"; render(); return; }
  }
  const patch = {status:next}; if (next==="completion_review") patch.submittedAt = now();
  if (next==="arrived") patch.arrivedAt = now();
  await writeDoc("jobs/"+j.id, patch, true); Object.assign(j, patch);
  await logEvent(j.id, "status", {status:next});
  if (next==="completion_review") await notify(`${me()?.name||"Technician"} submitted ${j.refNumber} for review.`, {toRole:"managers", jobId:j.id});
  if (next==="en_route") await notify(`${me()?.name||"Technician"} is on the way to ${j.refNumber}.`, {toRole:"dispatcher", jobId:j.id});
  toast(next==="completion_review" ? "Submitted for supervisor review." : `Status: ${STATUS[next].label}.`);
  render();
}
async function approveJob(j){
  const missing = completionItems(j).filter(i=>!i.ok);
  if (missing.length && !(await confirmBox("Close with items missing?", "Still missing: "+missing.map(m=>m.label).join(", ")+". Close anyway?", "Close anyway"))) return;
  const patch = {status:"completed", closedAt:now(), review:{decision:"approved", by:me()?.name||"Supervisor", at:now()}};
  await writeDoc("jobs/"+j.id, patch, true); Object.assign(j, patch);
  await logEvent(j.id, "status", {status:"completed", note:"Approved and closed"});
  if (j.technicianId) await notify(`${patch.review.by} approved ${j.refNumber}. It's closed and in the archive.`, {toUser:j.technicianId, jobId:j.id});
  toast(`${j.refNumber} closed and moved to the Archive.`); render();
}
function sendBackJob(j){
  const b = el(`<form>${modalHead("Send back to technician", j.refNumber)}<div class="field"><label>What needs fixing? *</label><textarea name="r" required placeholder="e.g. Add a photo of the vent termination and the manifold reading."></textarea></div>
    <div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn danger solid">${icon("undo","sm")} Send back</button></div></form>`);
  showModal(b);
  b.addEventListener("submit", async e=>{
    e.preventDefault();
    const patch = {status:"working", review:{decision:"sent_back", reason:b.r.value.trim(), by:me()?.name||"Supervisor", at:now()}, sendBacks:(j.sendBacks||0)+1};
    await writeDoc("jobs/"+j.id, patch, true); Object.assign(j, patch);
    await logEvent(j.id, "sent_back", {status:"working", note:patch.review.reason});
    if (j.technicianId) await notify(`${patch.review.by} sent ${j.refNumber} back: ${patch.review.reason}`, {toUser:j.technicianId, jobId:j.id});
    closeOverlay(); toast("Sent back to the technician."); render();
  });
}

/* ---- create / edit job ---- */
function nextRef(){
  const nums = S.jobs.map(j=>parseInt(String(j.refNumber||"").replace(/\D/g,""),10)).filter(n=>!isNaN(n));
  return "JOB-"+(Math.max(1000, ...nums)+1);
}
function techWarnings(techId, whenIso, trade, excludeId){
  const out = []; const u = userById(techId); if (!u) return out;
  const t = ts(whenIso);
  const clash = S.jobs.find(x=>x.id!==excludeId && x.technicianId===techId && !isClosed(x) && Math.abs(ts(x.scheduledAt)-t) < 90*60000);
  if (clash) out.push(`${u.name} already has ${clash.refNumber} within 90 minutes of this time.`);
  if (trade && u.trade && u.trade!==trade) out.push(`${u.name}'s trade is ${THEMES[u.trade]?.label||u.trade}, not ${THEMES[trade]?.label||trade}. Confirm they hold the right licence.`);
  if (THEMES[trade]?.gas && !(u.credentials||[]).some(c=>/G1|G2|G3|gas/i.test(c.name))) out.push(`${u.name} has no gas licence on file (G3/G2/G1).`);

  if (u.role==="apprentice") out.push(`${u.name} is an apprentice — make sure a supervisor is available.`);
  return out;
}

      if (target) await notify(`${rec.by} added a note on ${j.refNumber}.`, target);
      toast("Note added."); renderMain();
    });

function setupDictation(btn, ta){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ btn.disabled = true; btn.title = "Dictation isn't supported in this browser."; return; }
  let rec = null, on = false;
  btn.addEventListener("click", ()=>{
    if (on){ rec && rec.stop(); return; }
    try{
      rec = new SR(); rec.lang = navigator.language || "en-CA"; rec.interimResults = true; rec.continuous = true;
      const base = ta.value ? ta.value.trim()+" " : "";
      rec.onresult = ev=>{ let t = ""; for (const r of ev.results) t += r[0].transcript; ta.value = base + t; };
      rec.onerror = ev=>{ toast(ev.error==="not-allowed"?"Microphone access was blocked.":"Dictation stopped.","bad"); };
      rec.onend = ()=>{ on=false; btn.innerHTML = icon("mic","sm")+" Dictate"; btn.classList.remove("danger"); };
      rec.start(); on = true; btn.innerHTML = icon("mic","sm")+" Listening… tap to stop"; btn.classList.add("danger");
    }catch(e){ toast("Dictation couldn't start.","bad"); }
  });
}

function leakChip(j){

  if (lt.status==="skipped") return `<div class="callout" style="--c:var(--slate)">${icon("droplet")}<div><b>Skipped</b>${lt.reason?` — ${esc(lt.reason)}`:""}<div class="tiny faint">${esc(lt.by||"")} · ${esc(fmtDate(lt.at))}</div></div></div>`;
  return `<div class="callout ${leakRelevant(j)?"warn":""}">${icon("droplet")}<div><b>Not recorded yet</b><div class="hint">${leakRelevant(j)?"Recommended for this job (gas work or new installation).":"Optional for this job — record it or skip it."}</div></div></div>`;
}
function jobLeak(j){
  const editable = can.fieldWork(j); const lt = j.leakTest||{status:"not_set"};
  const wrap = el(`<div class="card"><div class="card-h"><div><h3>Leak test</h3><div class="hint">Record it or skip it with a reason. Either way the job can move on.</div></div></div>${leakChip(j)}<div class="actionbar mt" id="a"></div></div>`);
  const a = $("#a", wrap);
  if (editable && lt.status==="not_set"){
    const c = el(`<button class="btn primary">${icon("droplet","sm")} Record leak test</button>`); c.addEventListener("click", ()=>leakForm(j));
    const s = el(`<button class="btn">Skip</button>`); s.addEventListener("click", ()=>leakSkip(j));
    a.append(c, s);
  } else if (editable){
    const r = el(`<button class="btn sm">${icon("undo","sm")} Change</button>`);
    r.addEventListener("click", async ()=>{ j.leakTest={status:"not_set"}; await writeDoc("jobs/"+j.id, {leakTest:j.leakTest}, true); renderMain(); });
    a.appendChild(r);
  }
  return wrap;
}
function leakForm(j){
  const b = el(`<form>${modalHead("Record leak test", j.refNumber)}

    <div class="field mt"><label>Method</label><select name="method"><option>Soap / bubble solution</option><option>Electronic gas detector</option><option>Pressure hold (manometer)</option><option>Nitrogen pressure test</option><option>Other</option></select></div>

    e.preventDefault();

    await writeDoc("jobs/"+j.id, {leakTest:lt}, true); j.leakTest = lt;

function leakSkip(j){
  const b = el(`<form>${modalHead("Skip leak test", j.refNumber)}<div class="field"><label>Reason${leakRelevant(j)?" *":""}</label><input name="reason" ${leakRelevant(j)?"required":""} placeholder="e.g. No gas connections touched"></div>
    <div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Skip</button></div></form>`);
  showModal(b);
  b.addEventListener("submit", async e=>{
    e.preventDefault();
    const lt = {status:"skipped", reason:b.reason.value.trim(), at:now(), by:me()?.name||""};

/* ---- safety / red tag ---- */
function jobSafety(j){

/* ---- completion checklist ---- */
function completionItems(j){
  const s = sub(j.id), items = [];
  items.push({label:"a work note", ok:s.notes.length>0, tab:"notes", hint:"What you found and what you did."});
  items.push({label:"at least one photo", ok:s.media.length>0, tab:"media", hint:"Before / after or the nameplate."});
  if (S.config.modules.leakTest) items.push({label:"leak test recorded or skipped", ok:["completed","skipped"].includes(j.leakTest?.status), tab:"leak", hint:leakRelevant(j)?"Recommended for this job.":"Optional — record or skip."});
  const def = readingDef(j); const req = def.checks.filter(c=>c[2]);
  req.forEach(([k,label])=> items.push({label:label.charAt(0).toLowerCase()+label.slice(1), ok:!!(j.readings||{})[k], tab:"readings", hint:"Confirm it in Readings."}));
  const hz = S.hazards.filter(h=>h.jobId===j.id && h.status!=="resolved");
  if (hz.length) items.push({label:"red tag: distributor notice time recorded", ok:hz.every(h=>h.distributorNotifiedAt), tab:"safety", hint:"Record when the gas distributor was told."});
  items.push({label:"help requests answered", ok:s.help.every(h=>h.status==="resolved"), tab:"overview", hint:"Wait for the supervisor's answer."});
  return items;
}
function jobChecklist(j){

    <div class="stack tight mt" id="l"></div></div>`);

/* ---- timeline ---- */
function timelineItem(f){
  const map = {status:["chev","info"], created:["plus","info"], edited:["pencil","slate"], sent_back:["undo","bad"], readings:["gauge","violet"], leak:["droplet","info"], hazard:["tag","bad"], note:["pencil","slate"], media:["image","violet"], material:["receipt","warn"], help:["lifebuoy","warn"], answer:["lifebuoy","ok"], reading:["gauge","violet"]};
  let kind = f.kind==="event" ? (f.type || (f.status?"status":"edited")) : f.kind;
  let text = f.text || "";
  if (f.kind==="event"){
    if (kind==="status") text = f.status==="completed" ? "Approved and closed" : `Status → ${STATUS[f.status]?.label||f.status}`;
    else if (kind==="created") text = "Job created" + (f.note?` · ${f.note}`:"");
    else if (kind==="sent_back") text = "Sent back: "+(f.note||"");
    else text = f.note || cap(kind);
    if (kind==="status" && f.note && f.status!=="completed") text += ` · ${f.note}`;
  }
  const [ic, c] = map[kind] || ["clock","slate"];
  return el(`<div class="ev" style="--c:var(--${c})"><div class="dot">${icon(ic)}</div><div>${f.job?`<span class="mono small">${esc(f.job.refNumber)}</span> · `:""}${esc(text)}</div><div class="meta">${esc(f.by||"")} · ${esc(fmtDate(f.at))}</div></div>`);
}
function jobTimeline(j, s){
  const f = [];
  s.events.forEach(e=>f.push(Object.assign({kind:"event"}, e)));
  s.notes.forEach(n=>f.push({kind:"note", at:n.at, by:n.by, text:"Note: "+n.text}));
  s.media.forEach(m=>f.push({kind:"media", at:m.at, by:m.by, text:`${m.category||"Photo"} added${m.caption?" — "+m.caption:""}`}));
  s.extractions.forEach(x=>f.push({kind:"reading", at:x.at, by:x.confirmedBy, text:`Reading confirmed from photo: ${x.finalValue} ${x.unit} (${x.context})`}));
  s.materials.forEach(m=>f.push({kind:"material", at:m.at, by:m.by, text:`Expense: ${m.description} — ${money(lineTotal(m))}`}));
  s.help.forEach(h=>{ f.push({kind:"help", at:h.at, by:h.by, text:"Asked for help: "+h.message}); if (h.response) f.push({kind:"answer", at:h.resolvedAt||h.at, by:h.resolvedBy, text:"Answered: "+h.response}); });
  f.sort((a,b)=>ts(a.at)-ts(b.at));
  const wrap = el(`<div class="card"><div class="card-h"><div><h3>Timeline</h3><div class="hint">Everything that happened on this job, oldest first.</div></div></div></div>`);
  if (!f.length){ wrap.insertAdjacentHTML("beforeend", `<div class="hint">Nothing recorded yet.</div>`); return wrap; }
  const tl = el(`<div class="tl"></div>`); f.forEach(x=>tl.appendChild(timelineItem(x))); wrap.appendChild(tl);
  return wrap;
}

</script>
<script>
/* ------------------------------ EQUIPMENT ------------------------------ */
function equipmentAge(e){
  if (!e?.installDate) return "Install date unknown";
  const y = (Date.now()-ts(e.installDate))/(365.25*DAY);
  return y<1 ? "Installed less than a year ago" : `${Math.floor(y)} year${Math.floor(y)>1?"s":""} old · installed ${fmtDateOnly(e.installDate)}`;
}
function lastService(e){
  const done = S.jobs.filter(j=>j.equipmentId===e.id && isClosed(j)).sort((a,b)=>ts(b.closedAt||b.scheduledAt)-ts(a.closedAt||a.scheduledAt));
  return done[0]||null;
}
const MAINT_TYPES = /furnace|boiler|heat pump|air cond|a\/c|\bac\b|water heater|hrv|erv|fireplace|rooftop|unit heater/i;
function maintenanceDue(e){
  if (!MAINT_TYPES.test(e.type||"") && !/gas|propane|oil/i.test(e.fuel||"")) return null;
  const last = S.jobs.filter(j=>j.equipmentId===e.id && isClosed(j) && ["maintenance","inspection","installation"].includes(j.jobType)).sort((a,b)=>ts(b.closedAt||b.scheduledAt)-ts(a.closedAt||a.scheduledAt))[0];
  const base = last ? (last.closedAt||last.scheduledAt) : e.installDate;
  if (!base) return null;
  const due = ts(base)+365*DAY;
  return {due:new Date(due).toISOString(), overdue:due<Date.now(), basis:last?"last maintenance":"install date"};
}
function renderEquipment(){
  if (S.view.equipmentId) return renderEquipmentDetail(S.view.equipmentId);
  const wrap = el(`<div><div class="pagehead"><div><h1>Equipment passport</h1><div class="sub">Every unit you service, with its history, photos, red tags and QR status.</div></div>${S.role!=="accountant"?`<button class="btn primary" id="add">${icon("plus","sm")} Add equipment</button>`:""}</div>
    <div class="row wrap" style="margin-bottom:12px"><input class="in" id="q" placeholder="Search make, model, serial, customer…" value="${esc(S.ui.eqQ)}" style="max-width:360px"><label class="row small"><input type="checkbox" id="due" ${S.ui.eqDue?"checked":""}> Maintenance due only</label></div><div id="list"></div></div>`);
  $("#add", wrap)?.addEventListener("click", ()=>equipmentForm());
  const draw = ()=>{
    const q = S.ui.eqQ.trim().toLowerCase();

    if (isField()){ const mineCust = new Set(visibleJobs().map(j=>j.customerId)); list = list.filter(e=>mineCust.has(e.siteCustomerId)); }
    if (S.ui.eqDue) list = list.filter(e=>maintenanceDue(e)?.overdue);
    const box = $("#list", wrap); box.innerHTML = "";
    if (!list.length){ box.appendChild(el(`<div class="card">${emptyState("box", S.equipment.length?"No equipment matches.":"No equipment recorded yet.")}</div>`)); return; }
    const t = el(`<div class="card pad0"><div class="tablewrap"><table><thead><tr><th>Equipment</th><th>Serial</th><th>Customer</th><th>Age</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>`);
    list.forEach(e=>{
      const md = maintenanceDue(e); const hz = openHazards(h=>h.equipmentId===e.id).length;
      const tags = [hz?`<span class="pill bad">Red tag</span>`:"", md?.overdue?`<span class="pill warn">Maintenance due</span>`:"", e.qrStatus==="active"?`<span class="pill ok">QR active</span>`:""].join(" ") || `<span class="faint small">—</span>`;
      const tr = el(`<tr class="click"><td><b>${esc(e.manufacturer)} ${esc(e.model)}</b><div class="tiny faint">${esc(e.type||"")}${e.fuel?" · "+esc(e.fuel):""}</div></td><td class="mono">${esc(e.serial||"—")}</td><td>${esc(customerById(e.siteCustomerId)?.name||"—")}</td><td>${esc(e.installDate?Math.floor((Date.now()-ts(e.installDate))/(365.25*DAY))+" yr":"—")}</td><td>${tags}</td></tr>`);
      tr.addEventListener("click", ()=>openEquipment(e.id)); $("tbody", t).appendChild(tr);
    });

  draw(); return wrap;
}
function equipmentForm(e, presetCustomer){

/* ---- leak test ---- */
/* Leak result: only an explicit "Pass" counts as OK. Fail, Inconclusive or an unknown result is never shown as green. */
function leakResultKind(lt){
  if (!lt || lt.status!=="completed") return null;
  const r = String(lt.result||"");
  if (/^\s*pass/i.test(r)) return "pass";
  if (/fail/i.test(r)) return "fail";
  if (/inconclusive/i.test(r)) return "inconclusive";
  return "unknown";
}
/* The latest COMPLETED result across the current test and the history (history is kept in the order it was replaced).
   "Skipped" or "not recorded" never replaces a completed result — only a new completed result does. */
function effectiveLeak(j){
  const all = (Array.isArray(j.leakHistory) ? j.leakHistory : []).concat(j.leakTest ? [j.leakTest] : []);
  for (let i = all.length-1; i>=0; i--) if (all[i] && all[i].status==="completed") return all[i];
  return null;
}
/* true when the effective result is Fail / Inconclusive / unknown (anything but an explicit Pass). */
const leakNotPassed = j=>{ const k = leakResultKind(effectiveLeak(j)); return !!k && k!=="pass"; };
const LEAK_SKIP_BLOCKED = "A failed or inconclusive leak test needs a passing re-test or a red tag.";
/* Shows the effective result: a Fail / Inconclusive that was later "skipped" or cleared still shows as not OK.
   currentOnly: show just the current entry (the Leak tab shows the effective result in its own callout). */
function leakChip(j, currentOnly){
  const cur = j.leakTest||{status:"not_set"};
  const eff = currentOnly ? null : effectiveLeak(j);
  const useEff = !!eff && cur.status!=="completed" && leakResultKind(eff)!=="pass";
  const lt = useEff ? eff : cur;
  if (lt.status==="completed"){
    const k = leakResultKind(lt); const cls = k==="pass"?"ok":k==="fail"?"bad":"warn";
    const tagged = k!=="pass" && jobHazards(j).length>0;
    return `<div class="callout ${cls}">${icon(k==="pass"?"droplet":"alert")}<div><b>${esc(lt.result||"Result not recorded")}</b>${tagged?` <span class="pill bad">Appliance red-tagged</span>`:""}${k!=="pass"?`<div><b>Not OK —</b> ${k==="fail"?"a leak was found.":"the result needs a re-check."}</div>`:""}${useEff?`<div class="hint">Current entry: ${esc(leakSummary(cur))}. The last completed result still counts until a passing re-test is recorded.</div>`:""}<div class="hint">${esc(lt.method||"")}${lt.notes?" — "+esc(lt.notes):""}</div><div class="tiny faint">${esc(lt.by||"")} · ${esc(fmtDate(lt.at))}</div></div></div>`;
  }
  if (lt.status==="skipped") return `<div class="callout" style="--c:var(--slate)">${icon("droplet")}<div><b>Skipped</b>${lt.reason?` — ${esc(lt.reason)}`:""}<div class="tiny faint">${esc(lt.by||"")} · ${esc(fmtDate(lt.at))}</div></div></div>`;
  return `<div class="callout ${leakRelevant(j)?"warn":""}">${icon("droplet")}<div><b>Not recorded yet</b><div class="hint">${leakRelevant(j)?"Recommended for this job (gas work or new installation).":"Optional for this job — record it or skip it."}</div></div></div>`;
}
function leakSummary(lt){ return !lt || lt.status==="not_set" ? "not recorded" : lt.status==="skipped" ? `skipped (${lt.reason||"no reason"})` : (lt.result||"completed"); }
/* Build the patch that replaces the leak test and keeps the previous one in leakHistory. */
function leakPatch(j, next){
  const prev = j.leakTest;
  const hist = Array.isArray(j.leakHistory) ? j.leakHistory.slice() : [];
  if (prev && prev.status && prev.status!=="not_set") hist.push(Object.assign({}, prev, {replacedAt:now(), replacedBy:me()?.name||""}));
  return {leakTest:next, leakHistory:hist};
}
function jobLeak(j){
  /* Locked while in review or closed: a re-test has to be recorded before submitting. */
  const locked = !EDITABLE_READING_STATUSES.includes(j.status);
  const editable = can.fieldWork(j) && !locked; const lt = j.leakTest||{status:"not_set"};
  const skipBlocked = leakNotPassed(j) && !jobHazards(j).length;
  const eff = effectiveLeak(j);
  const hist = Array.isArray(j.leakHistory) ? j.leakHistory : [];
  const wrap = el(`<div class="card"><div class="card-h"><div><h3>Leak test</h3><div class="hint">Record it or skip it with a reason. A Fail or Inconclusive result stops the job from closing until a passing re-test is recorded or the appliance is red-tagged.</div></div></div>${leakChip(j, true)}
    ${lt.status!=="completed" && eff && leakNotPassed(j)?`<div class="callout bad mt">${icon("alert","sm")}<div><b>Last completed result: ${esc(eff.result||"not recorded")}</b> (${esc(fmtDate(eff.at))}). It still counts until a passing re-test is recorded${jobHazards(j).length?" — the appliance is red-tagged.":" or the appliance is red-tagged."}</div></div>`:""}
    ${locked && !isClosed(j)?`<div class="callout mt">${icon("lock","sm")}<div>The leak test is locked while the job is in review. A supervisor can send it back if a re-test is needed.</div></div>`:""}
    <div class="actionbar mt" id="a"></div>
    ${hist.length?`<h4 class="mt2" style="margin-bottom:6px">Earlier results</h4><div class="stack tight">${hist.slice().reverse().map(h=>`<div class="note"><div class="meta">${esc(h.by||"")} · ${esc(fmtDate(h.at))} · replaced ${esc(fmtDate(h.replacedAt))}${h.replacedBy?" by "+esc(h.replacedBy):""}</div>${esc(leakSummary(h))}${h.method?" · "+esc(h.method):""}${h.notes?" — "+esc(h.notes):""}</div>`).join("")}</div>`:""}</div>`);
  const a = $("#a", wrap);
  if (editable && lt.status==="not_set"){
    const c = el(`<button class="btn primary">${icon("droplet","sm")} Record leak test</button>`); c.addEventListener("click", ()=>leakForm(j));
    const s = el(`<button class="btn" ${skipBlocked?"disabled":""}>Skip</button>`); s.addEventListener("click", ()=>leakSkip(j));

function leakSkip(j){

/* Receipts open inside the app: photos in the lightbox, PDFs as a short-lived blob: URL. No data: links. */
function receiptKind(u){
  const s = String(u??"").trim();
  if (/^data:/i.test(s)) return /^data:image\//i.test(s) && safeUrl(s, "img") ? "img" : /^data:application\/pdf[;,]/i.test(s) ? "pdf" : null;
  return safeUrl(s, "href") ? "link" : null;
}
function dataUrlToBlob(u){
  const m = /^data:([^;,]*)((?:;[^;,]*)*?)(;base64)?,(.*)$/is.exec(String(u||""));
  if (!m) return null;
  try{
    const raw = m[3] ? atob(m[4]) : decodeURIComponent(m[4]);
    const a = new Uint8Array(raw.length); for (let i=0; i<raw.length; i++) a[i] = raw.charCodeAt(i) & 255;
    return new Blob([a], {type:m[1]||"application/octet-stream"});
  }catch(e){ console.error(e); return null; }
}
function openReceipt(m){
  const u = m.receiptUrl, k = receiptKind(u);
  const lb = ()=>openLightbox({url:u, category:"Receipt", caption:m.description, by:m.by, at:m.at, contentType:"image/*"});
  if (k==="img" || (k==="link" && /^image\//i.test(m.receiptType||""))) return lb();
  if (k==="pdf"){
    const blob = dataUrlToBlob(u); if (!blob){ toast("This receipt can't be opened.","bad"); return; }
    const b = URL.createObjectURL(blob);
    const w = window.open(b, "_blank");
    setTimeout(()=>URL.revokeObjectURL(b), 60000);
    if (!w) toast("The browser blocked the new tab. Allow pop-ups to view the PDF.","bad");
    return;
  }
  if (k==="link"){ window.open(safeUrl(u, "href"), "_blank", "noopener,noreferrer"); return; }
  toast("This receipt can't be opened here.","bad");
}

function expensePill(s){ const map = {approved:["ok","Approved"], rejected:["bad","Rejected"], clarify:["warn","Question"], pending:["slate","Pending"]}; const k = s||"pending"; const m = Object.hasOwn(map, k) ? map[k] : ["slate", String(k)]; return `<span class="pill ${esc(m[0])}">${esc(m[1])}</span>`; }

/* ---- safety / red tag ---- */
/* Re-read red tags before a status change, so a tag added or removed on another device is counted. */
/* After replacing S.hazards the screen is redrawn (cards must not point at old objects) — unless something is being typed,
   then only the "New data loaded" hint is shown. opts.noRender: the caller redraws itself. opts.quiet: no error toast. */
async function freshHazards(opts){
  opts = opts||{};
  try{
    const snap = await db.collection("hazards").get();
    S.hazards = snap.docs.filter(d=>SAFE_ID.test(String(d.id))).map(d=>Object.assign({id:d.id}, d.data()));
  }catch(e){ console.error(e); if (!opts.quiet) toast("Couldn't check the latest red tags. Try again.", "bad"); return false; }
  if (!opts.noRender){
    if (hasDraft($("#main"))){ renderSide(); renderTabbar(); showRefreshHint(); }
    else render();
  }
  return true;
}
/* Re-read one red tag in place. null (with a toast) if it can't be read. */
async function freshHazard(h){
  let snap;
  try{ snap = await db.doc("hazards/"+h.id).get(); }
  catch(e){ console.error(e); toast("Couldn't check the latest version of this red tag. Try again.", "bad"); return null; }
  if (!snap || !snap.exists){ toast("This red tag no longer exists.", "bad"); return null; }
  const data = snap.data() || {};
  Object.keys(h).forEach(k=>{ if (k!=="id") delete h[k]; });
  Object.assign(h, data);
  return h;
}
/* A step time from a datetime field: required, not in the future, not before the red tag was recorded. */
function stepTime(input, h, what){
  const d = input.value ? validDate(input.value) : null;
  if (!d){ fieldErr(input, `Enter the date and time for “${what}”.`); return null; }
  if (d.getTime() > Date.now()+5*60000){ fieldErr(input, `“${what}”: that time is in the future.`); return null; }
  if (hazardAt(h) && d.getTime() < ts(hazardAt(h))-60000){ fieldErr(input, `“${what}”: that time is before the red tag was recorded (${fmtDate(hazardAt(h))}).`); return null; }
  return d;
}

function stepForm(h, st, audit, tagName){
  const b = el(`<form>${modalHead(st.label, tagName)}
    <div class="field"><label>Date and time *</label><input type="datetime-local" name="when"></div>
    <div class="hint mt">Not in the future, and not before the red tag was recorded (${esc(fmtDate(hazardAt(h)))}).</div>
    <div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></div></form>`);
  showModal(b);
  onSubmit(b, async ()=>{
    const d = stepTime(b.when, h, st.label); if (!d) return;
    if (!(await freshHazard(h))) return;
    if (stepOk(h[st.k])){ toast("This step was already recorded on another device.","bad"); closeOverlay(); render(); return; }
    const p = {[st.k]:d.toISOString(), [st.by]:me()?.name||"", [st.rec]:now()};
    /* Re-recording over an unreadable value: keep the old raw value next to it, so nothing is lost from the record. */
    const old = h[st.k], replaced = old!==undefined && old!==null && old!=="";
    if (replaced){ let raw; try{ raw = typeof old==="string" ? old : JSON.stringify(old); }catch(e){ raw = String(old); } p[st.k+"Replaced"] = String(raw); }
    if (st.k==="gasShutOffAt") p.gasShutOff = true;
    if (st.k==="distributorNotifiedAt" && !isImmediate(h) && !h.writtenNoticeDue) p.writtenNoticeDue = new Date(d.getTime()+14*DAY).toISOString();
    /* Written notice recorded after its due date (or the due date can't be read): saved as late. */
    const due = st.k==="writtenNoticeSentAt" ? noticeDue(h) : null;
    if (due && (badDate(due) || d.getTime() > ts(due))) p.writtenNoticeLate = true;
    if (!(await writeDoc("hazards/"+h.id, p, true))) return;
    Object.assign(h, p);
    const rtxt = replaced ? ` · replaced an unreadable value (“${p[st.k+"Replaced"].slice(0,60)}”)` : "";
    await audit(`Red tag step: ${st.label} — ${fmtDate(p[st.k])}${p.writtenNoticeLate?` · sent late (was due ${dueText(due)})`:""}${rtxt}`, `Red tag on ${tagName}: ${st.label.toLowerCase()} (recorded by ${p[st.by]||"unknown"})${replaced?" — replaced an unreadable value":""}.`);
    closeOverlay(); toast("Recorded."); render();
  });
}
/* Immediate hazard: the tag can't be removed until steps 1–3 are recorded. */
const immStepsMissing = h=> isImmediate(h) && !HZ_STEPS.slice(0,3).every(st=>stepOk(h[st.k]));
const IMM_REMOVE_BLOCKED = "Record gas shut off, customer informed and utility told first.";
/* Input rating in BTU/h: the number field, or else the old text field. null if unknown (never guessed).
   Text forms read: whole numbers with optional "," or " " thousands separators ("500,000", "500 000", "500000"),
   with an optional unit: BTU/h (x1), MBH / MBtu/h / kBTU/h / "500K BTU/h" (x1000), MMBtu/h (x1,000,000).
   Anything with a dot (e.g. "500.000" — 500 or 500,000?) or any other form is unknown.
   A value under 1,000 BTU/h is not a real gas appliance rating (almost certainly a unit mistake) — unknown.
   Plausibility: a value in MBH / MBtu/h / kBTU/h that comes to under 10,000 BTU/h (e.g. "5 MBH") is most likely a unit mistake — unknown.
   A whole number too long to store exactly but clearly over 400,000 is treated as known and over 400,000 (G1), not unknown. */
const BTU_MIN = 1000;
const BTU_NUM = /^(\d{1,3}(?:,\d{3})+|\d{1,3}(?: \d{3})+|\d+)$/;
function btuhRecorded(e){ return !!e && ((e.inputBtuh!==undefined && e.inputBtuh!==null && String(e.inputBtuh).trim()!=="") || String(e.input??"").trim()!==""); }
function equipmentBtuh(e){
  if (!e) return null;
  if (e.inputBtuh!==undefined && e.inputBtuh!==null && String(e.inputBtuh).trim()!==""){

    const isText = typeof e.inputBtuh!=="number";

  if (!id) return true;

  catch(e){ console.error(e); toast("Couldn't check the latest equipment record. Try again.","bad"); return false; }
  const cur = equipmentById(id);
  if (!snap || !snap.exists){ S.equipment = S.equipment.filter(x=>x.id!==id); if (!quietMissing) toast("This equipment record no longer exists.","bad"); return quietMissing ? true : false; }
  const data = snap.data() || {};
  if (cur){ Object.keys(cur).forEach(k=>{ if (k!=="id") delete cur[k]; }); Object.assign(cur, data); }

function clearRule(h){

/* ---- completion checklist ---- */
/* safety:true items can never be skipped (no "Close anyway"). Other missing items can be closed anyway with a reason. */
function completionItems(j){
  const s = sub(j.id), items = [];
  const hz = jobHazards(j), imm = hz.filter(isImmediate);
  items.push({label:"a work note", ok:s.notes.length>0, tab:"notes", hint:"What you found and what you did."});
  items.push({label:"at least one photo", ok:s.media.length>0, tab:"media", hint:"Before / after or the nameplate."});
  /* Fail / Inconclusive blocks closing unless the appliance is red-tagged. Only a later completed (passing) re-test replaces
     the result — Skip / "not recorded" do not. This safety block applies even when the leak test module is turned off. */
  const k = leakResultKind(effectiveLeak(j));
  if ((k && k!=="pass") || S.config.modules.leakTest){
    if (k && k!=="pass") items.push({label:`leak test result: ${k==="fail"?"FAIL":k==="inconclusive"?"inconclusive":"unknown"}${hz.length?" (appliance red-tagged)":""}`, ok:hz.length>0, bad:!hz.length, safety:true, tab:"leak", hint:"The leak test did not pass. Fix and re-test and record a Pass, or red-tag the appliance."});
    else items.push({label:"leak test recorded or skipped", ok:["completed","skipped"].includes(j.leakTest?.status), tab:"leak", hint:leakRelevant(j)?"Recommended for this job.":"Optional — record or skip."});
  }
  const def = readingDef(j); const req = def.checks.filter(c=>c[2]);
  req.forEach(([k,label])=>{
    if (k==="leftSafe" && imm.length) items.push({label:"appliance is red-tagged — gas shut off", ok:imm.every(h=>stepOk(h.gasShutOffAt)), bad:true, safety:true, tab:"safety", hint:"Record the time the gas was shut off on the red tag."});
    else items.push({label:label.charAt(0).toLowerCase()+label.slice(1), ok:k==="leftSafe" ? leftSafeOk(j) : !!(j.readings||{})[k], safety:k==="leftSafe", tab:"readings", hint:k==="leftSafe" && (j.readings||{}).leftSafe ? "A red tag was removed after this was saved. Confirm it again in Readings." : "Confirm it in Readings."});
  });
  if (imm.length) items.push({label:"red tag steps 1–3 recorded (gas shut off, customer informed, gas utility told)", ok:imm.every(h=>!immStepsMissing(h)), bad:true, safety:true, tab:"safety", hint:"Record each step with its time on the red tag."});
  const other = hz.filter(h=>!isImmediate(h));
  if (other.length) items.push({label:"red tag: distributor notice time recorded", ok:other.every(h=>stepOk(h.distributorNotifiedAt)), tab:"safety", hint:"Record when the gas distributor was told."});
  items.push({label:"help requests answered", ok:s.help.every(h=>h.status==="resolved"), tab:"overview", hint:"Wait for the supervisor's answer."});
  return items;
}

function timelineItem(f){
  const map = {status:["chev","info"], created:["plus","info"], edited:["pencil","slate"], sent_back:["undo","bad"], readings:["gauge","violet"], leak:["droplet","info"], hazard:["tag","bad"], note:["pencil","slate"], media:["image","violet"], material:["receipt","warn"], help:["lifebuoy","warn"], answer:["lifebuoy","ok"], reading:["gauge","violet"], equipment:["box","warn"]};
  let kind = f.kind==="event" ? (f.type || (f.status?"status":"edited")) : f.kind;
  let text = f.text || "";
  if (f.kind==="event"){
    if (kind==="status") text = f.status==="completed" ? (f.note || "Approved and closed") : `Status → ${STATUS[f.status]?.label||f.status}`;
    else if (kind==="created") text = "Job created" + (f.note?` · ${f.note}`:"");
    else if (kind==="sent_back") text = "Sent back: "+(f.note||"");
    else text = f.note || cap(kind);
    if (kind==="status" && f.note && f.status!=="completed") text += ` · ${f.note}`;
  }
  const [ic, c] = (typeof kind==="string" && Object.hasOwn(map, kind)) ? map[kind] : ["clock","slate"];
  return el(`<div class="ev" style="--c:var(--${c})"><div class="dot">${icon(ic)}</div><div>${f.job?`<span class="mono small">${esc(f.job.refNumber)}</span> · `:""}${esc(text)}</div><div class="meta">${esc(f.by||"")} · ${esc(fmtDate(f.at))}</div></div>`);
}

}

<script>
/* ------------------------------ EQUIPMENT ------------------------------ */
function equipmentAge(e){
  if (!e?.installDate) return "Install date unknown";
  if (badDate(e.installDate)) return "Age unknown (install date can't be read)";
  const y = (Date.now()-ts(e.installDate))/(365.25*DAY);
  return y<1 ? "Installed less than a year ago" : `${Math.floor(y)} year${Math.floor(y)>1?"s":""} old · installed ${fmtDateOnly(e.installDate)}`;
}
/* When a closed job was done: closedAt, or else scheduledAt — only a readable date (null if neither can be read). */
function doneAt(j){ return [j.closedAt, j.scheduledAt].find(d=>d && Number.isFinite(ts(d))) || null; }
function lastService(e){
  const done = S.jobs.filter(j=>j.equipmentId===e.id && isClosed(j) && doneAt(j)).sort((a,b)=>ts(doneAt(b))-ts(doneAt(a)));
  return done[0]||null;
}
const MAINT_TYPES = /furnace|boiler|heat pump|air cond|a\/c|\bac\b|water heater|hrv|erv|fireplace|rooftop|unit heater/i;
/* Due for yearly maintenance, or its date can't be read (counted as due so it gets checked). */
const maintDueOrUnreadable = e=>{ const m = maintenanceDue(e); return !!m && (!!m.overdue || !!m.unreadable); };
function maintenanceDue(e){
  if (!MAINT_TYPES.test(e.type||"") && !/gas|propane|oil/i.test(e.fuel||"")) return null;
  /* Dates that can't be read are skipped; if no date can be read at all, the due date is "can't be read" (never thrown). */
  const all = S.jobs.filter(j=>j.equipmentId===e.id && isClosed(j) && ["maintenance","inspection","installation"].includes(j.jobType));
  const last = all.filter(doneAt).sort((a,b)=>ts(doneAt(b))-ts(doneAt(a)))[0];
  const base = last ? doneAt(last) : (e.installDate && !badDate(e.installDate) ? e.installDate : null);
  if (!base) return (all.length || e.installDate) ? {due:null, overdue:false, unreadable:true, basis:all.length?"last maintenance":"install date"} : null;
  const due = ts(base)+365*DAY;
  return {due:new Date(due).toISOString(), overdue:due<Date.now(), basis:last?"last maintenance":"install date"};
}
function renderEquipment(){
  if (S.view.equipmentId) return renderEquipmentDetail(S.view.equipmentId);
  const wrap = el(`<div><div class="pagehead"><div><h1>Equipment passport</h1><div class="sub">Every unit you service, with its history, photos, red tags and QR status.</div></div>${S.role!=="accountant"?`<button class="btn primary" id="add">${icon("plus","sm")} Add equipment</button>`:""}</div>
    <div class="row wrap" style="margin-bottom:12px"><input class="in" id="q" placeholder="Search make, model, serial, customer…" value="${esc(S.ui.eqQ)}" style="max-width:360px"><label class="row small"><input type="checkbox" id="due" ${S.ui.eqDue?"checked":""}> Maintenance due only</label></div><div id="list"></div></div>`);
  $("#add", wrap)?.addEventListener("click", ()=>equipmentForm());
  const draw = ()=>{
    const q = S.ui.eqQ.trim().toLowerCase();
    let list = S.equipment.filter(e=>!q || [e.manufacturer,e.model,e.serial,e.type,customerById(e.siteCustomerId)?.name].filter(Boolean).some(v=>String(v).toLowerCase().includes(q)));
    if (isField()){ const mineCust = new Set(visibleJobs().map(j=>j.customerId)); list = list.filter(e=>mineCust.has(e.siteCustomerId)); }
    if (S.ui.eqDue) list = list.filter(maintDueOrUnreadable);
    const box = $("#list", wrap); box.innerHTML = "";
    if (!list.length){ box.appendChild(el(`<div class="card">${emptyState("box", S.equipment.length?"No equipment matches.":"No equipment recorded yet.")}</div>`)); return; }
    const t = el(`<div class="card pad0"><div class="tablewrap"><table><thead><tr><th>Equipment</th><th>Serial</th><th>Customer</th><th>Age</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>`);
    list.forEach(e=>{
      const md = maintenanceDue(e); const hz = openHazards(h=>h.equipmentId===e.id).length;
      const tags = [hz?`<span class="pill bad">Red tag</span>`:"", md?.unreadable?`<span class="pill warn">Maintenance date can't be read</span>`:md?.overdue?`<span class="pill warn">Maintenance due</span>`:"", e.qrStatus==="active"?`<span class="pill ok">QR active</span>`:""].join(" ") || `<span class="faint small">—</span>`;
      const tr = el(`<tr class="click"><td><b>${esc(e.manufacturer)} ${esc(e.model)}</b><div class="tiny faint">${esc(e.type||"")}${e.fuel?" · "+esc(e.fuel):""}</div></td><td class="mono">${esc(e.serial||"—")}</td><td>${esc(customerById(e.siteCustomerId)?.name||"—")}</td><td>${esc(!e.installDate?"—":badDate(e.installDate)?"age unknown":Math.floor((Date.now()-ts(e.installDate))/(365.25*DAY))+" yr")}</td><td>${tags}</td></tr>`);
      tr.addEventListener("click", ()=>openEquipment(e.id)); $("tbody", t).appendChild(tr);
    });
    box.appendChild(t);
  };
  $("#q", wrap).addEventListener("input", e=>{ S.ui.eqQ = e.target.value; draw(); });
  $("#due", wrap).addEventListener("change", e=>{ S.ui.eqDue = e.target.checked; draw(); });
  draw(); return wrap;
}
function equipmentForm(e, presetCustomer){
  const editing = !!e;
  const b = el(`<form>${modalHead(editing?"Edit equipment":"Add equipment")}
    <div class="grid g2">

      <div class="field" style="grid-column:1/-1"><label>Internal notes</label><textarea name="notes" placeholder="Location in house, access, quirks…">${esc(e?.notes||"")}</textarea></div>
    </div>
    <div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${editing?"Save":"Add equipment"}</button></div></form>`);
  showModal(b, {wide:true});
  onSubmit(b, async ()=>{
    const data = {}; ["manufacturer","model","serial","type","fuel","refrigerant","filterSize","installDate","warrantyUntil","notes"].forEach(k=>data[k]=b[k].value.trim());
    data.siteCustomerId = b.siteCustomerId.value||null;
    /* Whole number only ("60000", "60,000" or "60 000"). A dot is refused: "500.000" could mean 500 or 500,000. */
    const btuIn = b.inputBtuh.value.trim();
    if (btuIn){
      if (/^\d[\d, ]*\.\d+$/.test(btuIn)){ fieldErr(b.inputBtuh, "Input rating must be a whole number of BTU/h — no decimal point. Write 500000 or 500,000 (not 500.000)."); return; }
      if (!BTU_NUM.test(btuIn)){ fieldErr(b.inputBtuh, "Input rating must be a whole number of BTU/h, e.g. 60000 or 60,000."); return; }
      const n = Number(btuIn.replace(/[, ]/g,""));

      if (n<BTU_MIN){ fieldErr(b.inputBtuh, "Input rating under 1,000 BTU/h is not a real appliance rating — check the units on the rating plate (BTU/h, not MBH)."); return; }
      data.inputBtuh = n;
    }
    else data.inputBtuh = null;
    const missing = [["manufacturer","Manufacturer"],["model","Model"],["serial","Serial number"]].find(([k])=>!data[k]);
    if (missing){ fieldErr(b[missing[0]], `Enter the ${missing[1].toLowerCase()}.`); return; }
    const dup = S.equipment.find(x=>x.serial && String(x.serial).toLowerCase()===data.serial.toLowerCase() && x.id!==e?.id);
    /* confirmBox stacks over this form, so Cancel returns to the filled-in form. */

    if (editing){
      /* A change of the input rating is logged on the equipment (old → new, who, when). If the equipment has an open red tag,
         it also goes on that job's timeline and managers are told — the rating decides who may remove the tag. */
      if (!(await freshEquipment(e.id))){ return; }
      const before = ratingText(e), after = ratingText(Object.assign({}, e, data));
      let change = null;
      if (before!==after){
        change = {from:before, to:after, fromRaw:rawRating(e), toRaw:data.inputBtuh, by:me()?.name||ROLE_LABELS[S.role], byId:S.userId||null, at:now()};
        data.ratingChanges = (Array.isArray(e.ratingChanges) ? e.ratingChanges : []).concat([change]);
      }
      if (!(await writeDoc("equipment/"+e.id, data, true))) return;
      Object.assign(e, data);
      if (change){
        await freshHazards({quiet:true, noRender:true});
        const open = openHazards(h=>ruleEquipmentId(h)===e.id);
        const note = `Input rating of ${equipmentLabel(e)} changed: ${change.from} → ${change.to} (while a red tag is open)`;
        for (const jid of new Set(open.map(h=>h.jobId).filter(x=>x && jobById(x)))) await logEvent(jid, "equipment", {note, equipmentId:e.id});
        if (open.length){ const jid = open.map(h=>h.jobId).find(x=>x && jobById(x)); await notify(`Input rating of red-tagged ${equipmentLabel(e)} changed: ${change.from} → ${change.to} by ${change.by}.`, jid?{toRole:"managers", jobId:jid}:{toRole:"managers"}); }
      }
      closeOverlay(); toast("Equipment updated."); render(); return;
    }
    const id = uid("eq"); const rec = Object.assign(data, {qrStatus:"not_active", createdAt:now()});
    if (!(await writeDoc("equipment/"+id, rec))) return;
    S.equipment.push(Object.assign({id}, rec));
    closeOverlay(); toast("Equipment added."); openEquipment(id);
  });
}

    <div><div class="k">Input rating</div><div class="v">${!btuhRecorded(e)?"Not recorded":equipmentBtuh(e)===null?`${esc(rawRating(e))} <span class="hint" style="color:var(--bad)">(rating can't be read — check the rating plate)</span>`:esc(btuText(equipmentBtuh(e)))+(String(e.inputBtuh??"").trim()===""?` <span class="hint">(from the text “${esc(rawRating(e))}” — enter the number in Edit)</span>`:"")}</div></div>
    <div><div class="k">Refrigerant</div><div class="v">${esc(e.refrigerant||"—")}</div></div>
    <div><div class="k">Filter size</div><div class="v mono">${esc(e.filterSize||"—")}</div></div>
    <div><div class="k">Warranty</div><div class="v">${e.warrantyUntil && badDate(e.warrantyUntil)?esc(BAD_DATE_TXT):e.warrantyUntil?(ts(e.warrantyUntil)>Date.now()?"Until "+esc(fmtDateOnly(e.warrantyUntil)):"Expired "+esc(fmtDateOnly(e.warrantyUntil))):"—"}</div></div>
    <div><div class="k">Last service</div><div class="v">${ls?esc(fmtDateOnly(doneAt(ls))):"None on file"}</div></div>
    <div><div class="k">Yearly maintenance</div><div class="v">${md?.unreadable?`<span style="color:var(--warn)">Date can't be read — check the ${esc(md.basis)}</span>`:md?(md.overdue?`<span style="color:var(--warn)">Due since ${esc(fmtDateOnly(md.due))}</span>`:"Next by "+esc(fmtDateOnly(md.due))):"—"}</div></div>
  </div>${e.notes?`<div class="note mt">${esc(e.notes)}</div>`:""}</div>`));

  $("#l", g).appendChild(hist);

function qrCard(e){
  const active = e.qrStatus==="active" && !!e.qrToken; const qc = e.qrConsent||{};
  const label = {declined:"Homeowner declined", withdrawn:"Approval withdrawn"}[e.qrStatus] || "Not activated";
  const card = el(active ? `<div class="card" style="text-align:center"><div class="card-h"><h3>${icon("qr","sm")} Equipment QR</h3><span class="pill ok">Active</span></div>
    <div id="qrbox"></div>
    <div class="tiny faint mono" style="word-break:break-all;margin-top:6px">${esc(e.qrToken)}</div>
    ${safeUrl(qc.signatureImage,"img")?`<img src="${esc(safeUrl(qc.signatureImage,"img"))}" alt="Homeowner signature" style="background:#fff;border:1px solid var(--border);border-radius:10px;width:100%;max-width:260px;margin-top:12px">`:""}
    <div class="hint" style="margin-top:6px">Signed by ${esc(qc.signedName||"homeowner")} · ${esc(fmtDateOnly(qc.at))}<br>${esc(qc.policyVersion||"")}</div>
    <div class="hint mt">Scanning opens this passport for your company's authorized technicians only.</div>
    ${can.qr()?`<button class="btn danger sm mt" id="wd">Record homeowner withdrawal</button>`:""}</div>`
  : `<div class="card" style="text-align:center"><div class="card-h"><h3>${icon("qr","sm")} Equipment QR</h3><span class="pill ${e.qrStatus==="declined"||e.qrStatus==="withdrawn"?"bad":"slate"}">${esc(label)}</span></div>
    <p class="hint">No QR exists for this unit. One is created only after the homeowner signs to approve sharing this equipment's information, so nothing is placed on their equipment without their knowledge.</p>
    ${can.qr()?`<button class="btn primary mt" id="rq">${icon("pencil","sm")} ${e.qrStatus==="declined"||e.qrStatus==="withdrawn"?"Ask again":"Get homeowner signature"}</button>`:""}</div>`);
  $("#rq", card)?.addEventListener("click", ()=>qrConsentForm(e));
  const wd = $("#wd", card);
  wd?.addEventListener("click", withBusy(wd, async ()=>{
    if (!(await confirmBox("Deactivate QR?", "Use this when the homeowner asks to stop sharing. The QR stops working right away and the withdrawal is recorded.", "Deactivate", true))) return;
    const ok = await saveQr(e, {qrStatus:"withdrawn", qrToken:null, qrConsent:{result:"withdrawn", method:qc.method||"Signature", policyVersion:QR_CONSENT_VERSION, at:now(), recordedBy:me()?.name||""}}, {method:qc.method||"Signature", result:"withdrawn"});
    if (ok) toast("QR deactivated.");
    render();
  }));
  if (active) setTimeout(()=>{ const box = $("#qrbox", card); if (!box) return; if (window.QRCode) new QRCode(box, {text:"saferoutine://equipment/"+e.qrToken, width:170, height:170}); else box.textContent = e.qrToken; }, 0);
  return card;
}
function newToken(){ const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, b=>b.toString(16).padStart(2,"0")).join(""); }
/* Writes first, changes local state only after success. Returns true/false.
   Approval: the consent record is written first, so a QR is never active without its signed record.
   Decline / withdrawal: the equipment is updated first, so the QR stops working even if the record write then fails. */
async function saveQr(e, patch, rec){
  const r = Object.assign({type:"qr_activation", equipmentId:e.id, policyVersion:QR_CONSENT_VERSION, at:now(), by:me()?.name||""}, rec);
  const writeRecord = async msg=>{ const id = await addDoc("consent", r, msg); if (id) S.consent.push(Object.assign({id}, r)); return !!id; };
  if (patch.qrStatus==="active"){
    if (!(await writeRecord())) return false;
    if (!(await writeDoc("equipment/"+e.id, patch, true))) return false;
    Object.assign(e, patch); return true;
  }
  if (!(await writeDoc("equipment/"+e.id, patch, true))) return false;
  Object.assign(e, patch);
  return await writeRecord("The QR status was saved, but the consent record couldn't be written. Record it again.");
}
function qrConsentForm(e){
  const text = `By signing, you allow information about your ${e.type||"equipment"} (${e.manufacturer||""} ${e.model||""}) to be kept and shared in SafeRoutine: make, model, serial number, service history and photos. A QR code placed on the equipment opens that private page. Only you, the service company that placed it, and technicians that company authorizes can open it. You can withdraw your approval at any time and the QR will stop working. If you say no, nothing is shared, no QR is placed, and the work continues as normal.`;
  const b = el(`<div>${modalHead("Homeowner signature", "Approval to share this equipment's information")}
    <div class="note">${esc(text)}</div>
    <div class="field mt"><label>Homeowner full name *</label><input id="nm" autocomplete="off"></div>
    <div class="field mt"><label>Sign here *</label><canvas class="sig" id="pad" width="600" height="200"></canvas><div class="row between"><span class="hint">Sign with a finger or mouse.</span><button type="button" class="btn ghost sm" id="clr">Clear</button></div></div>
    <label class="check mt"><input type="checkbox" id="ag"><span>I understand and agree to share this equipment's information as described above.</span></label>
    <div class="callout warn mt">${icon("alert","sm")}<div>Draft wording. A lawyer must review the text and the e-signature method (Ontario / Canada) before real use.</div></div>
    <div class="mf"><button class="btn" id="no">Homeowner declines</button><button class="btn primary" id="yes">${icon("check","sm")} Approve and sign</button></div></div>`);
  showModal(b, {wide:true});
  const cv = $("#pad", b), ctx = cv.getContext("2d"); ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0c1830";
  let drawing = false, inked = false;
  const pos = ev=>{ const r = cv.getBoundingClientRect(); return [(ev.clientX-r.left)*cv.width/r.width, (ev.clientY-r.top)*cv.height/r.height]; };
  cv.addEventListener("pointerdown", ev=>{ drawing = true; inked = true; cv.setPointerCapture(ev.pointerId); const [x,y] = pos(ev); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y); ctx.stroke(); });
  cv.addEventListener("pointermove", ev=>{ if (!drawing) return; const [x,y] = pos(ev); ctx.lineTo(x,y); ctx.stroke(); });
  ["pointerup","pointercancel","pointerleave"].forEach(t=>cv.addEventListener(t, ()=>drawing=false));
  $("#clr", b).addEventListener("click", ()=>{ ctx.clearRect(0,0,cv.width,cv.height); inked = false; });
  const noBtn = $("#no", b), yesBtn = $("#yes", b);
  noBtn.addEventListener("click", withBusy([noBtn, yesBtn], async ()=>{
    if (!(await saveQr(e, {qrStatus:"declined", qrToken:null, qrConsent:{result:"declined", method:"Signature", policyVersion:QR_CONSENT_VERSION, at:now(), recordedBy:me()?.name||""}}, {method:"Signature", result:"declined"}))) return;
    closeOverlay(); toast("Recorded: homeowner declined. Nothing is shared and no QR was created."); render();
  }));
  yesBtn.addEventListener("click", withBusy([yesBtn, noBtn], async ()=>{
    const name = $("#nm", b).value.trim();
    if (!name) return toast("Type the homeowner's full name.","bad");
    if (!inked) return toast("The homeowner needs to sign in the box.","bad");
    if (!$("#ag", b).checked) return toast("Tick the box to confirm.","bad");
    if (!(await saveQr(e, {qrStatus:"active", qrToken:newToken(), qrConsent:{result:"approved", method:"Signature", policyVersion:QR_CONSENT_VERSION, signedName:name, signatureImage:cv.toDataURL("image/png"), at:now(), requestedBy:me()?.name||""}}, {method:"Signature", result:"approved", signedName:name}))) return;
    closeOverlay(); toast("Signed. The QR is now active."); render();
  }));
}

  const wrap = el(`<div><div class="pagehead"><div><h1>${own?"My archive":"Archive"}</h1><div class="sub">Closed jobs. Read-only and private to the trade team.</div></div><button class="btn" id="csv">${icon("download","sm")} Export CSV</button></div>

      <div class="field"><label>From</label><input type="date" id="from" value="${esc(f.from)}"></div>
      <div class="field"><label>To</label><input type="date" id="to" value="${esc(f.to)}"></div>
      <div class="field"><label>Job type</label><select id="type"><option value="">All types</option>${JOB_TYPES.map(t=>`<option value="${t}" ${f.type===t?"selected":""}>${cap(t)}</option>`).join("")}</select></div>
      ${own?"":`<div class="field"><label>Technician</label><select id="tech"><option value="">Everyone</option>${techs.map(t=>`<option value="${esc(t)}" ${f.tech===t?"selected":""}>${esc(userById(t)?.name||t)}</option>`).join("")}</select></div>`}
      <div><button class="btn ghost" id="clr">Clear filters</button></div></div></div>
    <div class="row between mt" style="margin-bottom:10px"><span class="hint" id="cnt"></span></div><div id="res"></div></div>`);
  let current = [];

    const q = f.q.trim().toLowerCase();
    current = base.filter(j=>{
      if (q && ![j.refNumber, customerById(j.customerId)?.name, j.siteAddress].filter(Boolean).some(v=>String(v).toLowerCase().includes(q))) return false;
      if (f.tech && j.technicianId!==f.tech) return false;
      if (f.type && j.jobType!==f.type) return false;
      const d = ts(j.scheduledAt);
      if (f.from && d < ts(f.from+"T00:00:00")) return false;

    $("#cnt", wrap).textContent = `${current.length} closed job(s)`;

  };
  [["#q","q"],["#from","from"],["#to","to"],["#type","type"],["#tech","tech"]].forEach(([s,k])=>{ const n = $(s, wrap); if (n) n.addEventListener(n.tagName==="SELECT"||n.type==="date"?"change":"input", ()=>{ f[k] = n.value; draw(); }); });
  $("#clr", wrap).addEventListener("click", ()=>{ S.ui.archive = {q:"",from:"",to:"",tech:"",type:""}; render(); });
  $("#csv", wrap).addEventListener("click", ()=>{
    const rows = [["Ref","Scheduled","Closed","Customer","Address","Technician","Type","Priority","Approved by"]].concat(current.map(j=>[j.refNumber, j.scheduledAt, j.closedAt||"", customerById(j.customerId)?.name||"", j.siteAddress, userById(j.technicianId)?.name||"", j.jobType, j.priority, j.review?.by||""]));
    downloadFile(`saferoutine-archive-${new Date().toISOString().slice(0,10)}.csv`, toCSV(rows));
  });
  draw(); return wrap;
}

    $("a", tr).addEventListener("click", e=>{ e.preventDefault(); openJob(job.id, "materials"); });

      const a = el(`<button class="btn go sm">Approve</button>`), r = el(`<button class="btn danger sm">Reject</button>`), q = el(`<button class="btn sm">Ask</button>`);
      a.addEventListener("click", withBusy([a, r, q], ()=>decideExpense(job, item, "approved")));
      r.addEventListener("click", withBusy([r, a, q], ()=>decideExpense(job, item, "rejected")));
      q.addEventListener("click", ()=>{
        const b = el(`<form>${modalHead("Ask the technician", item.description)}<div class="field"><label>Your question *</label><textarea name="m" required placeholder="e.g. Can you add the supplier receipt?"></textarea></div><div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Send</button></div></form>`);
        showModal(b);
        onSubmit(b, async ()=>{
          const m = b.m.value.trim(); if (!m){ fieldErr(b.m, "Type your question first."); return; }

        });
      });
      $(".act", tr).append(el(`<div class="row"></div>`)); $(".act .row", tr).append(a, q, r);
    }
    $("tbody", t).appendChild(tr);
  });
  return t;
}
async function decideExpense(job, item, status, msg){
  const patch = {status, decidedBy:me()?.name||"Accounting", decidedAt:now()}; if (msg) patch.clarifyMsg = msg;
  if (!(await writeDoc("jobs/"+job.id+"/materials/"+item.id, patch, true))) return false;
  Object.assign(item, patch);
  const to = S.users.find(u=>u.id===item.byId || u.name===item.by);
  const text = status==="clarify" ? `Accounting has a question about “${item.description}” on ${job.refNumber}: ${msg}` : `Expense “${item.description}” on ${job.refNumber} was ${status}.`;
  await notify(text, to?{toUser:to.id, jobId:job.id}:{toRole:"technician", jobId:job.id});
  toast(status==="clarify"?"Question sent.":`Expense ${status}.`); render();
  return true;
}
function renderExpenses(){
  const all = allExpenses(); const f = S.ui.expenseFilter;
  const counts = {pending:0, clarify:0, approved:0, rejected:0}; all.forEach(x=>counts[x.item.status||"pending"]++);
  const wrap = el(`<div><div class="pagehead"><div><h1>Expenses</h1><div class="sub">Materials and purchases logged on jobs.</div></div><button class="btn" id="csv">${icon("download","sm")} Export CSV</button></div>

  $$("[data-f]", wrap).forEach(b=>b.addEventListener("click", ()=>{ S.ui.expenseFilter = b.dataset.f; render(); }));

}

  const reviewed = S.jobs.filter(j=>j.review); const sentBackJobs = S.jobs.filter(j=>(j.sendBacks||0)>0);

    <div class="field"><label>TSSA certificate number</label><input name="tssaCertNumber" value="${esc(u?.tssaCertNumber||"")}"></div>
    <div class="field" style="grid-column:1/-1"><label>Address</label><input name="address" value="${esc(u?.address||"")}" placeholder="Used on red-tag removal records"></div>
    <div class="field" style="grid-column:1/-1"><label>Supervisor (for apprentices)</label><select name="supervisorId"><option value="">—</option>${activeUsers().filter(x=>x.role==="supervisor"||x.role==="owner").map(x=>`<option value="${esc(x.id)}" ${u?.supervisorId===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div></div>
    <h4 class="mt2" style="margin-bottom:8px">Licences &amp; certificates</h4><div class="stack tight" id="cl"></div>
    <button type="button" class="btn sm mt" id="ac">${icon("plus","sm")} Add licence</button>
    ${u?`<label class="check mt"><input type="checkbox" name="active" ${u.active!==false?"checked":""}><span>Active (unticking removes them from scheduling but keeps their history)</span></label>`:""}
    <div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></div></form>`);
  const drawC = ()=>{ const cl = $("#cl", b); cl.innerHTML = ""; if (!creds.length) cl.innerHTML = `<div class="hint">None yet. e.g. G3, G2, ODP, 313A, 309A, Working at Heights.</div>`;
    creds.forEach((c,i)=>{ const r = el(`<div class="grid g3" style="align-items:end"><div class="field"><label>Licence</label><input value="${esc(c.name)}" data-k="name"></div><div class="field"><label>Number</label><input value="${esc(c.number||"")}" data-k="number"></div><div class="field"><label>Expires</label><div class="row"><input type="date" value="${esc(c.expires||"")}" data-k="expires"><button type="button" class="btn ghost sm" aria-label="Remove">${icon("x","sm")}</button></div></div></div>`);
      $$("[data-k]", r).forEach(inp=>inp.addEventListener("input", ()=>{ creds[i][inp.dataset.k] = inp.value; }));
      $("button", r).addEventListener("click", ()=>{ creds.splice(i,1); drawC(); }); cl.appendChild(r); }); };
  drawC();
  $("#ac", b).addEventListener("click", ()=>{ creds.push({name:"", number:"", expires:""}); drawC(); });
  showModal(b, {wide:true});
  const formData = ()=> ({name:b.name.value.trim(), email:b.email.value.trim(), role:b.role.value, trade:b.trade.value, supervisorId:b.supervisorId.value||null,
      gasLicence:GAS_LICENCES.includes(b.gasLicence.value)?b.gasLicence.value:"none", tssaCertNumber:b.tssaCertNumber.value.trim(), address:b.address.value.trim(), credentials:creds.filter(c=>String(c.name||"").trim()).map(c=>Object.assign({}, c, {name:String(c.name).trim()})),
      ...(u?{active:b.active.checked}:{})});
  /* Values when the form was opened: on save only the fields the editor changed are written (another device may have changed the rest). */
  const open0 = formData();
  onSubmit(b, async ()=>{
    const d = formData();
    if (!d.name){ fieldErr(b.name, "Enter the person's full name."); return; }
    if (b.email.validity.typeMismatch){ fieldErr(b.email, "Enter a valid email address, or leave it empty."); return; }
    if (u){
      const touched = Object.keys(d).filter(k=> JSON.stringify(d[k])!==JSON.stringify(open0[k]));
      if (!touched.length){ closeOverlay(); return; }
      let snap;
      try{ snap = await db.doc("users/"+u.id).get(); }
      catch(e){ console.error(e); toast("Couldn't check the latest version of this person. Try again.","bad"); return; }
      if (!snap || !snap.exists){ toast("This person's record no longer exists.","bad"); return; }
      const fresh = snap.data() || {};
      const patch = {}; touched.forEach(k=> patch[k] = d[k]);
      /* Turning an account back on also clears the "duplicate setup owner" marker. */
      if (("active" in patch ? patch.active : fresh.active!==false) && fresh.setupDuplicateOf) patch.setupDuplicateOf = null;
      if (!(await writeDoc("users/"+u.id, patch, true))) return;
      Object.keys(u).forEach(k=>{ if (k!=="id") delete u[k]; });
      Object.assign(u, fresh, patch); normalizeUser(u);
      /* If you edited the person you're viewing as, keep the role in step (or pick someone else if deactivated). */
      if (u.id===S.userId){ closeOverlay(); toast("Saved."); if (u.active===false || !ROLE_LABELS[u.role]) restoreUser(); else { S.role = u.role; lsSet("sr_role", u.role); render(); } return; }
    }
    else { const id = uid("user"); d.active = true; d.createdAt = now(); if (!(await writeDoc("users/"+id, d))) return; const nu = Object.assign({id}, d); normalizeUser(nu); S.users.push(nu); }
    closeOverlay(); toast("Saved."); render();
  });
}

function skillStats(u){
  const jobs = S.jobs.filter(j=>j.technicianId===u.id); const closed = jobs.filter(isClosed);
  const s = jobs.map(j=>sub(j.id));
  return {closed:closed.length, byType:JOB_TYPES.map(t=>[cap(t), closed.filter(j=>j.jobType===t).length]).filter(r=>r[1]),
    readings:jobs.filter(j=>j.readings && Object.keys(j.readings).some(k=>!READING_META.has(k))).length,
    leak:jobs.filter(j=>j.leakTest?.status==="completed").length, help:s.reduce((n,x)=>n+x.help.length,0),
    sentBack:jobs.reduce((n,j)=>n+(j.sendBacks||0),0), firstPass:closed.filter(j=>!(j.sendBacks>0)).length};
}
function skillCard(u){
  const st = skillStats(u); const m = Math.max(1, ...st.byType.map(r=>r[1]));
  return el(`<div class="card"><div class="row">${avatar(u,"lg")}<div><b>${esc(u.name)}</b><div class="hint">Supervisor: ${esc(userById(u.supervisorId)?.name||"—")}</div></div></div>

/* ------------------------------ AUDIT ------------------------------ */
function auditRows(){
  const rows = [];
  S.jobs.forEach(j=>{ const s = sub(j.id);
    s.events.forEach(e=>{ const t = timelineItem(Object.assign({kind:"event"}, e)).children[1].textContent; rows.push({at:e.at, by:e.by, what:`${j.refNumber}: ${t}`}); });
    s.materials.filter(m=>m.decidedAt).forEach(m=>rows.push({at:m.decidedAt, by:m.decidedBy, what:`${j.refNumber}: expense “${m.description}” ${m.status}`}));
    s.help.filter(h=>h.resolvedAt).forEach(h=>rows.push({at:h.resolvedAt, by:h.resolvedBy, what:`${j.refNumber}: answered help request`}));
  });
  S.consent.filter(c=>c.type==="qr_activation").forEach(c=>rows.push({at:c.at, by:c.by||"—", what:`QR ${c.result} · ${equipmentLabel(equipmentById(c.equipmentId))}${c.signedName?" · signed by "+c.signedName:""}`}));
  S.equipment.forEach(e=>{ if (Array.isArray(e.ratingChanges)) e.ratingChanges.filter(c=>c && typeof c==="object").forEach(c=>rows.push({at:c.at, by:c.by, what:`Input rating changed · ${equipmentLabel(e)}: ${c.from||"?"} → ${c.to||"?"}`})); });
  S.hazards.forEach(h=>{ rows.push({at:h.at, by:h.by, what:`Red tag opened · ${equipmentLabel(equipmentById(h.equipmentId))}: ${h.description}`}); if (h.resolvedAt) rows.push({at:h.resolvedAt, by:h.clearRecordedBy||h.resolvedBy, what:`Red tag removed by ${h.resolvedBy||"—"} · ${h.correctiveAction||h.resolution||""}`}); });
  return rows.sort((a,b)=>ts(b.at)-ts(a.at));
}
function renderAudit(){
  const wrap = el(`<div><div class="pagehead"><div><h1>Audit log</h1><div class="sub">Who did what, and when.</div></div><button class="btn" id="csv">${icon("download","sm")} Export CSV</button></div>
    <div class="callout warn" style="margin-bottom:12px">${icon("lock","sm")}<div>In this prototype the log is built in the browser. The real app must write it on the server so it can't be edited.</div></div>
    <input class="in" id="q" placeholder="Filter…" value="${esc(S.ui.auditQ)}" style="max-width:360px;margin-bottom:12px"><div id="t"></div></div>`);
  let list = [];
  const draw = ()=>{ const q = S.ui.auditQ.toLowerCase(); list = auditRows().filter(r=>!q || (r.what+" "+r.by).toLowerCase().includes(q));
    const t = $("#t", wrap); t.innerHTML = "";
    t.appendChild(list.length ? el(`<div class="card pad0"><div class="tablewrap"><table><thead><tr><th>When</th><th>What</th><th>By</th></tr></thead><tbody>${list.map(r=>`<tr><td style="white-space:nowrap">${esc(fmtDate(r.at))}</td><td>${esc(r.what)}</td><td>${esc(r.by||"")}</td></tr>`).join("")}</tbody></table></div></div>`) : el(`<div class="card">${emptyState("file","Nothing logged yet.")}</div>`)); };
  $("#q", wrap).addEventListener("input", e=>{ S.ui.auditQ = e.target.value; draw(); });

  draw(); return wrap;
}

  });
  const list = S.feedback.slice().sort((a,b)=>ts(b.at)-ts(a.at));
  if (!list.length) $("#l", wrap).appendChild(el(`<div class="card">${emptyState("message","No feedback yet.")}</div>`));
  list.forEach(f=>{
    const st = f.status||"New"; const cls = st==="Implemented"?"ok":st==="Planned"?"info":["Declined","Duplicate"].includes(st)?"slate":"warn";
    const c = el(`<div class="card"><div class="row between wrap"><b>${esc(f.category||"General")}</b>${S.role==="owner"?`<select class="in" style="width:auto">${FEEDBACK_STATUSES.map(s=>`<option ${/^under/i.test(st)&&/^Under/.test(s)||s===st?"selected":""}>${s}</option>`).join("")}</select>`:`<span class="pill ${cls}">${esc(st)}</span>`}</div><p style="margin-top:6px">${esc(f.text)}</p><div class="hint mt">${esc(f.by)} · ${esc(ago(f.at))}</div></div>`);
    $("select", c)?.addEventListener("change", async e=>{
      const sel = e.target, prev = f.status||"New", next = sel.value;
      if (sel.dataset.busy) return; sel.dataset.busy = "1"; sel.disabled = true;
      try{
        if (await writeDoc("feedback/"+f.id, {status:next}, true)){ f.status = next; toast("Status updated."); renderSide(); }
        else sel.value = prev; /* show the saved value again */
      }finally{ delete sel.dataset.busy; sel.disabled = false; }
    });
    $("#l", wrap).appendChild(c);
  });
  return wrap;
}

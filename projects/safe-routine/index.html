function qrCard(e){
  const active = e.qrStatus==="active" && !!e.qrToken; const qc = e.qrConsent||{};
  const label = {declined:"Homeowner declined", withdrawn:"Approval withdrawn"}[e.qrStatus] || "Not activated";
  const card = el(active ? `<div class="card" style="text-align:center"><div class="card-h"><h3>${icon("qr","sm")} Equipment QR</h3><span class="pill ok">Active</span></div>
    <div id="qrbox"></div>
    <div class="tiny faint mono" style="word-break:break-all;margin-top:6px">${esc(e.qrToken)}</div>
    ${qc.signatureImage?`<img src="${esc(qc.signatureImage)}" alt="Homeowner signature" style="background:#fff;border:1px solid var(--border);border-radius:10px;width:100%;max-width:260px;margin-top:12px">`:""}
    <div class="hint" style="margin-top:6px">Signed by ${esc(qc.signedName||"homeowner")} · ${esc(fmtDateOnly(qc.at))}<br>${esc(qc.policyVersion||"")}</div>
    <div class="hint mt">Scanning opens this passport for your company's authorized technicians only.</div>
    ${can.qr()?`<button class="btn danger sm mt" id="wd">Record homeowner withdrawal</button>`:""}</div>`
  : `<div class="card" style="text-align:center"><div class="card-h"><h3>${icon("qr","sm")} Equipment QR</h3><span class="pill ${e.qrStatus==="declined"||e.qrStatus==="withdrawn"?"bad":"slate"}">${esc(label)}</span></div>
    <p class="hint">No QR exists for this unit. One is created only after the homeowner signs to approve sharing this equipment's information, so nothing is placed on their equipment without their knowledge.</p>
    ${can.qr()?`<button class="btn primary mt" id="rq">${icon("pencil","sm")} ${e.qrStatus==="declined"||e.qrStatus==="withdrawn"?"Ask again":"Get homeowner signature"}</button>`:""}</div>`);
  $("#rq", card)?.addEventListener("click", ()=>qrConsentForm(e));
  $("#wd", card)?.addEventListener("click", async ()=>{
    if (!(await confirmBox("Deactivate QR?", "Use this when the homeowner asks to stop sharing. The QR stops working right away and the withdrawal is recorded.", "Deactivate", true))) return;
    await saveQr(e, {qrStatus:"withdrawn", qrToken:null, qrConsent:{result:"withdrawn", method:qc.method||"Signature", policyVersion:QR_CONSENT_VERSION, at:now(), recordedBy:me()?.name||""}}, {method:qc.method||"Signature", result:"withdrawn"});
    toast("QR deactivated."); render();
  });
  if (active) setTimeout(()=>{ const box = $("#qrbox", card); if (!box) return; if (window.QRCode) new QRCode(box, {text:"saferoutine://equipment/"+e.qrToken, width:170, height:170}); else box.textContent = e.qrToken; }, 0);
  return card;
}
function newToken(){ const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, b=>b.toString(16).padStart(2,"0")).join(""); }
async function saveQr(e, patch, rec){
  Object.assign(e, patch); await writeDoc("equipment/"+e.id, patch, true);
  const r = Object.assign({type:"qr_activation", equipmentId:e.id, policyVersion:QR_CONSENT_VERSION, at:now(), by:me()?.name||""}, rec);
  const id = await addDoc("consent", r); S.consent.push(Object.assign({id:id||uid("c")}, r));
}
function qrConsentForm(e){
  const text = `By signing, you allow information about your ${e.type||"equipment"} (${e.manufacturer||""} ${e.model||""}) to be kept and shared in SafeRoutine: make, model, serial number, service history and photos. A QR code placed on the equipment opens that private page. Only you, the service company that placed it, and technicians that company authorizes can open it. You can withdraw your approval at any time and the QR will stop working. If you say no, nothing is shared, no QR is placed, and the work continues as normal.`;
  const b = el(`<div>${modalHead("Homeowner signature", "Approval to share this equipment's information")}
    <div class="note">${esc(text)}</div>
    <div class="field mt"><label>Homeowner full name *</label><input id="nm" autocomplete="off"></div>
    <div class="field mt"><label>Sign here *</label><canvas class="sig" id="pad" width="600" height="200"></canvas><div class="row between"><span class="hint">Sign with a finger or mouse.</span><button type="button" class="btn ghost sm" id="clr">Clear</button></div></div>
    <label class="check mt"><input type="checkbox" id="ag"><span>I understand and agree to share this equipment's information as described above.</span></label>
    <div class="callout warn mt">${icon("alert","sm")}<div>Draft wording. A lawyer must review the text and the e-signature method (Ontario / Canada) before real use.</div></div>
    <div class="mf"><button class="btn" id="no">Homeowner declines</button><button class="btn primary" id="yes">${icon("check","sm")} Approve and sign</button></div></div>`);
  showModal(b, {wide:true});
  const cv = $("#pad", b), ctx = cv.getContext("2d"); ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0c1830";
  let drawing = false, inked = false;
  const pos = ev=>{ const r = cv.getBoundingClientRect(); return [(ev.clientX-r.left)*cv.width/r.width, (ev.clientY-r.top)*cv.height/r.height]; };
  cv.addEventListener("pointerdown", ev=>{ drawing = true; inked = true; cv.setPointerCapture(ev.pointerId); const [x,y] = pos(ev); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y); ctx.stroke(); });
  cv.addEventListener("pointermove", ev=>{ if (!drawing) return; const [x,y] = pos(ev); ctx.lineTo(x,y); ctx.stroke(); });
  ["pointerup","pointercancel","pointerleave"].forEach(t=>cv.addEventListener(t, ()=>drawing=false));
  $("#clr", b).addEventListener("click", ()=>{ ctx.clearRect(0,0,cv.width,cv.height); inked = false; });
  $("#no", b).addEventListener("click", async ()=>{
    await saveQr(e, {qrStatus:"declined", qrToken:null, qrConsent:{result:"declined", method:"Signature", policyVersion:QR_CONSENT_VERSION, at:now(), recordedBy:me()?.name||""}}, {method:"Signature", result:"declined"});
    closeOverlay(); toast("Recorded: homeowner declined. Nothing is shared and no QR was created."); render();
  });
  $("#yes", b).addEventListener("click", async ()=>{
    const name = $("#nm", b).value.trim();
    if (!name) return toast("Type the homeowner's full name.","bad");
    if (!inked) return toast("The homeowner needs to sign in the box.","bad");
    if (!$("#ag", b).checked) return toast("Tick the box to confirm.","bad");
    await saveQr(e, {qrStatus:"active", qrToken:newToken(), qrConsent:{result:"approved", method:"Signature", policyVersion:QR_CONSENT_VERSION, signedName:name, signatureImage:cv.toDataURL("image/png"), at:now(), requestedBy:me()?.name||""}}, {method:"Signature", result:"approved", signedName:name});
    closeOverlay(); toast("Signed. The QR is now active."); render();
  });
}

function renderArchive(){
  const own = isField(); const f = S.ui.archive;
  const base = visibleJobs().filter(isClosed);
  const techs = [...new Set(base.map(j=>j.technicianId).filter(Boolean))];
  const wrap = el(`<div><div class="pagehead"><div><h1>${own?"My archive":"Archive"}</h1><div class="sub">Closed jobs. Read-only and private to the trade team.</div></div><button class="btn" id="csv">${icon("download","sm")} Export CSV</button></div>
    <div class="card"><div class="grid g4" style="align-items:end">
      <div class="field"><label>Search</label><input id="q" value="${esc(f.q)}" placeholder="Ref, customer, address"></div>
      <div class="field"><label>From</label><input type="date" id="from" value="${esc(f.from)}"></div>
      <div class="field"><label>To</label><input type="date" id="to" value="${esc(f.to)}"></div>
      <div class="field"><label>Job type</label><select id="type"><option value="">All types</option>${JOB_TYPES.map(t=>`<option value="${t}" ${f.type===t?"selected":""}>${cap(t)}</option>`).join("")}</select></div>
      ${own?"":`<div class="field"><label>Technician</label><select id="tech"><option value="">Everyone</option>${techs.map(t=>`<option value="${t}" ${f.tech===t?"selected":""}>${esc(userById(t)?.name||t)}</option>`).join("")}</select></div>`}
      <div><button class="btn ghost" id="clr">Clear filters</button></div></div></div>
    <div class="row between mt" style="margin-bottom:10px"><span class="hint" id="cnt"></span></div><div id="res"></div></div>`);
  let current = [];
  const draw = ()=>{
    const q = f.q.trim().toLowerCase();
    current = base.filter(j=>{
      if (q && ![j.refNumber, customerById(j.customerId)?.name, j.siteAddress].filter(Boolean).some(v=>String(v).toLowerCase().includes(q))) return false;
      if (f.tech && j.technicianId!==f.tech) return false;
      if (f.type && j.jobType!==f.type) return false;
      const d = ts(j.scheduledAt);
      if (f.from && d < ts(f.from+"T00:00:00")) return false;
      if (f.to && d > ts(f.to+"T23:59:59")) return false;
      return true;
    }).sort(byTimeDesc);
    $("#cnt", wrap).textContent = `${current.length} closed job(s)`;
    const r = $("#res", wrap); r.innerHTML = ""; r.appendChild(jobTable(current, base.length?"No closed jobs match these filters.":"No closed jobs yet."));
  };
  [["#q","q"],["#from","from"],["#to","to"],["#type","type"],["#tech","tech"]].forEach(([s,k])=>{ const n = $(s, wrap); if (n) n.addEventListener(n.tagName==="SELECT"||n.type==="date"?"change":"input", ()=>{ f[k] = n.value; draw(); }); });
  $("#clr", wrap).addEventListener("click", ()=>{ S.ui.archive = {q:"",from:"",to:"",tech:"",type:""}; render(); });
  $("#csv", wrap).addEventListener("click", ()=>{
    const rows = [["Ref","Scheduled","Closed","Customer","Address","Technician","Type","Priority","Approved by"]].concat(current.map(j=>[j.refNumber, j.scheduledAt, j.closedAt||"", customerById(j.customerId)?.name||"", j.siteAddress, userById(j.technicianId)?.name||"", j.jobType, j.priority, j.review?.by||""]));
    downloadFile(`saferoutine-archive-${new Date().toISOString().slice(0,10)}.csv`, toCSV(rows));
  });
  draw(); return wrap;
}

async function decideExpense(job, item, status, msg){

function renderReports(){

  const avgH = durations.length ? (durations.reduce((a,b)=>a+b,0)/durations.length) : null;
  const reviewed = S.jobs.filter(j=>j.review); const sentBackJobs = S.jobs.filter(j=>(j.sendBacks||0)>0);
  const firstPass = reviewed.length ? Math.round((reviewed.length - sentBackJobs.filter(j=>j.review).length)/reviewed.length*100) : null;

    <div class="card"><div class="card-h"><h3>Closed jobs by technician</h3></div><div id="bt"></div></div>

  const hb = (rows)=>{ const m = Math.max(1, ...rows.map(r=>r[1])); return rows.length ? rows.map(([l,n])=>`<div class="hbar"><span>${esc(l)}</span><div class="track"><div style="width:${n/m*100}%"></div></div><span class="mono">${n}</span></div>`).join("") : `<div class="hint">No data yet.</div>`; };

function auditRows(){

/* ------------------------------ FEEDBACK ------------------------------ */
function renderFeedback(){
  const wrap = el(`<div><div class="pagehead"><div><h1>Feedback</h1><div class="sub">Ideas and problems with the app. Separate from job notes.</div></div><button class="btn primary" id="add">${icon("plus","sm")} New</button></div><div class="stack" id="l"></div></div>`);
  $("#add", wrap).addEventListener("click", ()=>{
    const b = el(`<form>${modalHead("Send feedback")}<div class="field"><label>Type</label><select name="category"><option>Missing field</option><option>Workflow</option><option>Bug</option><option>Idea</option></select></div><div class="field mt"><label>Details *</label><textarea name="text" required></textarea></div><div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Send</button></div></form>`);
    showModal(b);
    b.addEventListener("submit", async e=>{ e.preventDefault(); const rec = {category:b.category.value, text:b.text.value.trim(), status:"New", by:me()?.name||ROLE_LABELS[S.role], byId:S.userId, at:now()}; const id = await addDoc("feedback", rec); S.feedback.push(Object.assign({id:id||uid("fb")}, rec)); await notify(`New feedback from ${rec.by}.`, {toRole:"owner"}); closeOverlay(); toast("Thanks — sent."); render(); });
  });
  const list = S.feedback.slice().sort((a,b)=>ts(b.at)-ts(a.at));
  if (!list.length) $("#l", wrap).appendChild(el(`<div class="card">${emptyState("message","No feedback yet.")}</div>`));
  list.forEach(f=>{
    const st = f.status||"New"; const cls = st==="Implemented"?"ok":st==="Planned"?"info":["Declined","Duplicate"].includes(st)?"slate":"warn";
    const c = el(`<div class="card"><div class="row between wrap"><b>${esc(f.category||"General")}</b>${S.role==="owner"?`<select class="in" style="width:auto">${FEEDBACK_STATUSES.map(s=>`<option ${/^under/i.test(st)&&/^Under/.test(s)||s===st?"selected":""}>${s}</option>`).join("")}</select>`:`<span class="pill ${cls}">${esc(st)}</span>`}</div><p style="margin-top:6px">${esc(f.text)}</p><div class="hint mt">${esc(f.by)} · ${esc(ago(f.at))}</div></div>`);
    $("select", c)?.addEventListener("change", async e=>{ f.status = e.target.value; await writeDoc("feedback/"+f.id, {status:f.status}, true); toast("Status updated."); renderSide(); });
    $("#l", wrap).appendChild(c);
  });
  return wrap;
}

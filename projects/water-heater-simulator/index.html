 tank:{n:"Steel tank (glass-lined)",ar:"التانكي حديد ومبطّن زجاج من جوة حتى ما يزنجر. هو نفسه المبادل الحراري.",
  t:"Welded pressure vessel rated for a working pressure of 150 psi (1035 kPa). The inner wall is often 'glass-lined' (enamel) against corrosion. The tank IS the heat exchanger: the base above the burner is the primary surface, the centre flue walls are the secondary surface. Minerals drop out of hot water and settle on the bottom, insulating it.",r:"Module 18, p.18-8"},
 jacket:{n:"Jacket & insulation",ar:"الغلاف الخارجي والعازل يقللون ضياع الحرارة.",
  t:"The steel tank is wrapped in insulation covered by a sheet-metal casing. Conventional vent heaters are usually only 60–75% efficient: atmospheric burner, constant pilot, and off-cycle losses as warm air keeps rising up the vent.",r:"p.18-8, 18-9"},
 flue:{n:"Centre flue",ar:"البوري اللي بنص التانكي، منه يطلع الدخان لفوك ويسخّن الماي من الجوانب.",
  t:"Flue gases rise vertically through the centre flue inside the water. Flue gas leaving a conventional heater is 400–700°F (205–370°C) depending on heat-exchanger condition and water temperature.",r:"p.18-7, 18-9"},
 baffle:{n:"Baffle (turbulator)",ar:"الشريط الملوّي يبطّئ الدخان حتى يلحك يعطي حرارته للماي.",
  t:"Inserted in the centre flue to slow the flue gases and make them scrub the flue walls, improving heat transfer. Heat stains with no spillage → pull the baffle and check for soot.",r:"p.18-8, 18-87"},
 burner:{n:"Main burner",ar:"الشعلة الرئيسية لازم تكون زرگة ومنتظمة. إذا برتقالية = وساخة.",
  t:"Atmospheric burner with fixed air shutter. Smaller inputs use a ring burner; over 100,000 Btuh usually 3+ ribbon burners. Air is drawn in at the base, so dust burns on it (carbon), rust falls from the flue and condensation can drip on it. Flame must be blue and even at all ports; orange/black spots = clean burner and chamber.",r:"p.18-16"},
 pilot:{n:"Pilot & thermocouple",ar:"البايلوت يسخّن الثيرموكبل، والثيرموكبل يمسك صمام الأمان مفتوح. إذا طفى البايلوت ينسد الغاز.",
  t:"Constant pilot heats a thermocouple (or thermopile) that holds the primary SAFETY valve open while a pilot flame exists. Lighting: follow the label exactly – wait 5 minutes with the gas valve OFF, and put the flame at the pilot outlet BEFORE depressing the knob. Sealed (FVIR) heaters use a piezo igniter: one spark per press.",r:"p.18-17, 18-21"},
 gasvalve:{n:"Combination gas valve (Unitrol)",ar:"صمام الغاز المركّب: سكّة يدوية + منظّم ضغط + صمام أمان + ثيرموستات + ECO، كلها بقطعة وحدة وبدون كهرباء.",
  t:"Combines: manual shut-off · main burner regulator (some models) · safety valve fed by the pilot · thermostat + main gas valve (mechanical, or millivolt solenoid on newer) · high-limit ECO · on newer valves a piezo and diagnostic LED. Max inlet usually 14\" w.c.; outlet per rating plate (usually 3.5\" w.c., not always). Many valves (White Rodgers, Honeywell) have no pressure adjustment – wrong pressure means replace the valve. Robertshaw Unitrol: clockwise raises pressure.",r:"p.18-18 to 18-21"},
 probe:{n:"Thermostat (rod & tube) + ECO",ar:"الراد يتمدد ويه الحرارة ويسكّر الغاز. فرق التشغيل حوالي 20 فهرنهايت. الـ ECO يقطع على 195.",
  t:"Rod-and-tube sensor in the water (plastic sleeve against corrosion). Snap action makes the valve fully open or fully closed. Differential between shut-off and restart is usually 20°F (11°C). The ECO (energy cut-off) shuts the burner if water reaches an unsafe temperature, usually 195°F (91°C); on constant-pilot systems it is wired in SERIES with the thermocouple. If built into the rod-and-tube thermostat it is single-use → replace the gas valve.",r:"p.18-19, 18-20, 18-22"},
 dip:{n:"Dip tube",ar:"أنبوب بلاستك ينزّل الماي البارد لجوة التانكي، قرب الثيرموستات، وما يخليه يطلع ويه الحار.",
  t:"Directs incoming cold water to the bottom (near the thermostat) for a prompt burner cycle and pushes hot water out the top. Often has an anti-siphon hole in the top 6\" and jets at the bottom. If it breaks: cold water goes straight out the hot outlet – tank hot, burner may not come on, but no hot water at taps. Never heat the cold inlet with a torch at the tank – solder off the tank first.",r:"p.18-13, 18-14"},
 anode:{n:"Sacrificial anode",ar:"قضيب المغنيسيوم يتآكل بدل التانكي. ريحة بيض خايس بالماي الحار = تفاعل الأنود.",
  t:"Magnesium rod gives up electrons more easily than steel, protecting the tank. Inspect every 1–3 years; replace before 75% loss. Lime coating stops it working. Rotten-egg smell needs 4 factors (sulfate, low oxygen, sulfate-reducing bacteria, active hydrogen from the anode) – fix with a less active anode + chlorinating tank and lines. Powered anodes must always be powered.",r:"p.18-11, 18-12"},

  t:"Rod-and-tube temperature element plus spring pressure valve: opens above 210°F or 150 psig. Operate the lever at least once a year; if no water flows, replace immediately. Remove and inspect every 3 years. Discharge causes: thermal expansion, supply over 75 psi, setting too high, stacking. A plugged T&P + failed controls → tank rupture, water flashes to steam (1,700× expansion).",r:"p.18-14, 18-15"},
 discharge:{n:"T&P discharge pipe",ar:"بوري التصريف نفس قياس مخرج الصمام، بدون سنّ وبدون صمام، ونهايته قريبة من الگاع.",
  t:"Same size as the valve outlet; ends within 12\" (300 mm) of the floor with the outlet visible; no valves and no threads on the end (so nobody caps it). Never connect it directly to a drain. NEVER PLUG A DRIPPING RELIEF VALVE.",r:"p.18-14, 18-86, 18-91 · B149.1 Cl. 7.27.2"},
 drain:{n:"Drain valve",ar:"حنفية التصريف للغسيل. المصنّع يوصي تغسل التانكي كل 6 أشهر.",
  t:"Used for flushing, cleaning or draining. Most manufacturers recommend flushing every six months; rarely done, so lime bakes on the bottom. A long-unused drain may clog with sediment. Popping/gurgling = lime build-up → flush (chemical flush per manufacturer: ADD ACID TO WATER).",r:"p.18-10, 18-85"},
 drafthood:{n:"Draft hood",ar:"غطاء السحب: إذا انسد الفنت، الدخان يطلع للغرفة بدل ما يخنق الشعلة.",
  t:"Four functions: (1) lets flue gas spill into the room if the vent is blocked or slow to start – safer than smothering the flame / roll-out; (2) baffle stops a backdraft entering the combustion chamber; (3) neutralizes stack action; (4) lets room air keep the vent warm in the off-cycle. Above the draft hood should be 250–350°F. Heat damage or corrosion here = spillage has happened → smoke test. A spill switch may shut the burner (wired with the thermocouple or safety circuit).",r:"p.18-9"},
 vent:{n:"Vent connector",ar:"بوري الفنت لازم بنفس قطر الدرافت هود، و3 براغي، وميلان صحيح.",
  t:"Vent pipe size should match the draft-hood diameter; secure to the draft hood with 3 screws. Back-pitched connectors, quick turns at the draft hood, or storing things on top of the heater cause poor venting. Water heaters usually have the weakest venting action in the house.",r:"p.18-9, 18-88"},
 cold:{n:"Cold inlet & shut-off valve",ar:"لازم سكّة على الماي البارد حسب كود السباكة.",
  t:"The cold-water inlet must have a shut-off valve (Plumbing Code) to isolate the heater for service. Residential heaters are usually 3/4\" connections. A G2 may connect/disconnect water piping essential to the appliance only, not other plumbing (O. Reg. 215/01).",r:"p.18-13, 18-64, 18-77"},
 hot:{n:"Hot outlet – dielectric nipple & heat trap",ar:"النبل العازل يمنع التآكل الكهربائي، والهيت تراب يمنع الحرارة تهرب للبوري.",
  t:"Dielectric nipples electrically separate the steel tank from the piping. Heat traps stop convective heat loss into the piping but restrict flow and can stick closed from lime – check with the manufacturer before removing.",r:"p.18-12"},
 gaspipe:{n:"Gas supply, shut-off & drip leg",ar:"خط الغاز ويه سكّة يدوية وبوري الترسبات (dripleg).",
  t:"Appliance manual shut-off and dripleg on the drop to the gas valve (shown on the cutaway diagram). Inlet pressure to the valve is normally max 14\" w.c.",r:"p.18-7, 18-20"},
 arrestor:{n:"FVIR flame arrestor, air screen & thermal switch",ar:"نظام FVIR: يمنع اشتعال الأبخرة تطلع برّة. إذا انسدت الشبكة بالغبار، المفتاح الحراري يقطع الغاز.",
  t:"Flammable Vapour Ignition Resistant (2007–2010 on): air enters only through a flame arrestor under the burner; sealed burner door; thermal cut-off in the chamber shuts pilot and burner on excessive heat (vapour fire, flame roll from a lint-clogged screen, or venting problem). After a vapour event most makers say replace the heater. Clean the air screen regularly.",r:"p.18-24, 18-25"}
};

function mat(color,o={}){
  const m=new THREE.MeshStandardMaterial(Object.assign({color,roughness:.55,metalness:.25},o));
  if(o.clip){delete m.clip;m.clippingPlanes=clips;m.clipIntersection=true;m.side=THREE.DoubleSide;clipMats.push(m);}

}
function add(geo,m,part,pos,rot){
  const mesh=new THREE.Mesh(geo,m);
  if(pos)mesh.position.set(pos[0],pos[1],pos[2]);
  if(rot)mesh.rotation.set(rot[0]||0,rot[1]||0,rot[2]||0);
  if(part){mesh.userData.part=part;pickables.push(mesh);}
  scene.add(mesh);return mesh;
}
function cyl(a,b,r,color,part,m){

function resetNormal(){Object.assign(S,{T:Array(NL).fill(140),set:140,gas:true,knob:'ON',pilot:true,tc:1,holding:false,purge:0,burner:false,tap:false,inlet:true,eco:false,tpOpen:false,f:{},msg:''});for(let i=0;i<NL;i++)S.T[i]=128+i*1.2;}
function coldStart(){resetNormal();S.T=Array(NL).fill(50);S.gas=false;S.knob='OFF';S.pilot=false;S.tc=0;startPurge();}
const PURGE=15; // real seconds shown as 5:00 → 0:00, independent of time speed
function startPurge(){S.purge=PURGE;}
const valveOff=()=>S.knob==='OFF'||!S.gas; // purge only counts while gas to the pilot is shut
function purgeTick(sec){if(valveOff())S.purge=Math.max(0,S.purge-sec);} // paused (not reset) while knob is PILOT/ON
resetNormal();

const thermoT=()=>S.T[1];
function safetyHeld(){return S.tc>.6&&!S.f.tc&&!S.eco&&!S.f.fvir;}
function outletT(){ if(!S.tap) return null; if(!S.inlet) return null;
  return S.T[NL-1]; }

function step(dt){
  S.simT+=dt;const wasPilot=S.pilot;
  const gasOK=S.gas&&S.knob!=='OFF';
  // pilot & thermocouple
  if(S.holding&&gasOK&&S.knob==='PILOT'&&!S.f.fvir){S.pilot=true;}
  if(S.pilot&&!S.holding&&!safetyHeld()){S.pilot=false;}
  if(!gasOK)S.pilot=false;
  if(wasPilot&&!S.pilot)startPurge();
  // burner (thermostat)
  const calling=S.f.stuck?true:(S.burner?thermoT()<S.set:thermoT()<=S.set-20);
  S.burner=S.pilot&&safetyHeld()&&S.knob==='ON'&&gasOK&&calling;
  const Q=S.burner?(40000/3600)*(S.f.sed?.4:.7):0;
  S.T[0]+=Q*dt/27.8;
  if(S.f.spill&&S.burner) S.T[0]-=Q*dt/27.8*.15;
  // standby loss
  for(let i=0;i<NL;i++)S.T[i]-=(S.T[i]-65)*6e-6*dt*(S.pilot?1:1.2);
  // draw
  if(S.tap&&S.inlet){const f=Math.min(.4,.0125*dt);
    if(S.f.dip){S.T[NL-1]+=(S.cold-S.T[NL-1])*f*.5;} // broken dip tube: cold short-circuits top → outlet
    else{for(let i=NL-1;i>0;i--)S.T[i]+=(S.T[i-1]-S.T[i])*f;S.T[0]+=(S.cold-S.T[0])*f;}}
  // convection + diffusion
  for(let k=0;k<2;k++)for(let i=0;i<NL-1;i++){const a=S.T[i],b=S.T[i+1];
    if(a>b+.05&&!(S.f.dip&&i===NL-2)){const d=(a-b)*Math.min(.5,.25*dt);S.T[i]-=d;S.T[i+1]+=d;}
    else{const d=(a-b)*Math.min(.2,.0008*dt*(S.f.dip&&i===NL-2?.25:1));S.T[i]-=d;S.T[i+1]+=d;}}
  // ECO + T&P
  if(thermoT()>=195&&!S.eco){S.eco=true;S.msg='ECO opened at 195°F — single-use: gas valve must be replaced.';}
  const mx=Math.max(...S.T);S.tpOpen=mx>=210||S.f.tp;
  if(mx>=210)for(let i=NL-3;i<NL;i++)S.T[i]=Math.min(S.T[i],209);
}

const D={active:null,log:[],done:false,pick:null,score:0,count:0,correct:0};
function startScenario(){
  resetNormal();const s=SC[Math.floor(Math.random()*SC.length)];D.active=s;D.log=[];D.done=false;D.pick=null;
  const set=(arr)=>arr.forEach(([k,v])=>S.f[k]=v);
  switch(s.id){
   case 'tc':set([['tc',1]]);S.pilot=false;S.tc=0;S.T=Array(NL).fill(70);break;
   case 'eco':S.eco=true;S.pilot=false;S.tc=0;S.T=Array(NL).fill(95);break;
   case 'dip':set([['dip',1]]);S.tap=true;S.T[NL-1]=95;break;
   case 'tp':set([['tp',1]]);break;
   case 'sed':set([['sed',1]]);S.T=S.T.map(t=>t-40);break;
   case 'spill':set([['spill',1]]);S.T=S.T.map(t=>t-35);break;
   case 'anode':set([['anode',1]]);break;
   case 'hot':S.set=160;S.T=Array(NL).fill(156);break;
   case 'fvir':set([['fvir',1]]);S.pilot=false;S.tc=0;S.T=Array(NL).fill(60);break;
   case 'inlet':S.inlet=false;S.tap=true;break;

}

  if(!D.active)return `<h2>Diagnose a service call</h2>
  <p>You get a customer complaint. Run tests like on a real call, then choose your diagnosis. Fewer tests = higher score. Every scenario comes from G2 Module 18 troubleshooting.</p>
  <div class="ar">مثل الشغل الحقيقي: اسمع الزبون، سوّي فحوصات، وبعدين گول شنو العطل.</div>
  ${D.count?`<div class="goodbox">Score so far: ${D.correct}/${D.count} correct · ${D.score} pts</div>`:''}
  <button class="btn p" id="new" style="width:100%;padding:13px">Start a service call</button>`;
  const s=D.active;
  let h=`<h2>Service call</h2><div class="warnbox">Customer: ${s.c}</div><h3>Tests</h3><div class="row">`+
   Object.keys(TESTS).map(k=>`<button class="btn" data-t="${k}" ${D.done?'disabled':''}>${TESTS[k]}</button>`).join('')+'</div>';
  if(D.log.length)h+='<div class="log">'+D.log.map(([k,r])=>`<div><b>${TESTS[k]}:</b> ${r}</div>`).join('')+'</div>';
  if(!D.done){h+=`<h3>Your diagnosis</h3><div class="row">${DXLIST.map((d,i)=>`<button class="btn ${D.pick===i?'sel':''}" data-d="${i}">${d}</button>`).join('')}</div>
   <button class="btn p" id="submit" ${D.pick==null?'disabled':''} style="width:100%;padding:12px">Submit diagnosis</button>`;}
  else{const ok=DXLIST[D.pick]===s.dx;
   h+=`<div class="${ok?'goodbox':'badbox'}"><b>${ok?'Correct!':'Not quite.'}</b> Answer: <b>${s.dx}</b><br>${s.fix}<div class="ref">Book: G2 ${s.ref}</div></div>
   <button class="btn p" id="new" style="width:100%;padding:12px">Next service call</button> <button class="btn" id="quit" style="width:100%;margin-top:6px">Back to normal heater</button>`;}
  return h;
}
function render(){
  S.holding=false;holdPid=null;holdKey=false; // the hold button is about to be rebuilt: never leave a hold stuck
  if(mode==='learn')panel.innerHTML=learnHTML();
  else if(mode==='operate')panel.innerHTML=operateHTML();
  else if(mode==='diagnose')panel.innerHTML=diagnoseHTML();
  else panel.innerHTML=CODE_HTML;
  wire();if(mode==='operate')liveOperate();
}
let holdPid=null,holdKey=false;
function release(e){if(!S.holding)return;if(e&&e.pointerId!=null&&holdPid!=null&&e.pointerId!==holdPid)return;
  // decide now (same rule step() applies next frame), not from S.pilot later
  const holds=S.pilot&&safetyHeld()&&S.gas&&S.knob==='PILOT';
  S.holding=false;holdPid=null;holdKey=false;
  setMsg(holds?'Pilot stayed lit. Now turn the knob to ON.':'Pilot went out when you released the knob — thermocouple not hot enough, or a safety fault. Turn the knob OFF and wait out the 5 min again.');}
addEventListener('pointerup',release);addEventListener('pointercancel',release);addEventListener('blur',()=>release());
document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});
addEventListener('keyup',e=>{if(holdKey&&(e.key===' '||e.key==='Enter'))release();});
function wire(){
  const q=s=>panel.querySelector(s),qa=s=>panel.querySelectorAll(s);
  qa('[data-p]').forEach(b=>b.onclick=()=>selectPart(b.dataset.p));
  if(q('#back'))q('#back').onclick=()=>selectPart(null);
  if(q('#tour'))q('#tour').onclick=()=>{const k=Object.keys(PARTS);selectPart(k[(k.indexOf(sel)+1)%k.length]);};
  if(q('#cut'))q('#cut').onclick=()=>{cutOn=!cutOn;clipMats.forEach(m=>{m.clippingPlanes=cutOn?clips:[];m.needsUpdate=true;});render();};
  if(q('#gas'))q('#gas').onclick=()=>{S.gas=!S.gas;if(!S.gas&&S.pilot){S.pilot=false;startPurge();}render();};
  qa('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(k==='OFF'&&S.pilot){startPurge();S.pilot=false;} // pilot out → full 5 min; otherwise the paused countdown just resumes
    if(k==='ON'&&!S.pilot)S.msg='Knob is ON but pilot is out — no gas will flow to the burner.';else S.msg='';
    S.knob=k;render();});
  const L=q('#light');
  if(L){const down=e=>{e.preventDefault();if(S.holding)return;
      if(S.purge>0){setMsg(valveOff()?'Not yet — gas may still be in the chamber.':'Turn the gas valve knob to OFF — the 5 minutes only count with the valve OFF.');return;}
      if(!S.gas){setMsg('Open the appliance gas shut-off first.');return;}
      if(S.knob!=='PILOT'){setMsg('Turn the knob to PILOT first, then depress it.');return;}
      if(S.f.fvir){setMsg('Spark, but no pilot — gas is cut (FVIR thermal switch open).');return;}
      holdKey=e.pointerId==null;if(!holdKey){holdPid=e.pointerId;try{L.setPointerCapture(e.pointerId);}catch(_){}}
      S.holding=true;setMsg('Holding knob down… keep holding until thermocouple is hot.');};
    L.addEventListener('pointerdown',down);L.addEventListener('lostpointercapture',release);L.oncontextmenu=e=>e.preventDefault();
    L.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)down(e);}});}
  if(q('#set'))q('#set').oninput=e=>{S.set=+e.target.value;q('#setv').textContent=S.set+'°F';};
  if(q('#stuck'))q('#stuck').onclick=()=>{S.f.stuck=!S.f.stuck;setMsg(S.f.stuck?'Thermostat stuck calling: burner will not shut off. Watch the ECO trip at 195°F (before the T&P opens at 210°F). Speed up time.':'');render();};
  if(q('#tap'))q('#tap').onclick=()=>{S.tap=!S.tap;render();};
  if(q('#inlet'))q('#inlet').onclick=()=>{S.inlet=!S.inlet;render();};
  qa('[data-s]').forEach(b=>b.onclick=()=>{S.speed=+b.dataset.s;render();});
  if(q('#cold'))q('#cold').onclick=()=>{coldStart();S.msg='New install: tank full of cold water. Open the gas shut-off but leave the knob OFF while the 5 min counts down (below). Then turn the knob to PILOT and light.';render();};
  if(q('#norm'))q('#norm').onclick=()=>{resetNormal();render();};
  if(q('#new'))q('#new').onclick=startScenario;
  if(q('#quit'))q('#quit').onclick=()=>{endScenario();render();};
  qa('[data-t]').forEach(b=>b.onclick=()=>{const k=b.dataset.t;if(D.log.find(x=>x[0]===k))return;
    D.log.push([k,(D.active.r[k])||DEF[k]]);render();const lg=panel.querySelector('.log');if(lg)lg.lastElementChild.scrollIntoView({block:'center'});});
  qa('[data-d]').forEach(b=>b.onclick=()=>{D.pick=+b.dataset.d;render();});
  if(q('#submit'))q('#submit').onclick=()=>{D.done=true;D.count++;
    if(DXLIST[D.pick]===D.active.dx){D.correct++;D.score+=Math.max(20,100-Math.max(0,D.log.length-3)*10);}render();};
}

/* picking + highlight */
function selectPart(k){
  sel=k;pickables.forEach(m=>{if(m.material.emissive)m.material.emissive.setHex(m.userData.part===k?0x7a3a00:0x000000);});
  if(mode!=='learn'){if(!k)return; // show info in place; don't leave Operate/Diagnose (keeps scenario state)
    const p=PARTS[k];let b=panel.querySelector('#pinfo');
    if(!b){b=document.createElement('div');b.id='pinfo';b.className='goodbox';panel.prepend(b);}
    b.innerHTML=`<button class="btn" style="float:right;padding:3px 9px">✕</button><b>${p.n}</b><div>${p.t}</div><div class="ar">${p.ar}</div><div class="ref">Book: G2 ${p.r}</div>`;
    b.querySelector('button').onclick=()=>b.remove();panel.scrollTop=0;return;}
  render();
}
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();const downs=new Map();let multi=false;
canvas.addEventListener('pointerdown',e=>{downs.set(e.pointerId,[e.clientX,e.clientY]);if(downs.size>1)multi=true;});
canvas.addEventListener('pointercancel',e=>{downs.delete(e.pointerId);if(!downs.size)multi=false;});
canvas.addEventListener('pointerup',e=>{const d0=downs.get(e.pointerId);downs.delete(e.pointerId);const wasMulti=multi;if(!downs.size)multi=false;
  if(!d0||wasMulti)return; // pinch / multi-touch is not a tap
  const dx=Math.abs(e.clientX-d0[0])+Math.abs(e.clientY-d0[1]);if(dx>8)return;
  const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr,camera);
  const inCut=h=>cutOn&&h.object.material.clippingPlanes&&h.object.material.clippingPlanes.length&&h.point.x<0&&h.point.z>0;
  const all=ray.intersectObjects(pickables.filter(m=>m.visible),false),hits=all.filter(h=>!inCut(h));
  if(!hits.length)return;
  // see through transparent water (part 'tank') but stop at the first opaque surface: nothing behind an opaque wall is picked
  const sh=h=>['tank','jacket'].includes(h.object.userData.part),opq=h=>!(h.object.material.transparent&&h.object.material.opacity<1);
  let pick=hits.find(opq)||hits[0];
  // a fitting flush with / poking through a shell may tie with it: prefer it only if within .08 of the shell hit
  if(sh(pick)&&opq(pick)){const n=hits.find(h=>!sh(h)&&h.distance>=pick.distance&&h.distance-pick.distance<.08);if(n)pick=n;}
  selectPart(pick.object.userData.part);});

/* =========================================================
   LOOP
   ========================================================= */
function tcol(t){const k=Math.min(1,Math.max(0,(t-50)/(170-50)));return new THREE.Color().setHSL(.62*(1-k),.85,.5);}
let fitted=false;
function resize(){const w=innerWidth,h=innerHeight;if(renderer)renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.setViewOffset(w,h,0,h*.2,w,h);camera.updateProjectionMatrix();
  if(!fitted){fitted=true;const a=Math.min(1.2,w/h);const dist=Math.max(11,11/Math.pow(a,.9));
    const dir=new THREE.Vector3(-6.2,1.6,7.4).normalize();camera.position.copy(controls.target).add(dir.multiplyScalar(dist));
    controls.maxDistance=dist*1.6;}}
addEventListener('resize',resize);resize();
let last=performance.now(),uiT=0,clock=0;
function loop(now){
  const el=Math.max(0,(now-last)/1000),rdt=Math.min(.1,el);last=now;clock+=rdt;
  purgeTick(el); // purge wait runs on the wall clock (uncapped: time in a hidden tab with the valve OFF counts too)
  // thermocouple heats in real time
  if(S.pilot)S.tc=Math.min(1,S.tc+rdt/3);else S.tc=Math.max(0,S.tc-rdt/4);
  let sdt=rdt*S.speed;while(sdt>0){const d=Math.min(1,sdt);step(d);sdt-=d;}
  // visuals
  layers.forEach((m,i)=>m.material.color.copy(tcol(S.T[i])));
  flames.visible=S.burner;flameGlow.intensity=S.burner?1.2:0;
  flames.children.forEach((f,i)=>{f.scale.y=.8+.35*Math.sin(clock*18+i*1.7);f.material.color.setHex(S.f.spill?(i%2?0xffa040:0x4aa8ff):(i%2?0x4aa8ff:0x6fc0ff));});
  pilotFlame.visible=S.pilot;pilotFlame.scale.y=.9+.2*Math.sin(clock*20);
  ledM.color.setHex(S.burner?0x22ff66:(S.pilot?0x1a8a3a:0x331111));
  knob.rotation.z={OFF:0,PILOT:Math.PI/2,ON:Math.PI}[S.knob];knob.position.z=S.holding?.24:.27;
  dial.rotation.z=(S.set-100)/60*Math.PI*1.4;
  gasShut.rotation.y=S.gas?0:Math.PI/2;coldHandle.rotation.y=S.inlet?0:Math.PI/2;
  dipFull.visible=!S.f.dip;dipBroken.visible=!!S.f.dip;
  sediment.visible=!!S.f.sed;
  anodeRod.scale.set(S.f.anode?.45:1,1,S.f.anode?.45:1);anodeRod.material.color.setHex(S.f.anode?0xb59c55:0xb9c0c8);
  screen.material.color.setHex(S.f.fvir?0x6b5532:0x9aa3ad);
  hoodM.color.setHex(S.f.spill?0x5a4a3a:0xa7adb4);
  // flue gas
  gasP.forEach((s,i)=>{s.visible=S.burner;if(!S.burner)return;s.userData.t=(s.userData.t+rdt*.35)%1;const t=s.userData.t;
    const spill=S.f.spill&&i%2===0;
    if(t<.75){s.position.set(Math.sin(t*40+i)*.06,.5+t/.75*4.45,Math.cos(t*40+i)*.06);}
    else if(spill){const u=(t-.75)/.25,a=i*2.3;s.position.set(Math.cos(a)*(.3+u*.9),4.95-u*.4,Math.sin(a)*(.3+u*.9));}
    else{s.position.set(0,4.95+(t-.75)/.25*2.2,0);}
    s.material.color.setHex(t<.4?0xffa65a:0xb7b0a8);s.material.opacity=spill&&t>.75?.9:.6;});
  const flow=S.tap&&S.inlet;
  waterP.forEach(s=>{s.visible=flow;if(!flow)return;s.userData.t=(s.userData.t+rdt*.5)%1;const t=s.userData.t;
    if(t<.25)s.position.set(CX,6.3-t/.25*1.5,CZ+.06);else{const bot=S.f.dip?4.1:1.0;s.position.set(CX,4.8-(t-.25)/.75*(4.8-bot),CZ);}});
  hotP.forEach(s=>{s.visible=flow;if(!flow)return;s.userData.t=(s.userData.t+rdt*.5)%1;s.position.set(HX,4.7+s.userData.t*1.6,HZ+.06);
    s.material.color.copy(tcol(outletT()||50));});
  drip.visible=S.tpOpen;puddle.visible=S.tpOpen;
  if(S.tpOpen){const t=(clock*1.2)%1;drip.position.set(-1.3,.48-t*.46,-.1);}
  controls.update();if(renderer)renderer.render(scene,camera);
  if(mode==='operate')liveOperate();
  uiT+=rdt;if(uiT>.4){uiT=0;chips.innerHTML=chipsHTML();
    if(mode==='operate'){const b=document.getElementById('tcbar');if(b){b.style.width=S.tc*100+'%';b.style.background=S.tc>.6?'#5fd38a':'#ffc24b';}
      const sq=panel.querySelector('ol.seq');if(sq)sq.outerHTML=seqHTML();}}
  requestAnimationFrame(loop);
}
render();requestAnimationFrame(loop);
})();
